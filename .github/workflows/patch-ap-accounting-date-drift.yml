name: Patch AP Accounting Date Drift

on:
  push:
    branches:
      - fix/ap-accounting-period-date-drift

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ap-accounting-period-date-drift

      - name: Correct and verify AP accounting date pins
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/lib/server/finance/accounts-payable.integration.test.ts')
          text = path.read_text()

          mistaken_assertion = """\t\texpect(journal).toMatchObject({
          \t\t\tsourceType: 'accounts_payable_invoice_approval',
          \t\t\tsourcePublicId: documentPublicId,
          \t\t\taccountingDate: '2026-08-21'
          \t\t});"""
          corrected_assertion = """\t\texpect(journal).toMatchObject({
          \t\t\tsourceType: 'accounts_payable_invoice_approval',
          \t\t\tsourcePublicId: documentPublicId
          \t\t});"""

          if mistaken_assertion not in text:
              raise SystemExit('Expected mistaken journal assertion was not found')
          text = text.replace(mistaken_assertion, corrected_assertion, 1)

          expected_counts = {
              "accountingDate: '2026-08-21'": 2,
              "accountingDate: '2026-08-25'": 2,
              "accountingDate: '2026-09-15'": 2,
          }
          for token, expected in expected_counts.items():
              actual = text.count(token)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrences of {token}, found {actual}')

          path.write_text(text)
          PY

      - name: Commit corrected deterministic accounting dates
        run: |
          if git diff --quiet; then
            echo "No correction produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/finance/accounts-payable.integration.test.ts
          git commit -m "Correct AP accounting date regression patch"
          git push origin HEAD:fix/ap-accounting-period-date-drift
