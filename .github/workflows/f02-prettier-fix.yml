name: F02 Prettier Fix

on:
  push:
    branches:
      - feat/f02-corporate-governance
    paths:
      - '.github/workflows/f02-prettier-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f02-corporate-governance

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Format governance workspace and self-clean
        run: |
          cd app
          pnpm exec prettier --write 'src/routes/(app)/governance/+page.svelte'
          cd ..
          rm .github/workflows/f02-prettier-fix.yml
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add 'app/src/routes/(app)/governance/+page.svelte' .github/workflows/f02-prettier-fix.yml
          git commit -m 'Format governance workspace after lint fix'
          git push origin HEAD:feat/f02-corporate-governance
