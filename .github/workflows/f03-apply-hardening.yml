name: F03 Apply Hardening

on:
  push:
    branches:
      - feat/f03-enterprise-performance-management
    paths:
      - '.github/workflows/f03-apply-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f03-enterprise-performance-management
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - working-directory: app
        run: pnpm install --frozen-lockfile
      - run: python scripts/f03-review-hardening.py
      - working-directory: app
        run: pnpm exec prettier --write src/lib/server/strategy/enterprise-performance-service.ts && pnpm check && pnpm lint
      - name: Commit hardened code
        run: |
          rm scripts/f03-review-hardening.py .github/workflows/f03-apply-hardening.yml
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add app/src/lib/server/strategy/enterprise-performance-service.ts scripts/f03-review-hardening.py .github/workflows/f03-apply-hardening.yml
          git commit -m 'F03: harden governed performance controls'
          git push origin HEAD:feat/f03-enterprise-performance-management
