name: Format Accounting Drillthrough

on:
  push:
    branches:
      - feat/accounting-report-source-drillthrough

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounting-report-source-drillthrough
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format changed application files
        working-directory: app
        run: >-
          pnpm exec prettier --write
          src/lib/server/finance/accounting-report-drillthrough.integration.test.ts
          'src/routes/(app)/finance/accounting/reports/[accountPublicId]/+page.server.ts'
          'src/routes/(app)/finance/accounting/reports/[accountPublicId]/+page.svelte'
          'src/routes/(app)/finance/accounting/reports/+page.svelte'
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/finance/accounting-report-drillthrough.integration.test.ts \
            'app/src/routes/(app)/finance/accounting/reports/[accountPublicId]/+page.server.ts' \
            'app/src/routes/(app)/finance/accounting/reports/[accountPublicId]/+page.svelte' \
            'app/src/routes/(app)/finance/accounting/reports/+page.svelte'
          git commit -m 'Format accounting report drill-through'
          git push origin HEAD:feat/accounting-report-source-drillthrough
