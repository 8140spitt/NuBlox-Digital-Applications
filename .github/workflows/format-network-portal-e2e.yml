name: Format Network portal acceptance

on:
  push:
    branches:
      - feature/external-access-kernel
    paths:
      - '.github/workflows/format-network-portal-e2e.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-access-kernel
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format portal collaboration acceptance
        working-directory: app
        run: pnpm exec prettier --write e2e/portal-collaboration.e2e.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/portal-collaboration.e2e.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Network portal collaboration acceptance"
          git push origin HEAD:feature/external-access-kernel
