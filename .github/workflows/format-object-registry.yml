name: Format object registry implementation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-object-registry.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Install V2 dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile

      - name: Format object registry files
        working-directory: appv2
        run: |
          pnpm exec prettier --write \
            src/lib/platform/object-template-registry.test.ts \
            src/lib/platform/object-template-registry.ts \
            src/lib/server/platform/object-template-library-service.ts \
            'src/routes/[tenant]/app/(protected)/lifecycle/+page.svelte' \
            'src/routes/[tenant]/app/(protected)/lifecycle/registry/+page.svelte' \
            'src/routes/[tenant]/app/(protected)/workflow/+page.svelte'

      - name: Commit formatting and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/src/lib/platform/object-template-registry.test.ts
          git add appv2/src/lib/platform/object-template-registry.ts
          git add appv2/src/lib/server/platform/object-template-library-service.ts
          git add 'appv2/src/routes/[tenant]/app/(protected)/lifecycle/+page.svelte'
          git add 'appv2/src/routes/[tenant]/app/(protected)/lifecycle/registry/+page.svelte'
          git add 'appv2/src/routes/[tenant]/app/(protected)/workflow/+page.svelte'
          git rm .github/workflows/format-object-registry.yml
          git commit -m "style(v2): format object registry implementation"
          git push origin HEAD:main
