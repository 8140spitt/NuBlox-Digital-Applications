name: F01 Closure Format Fix

on:
  push:
    branches: [feat/f01-digital-thread-closure]
    paths: [.github/workflows/f01-closure-format-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-digital-thread-closure
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Repair syntax and format changed source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/lib/server/strategy/canonical-performance-observation.integration.test.ts')
          text = p.read_text()
          old = """\t\t\t\t\tcredit_amount: line.credit\n\t\t\t\t}))\n\t\t\t.execute();\n"""
          new = """\t\t\t\t\tcredit_amount: line.credit\n\t\t\t\t}))\n\t\t\t)\n\t\t\t.execute();\n"""
          if old not in text:
              raise SystemExit('syntax repair marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          cd app
          pnpm exec prettier --write \
            e2e/seed-authenticated-fixture.mjs \
            e2e/strategy-performance-foresight.e2e.ts \
            src/lib/server/strategy/canonical-kpi-source-service.ts \
            src/lib/server/strategy/canonical-performance-observation-service.ts \
            src/lib/server/strategy/canonical-performance-observation.integration.test.ts \
            src/lib/server/strategy/performance-foresight-service.ts \
            src/lib/server/strategy/performance-foresight.integration.test.ts \
            'src/routes/(app)/strategy/performance/+page.server.ts' \
            'src/routes/(app)/strategy/performance/+page.svelte'
          cd ..
          rm .github/workflows/f01-closure-format-fix.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix and format F01 closure tranche"
          git push origin HEAD:feat/f01-digital-thread-closure
