name: F05 permission API fix

on:
  push:
    branches:
      - feat/f05-product-service-innovation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f05-product-service-innovation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Correct permission API and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/product-service/product-service-lifecycle-service.ts')
          text = path.read_text()
          old = """\tprivate async requirePermission(actor: TenantActorContext, permission: PermissionKey) {\n\t\tawait this.requireActor(actor);\n\t\tif (!(await new PermissionService(this.db).isAllowed(actor, permission))) {\n\t\t\tthrow new TenantAccessError(`Permission ${permission} is required.`);\n\t\t}\n\t}\n"""
          new = """\tprivate async requirePermission(actor: TenantActorContext, permission: PermissionKey) {\n\t\tawait this.requireActor(actor);\n\t\tconst decision = await new PermissionService(this.db).decide(actor, permission);\n\t\tif (!decision.allowed) {\n\t\t\tthrow new TenantAccessError(`Permission ${permission} is required.`);\n\t\t}\n\t}\n"""
          if old not in text:
              raise SystemExit('requirePermission pattern not found')
          text = text.replace(old, new, 1)
          old = """\t\tconst permissions = new PermissionService(this.db);\n\t\treturn {\n\t\t\t...core,\n\t\t\t...lifecycle,\n\t\t\tcanManage: await permissions.isAllowed(actor, 'product_service.manage'),\n\t\t\tcanApprove: await permissions.isAllowed(actor, 'product_service.approve')\n\t\t};\n"""
          new = """\t\tconst permissions = new PermissionService(this.db);\n\t\tconst [manage, approve] = await Promise.all([\n\t\t\tpermissions.decide(actor, 'product_service.manage'),\n\t\t\tpermissions.decide(actor, 'product_service.approve')\n\t\t]);\n\t\treturn {\n\t\t\t...core,\n\t\t\t...lifecycle,\n\t\t\tcanManage: manage.allowed,\n\t\t\tcanApprove: approve.allowed\n\t\t};\n"""
          if old not in text:
              raise SystemExit('workspace permission pattern not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cd app
          pnpm exec prettier --write src/lib/server/product-service/product-service-lifecycle-service.ts
          pnpm exec eslint src/lib/server/product-service/product-service-lifecycle-service.ts
      - name: Commit correction and remove helper workflow
        run: |
          rm .github/workflows/f05-permission-api-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/product-service/product-service-lifecycle-service.ts .github/workflows/f05-permission-api-fix.yml
          git commit -m 'F05: use canonical permission decisions'
          git push origin HEAD:feat/f05-product-service-innovation
