name: Slice 4 Browser Repair

on:
  push:
    branches:
      - product/v1-procurement-commercial-control
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-procurement-commercial-control
      - name: Scope package description locator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/e2e/procurement-commercial-control.e2e.ts')
          text = path.read_text()
          old = """\tawait packagePanel\n\t\t.getByLabel('Description')\n\t\t.fill('Containment material and installation requirement.');\n"""
          new = """\tawait packagePanel\n\t\t.locator('textarea[name=\"description\"]')\n\t\t.fill('Containment material and installation requirement.');\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one package description locator, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit browser repair
        run: |
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add app/e2e/procurement-commercial-control.e2e.ts
          git commit -m 'Scope Slice 4 package description locator'
          git push origin HEAD:product/v1-procurement-commercial-control
