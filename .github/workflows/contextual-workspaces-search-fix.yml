name: Contextual Workspaces Search Fix

on:
  push:
    branches:
      - product/v1-contextual-workspaces
    paths:
      - '.github/workflows/contextual-workspaces-search-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-contextual-workspaces
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prefer specialist directory labels in workspace search
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/routes/(app)/+layout.svelte')
          text = path.read_text()
          old = 'const items = workspaceItems([...data.navigation, ...data.workspaceDirectory]);'
          new = 'const items = workspaceItems([...data.workspaceDirectory, ...data.navigation]);'
          if old not in text:
              raise SystemExit('Expected workspace search ordering not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install and format
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write 'src/routes/(app)/+layout.svelte'
      - name: Commit search fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/src/routes/(app)/+layout.svelte'
          git commit -m "Prefer specialist workspace labels in search" || exit 0
          git push origin HEAD:product/v1-contextual-workspaces
