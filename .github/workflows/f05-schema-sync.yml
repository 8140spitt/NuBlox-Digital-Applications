name: F05 schema sync

on:
  push:
    branches:
      - feat/f05-product-service-innovation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_f05_schema_sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f05-product-service-innovation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Migrate and regenerate types
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:types
          pnpm exec prettier --write src/lib/server/product-service/product-service.integration.test.ts
      - name: Synchronise schema guard counts
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          table_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nublox_f05_schema_sync' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations';")
          fk_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='nublox_f05_schema_sync';")
          check_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='nublox_f05_schema_sync' AND constraint_type='CHECK';")
          echo "F05 schema: $table_count tables, $fk_count FKs, $check_count CHECKs"
          python - "$table_count" "$fk_count" "$check_count" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path('.github/workflows/database-migration-validation.yml')
          s = p.read_text()
          s = re.sub(r'test "\$table_count" = \'\d+\'', f'test "$table_count" = \'{sys.argv[1]}\'', s)
          s = re.sub(r'test "\$fk_count" = \'\d+\'', f'test "$fk_count" = \'{sys.argv[2]}\'', s)
          s = re.sub(r'test "\$check_count" = \'\d+\'', f'test "$check_count" = \'{sys.argv[3]}\'', s)
          p.write_text(s)
          PY
      - name: Commit generated truth and remove helper
        run: |
          rm .github/workflows/f05-schema-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'F05: synchronise lifecycle schema truth'
          git push origin HEAD:feat/f05-product-service-innovation
