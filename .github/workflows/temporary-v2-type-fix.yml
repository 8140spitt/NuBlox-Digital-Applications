name: Temporary V2 Type Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-v2-type-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Apply tenant route typing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'appv2/src/lib/components/auth/SignInSurface.svelte': [
                  ('resolve(destination)', 'resolve(destination as Pathname)'),
                  ('resolve(startHref)', 'resolve(startHref as Pathname)'),
                  ('resolve(forgotPasswordHref)', 'resolve(forgotPasswordHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/app/(protected)/+layout.svelte': [
                  ('resolve(routes.appSignIn(data.tenant.slug))', 'resolve(routes.appSignIn(data.tenant.slug) as Pathname)'),
                  ('resolve(routes.dashboard(data.tenant.slug))', 'resolve(routes.dashboard(data.tenant.slug) as Pathname)'),
                  ('resolve(item.href)', 'resolve(item.href as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/app/auth/forgot-password/+page.svelte': [
                  ('const tenant = $derived(page.params.tenant);', "const tenant = $derived(page.params.tenant ?? '');"),
                  ('resolve(signInHref)', 'resolve(signInHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/app/auth/invite/[token]/+page.svelte': [
                  ('resolve(`${data.verifyEmailHref}?email=${encodeURIComponent(data.invitation.email)}`)', 'resolve(`${data.verifyEmailHref}?email=${encodeURIComponent(data.invitation.email)}` as Pathname)'),
                  ('resolve(data.signInHref)', 'resolve(data.signInHref as Pathname)'),
                  ('resolve(invitationSignIn)', 'resolve(invitationSignIn as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/app/auth/no-access/+page.svelte': [
                  ('resolve(data.signInHref)', 'resolve(data.signInHref as Pathname)'),
                  ('resolve(data.startHref)', 'resolve(data.startHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/app/auth/reset-password/+page.svelte': [
                  ('const tenant = $derived(page.params.tenant);', "const tenant = $derived(page.params.tenant ?? '');"),
                  ('resolve(routes.appSignIn(tenant))', 'resolve(routes.appSignIn(tenant) as Pathname)'),
                  ('resolve(forgotPasswordHref)', 'resolve(forgotPasswordHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/app/auth/verify-email/+page.svelte': [
                  ('const tenant = $derived(page.params.tenant);', "const tenant = $derived(page.params.tenant ?? '');"),
                  ('resolve(signInHref)', 'resolve(signInHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/portal/[crmParty]/(protected)/+layout.svelte': [
                  ('resolve(routes.portalSignIn(data.tenant.slug, data.crmParty.slug))', 'resolve(routes.portalSignIn(data.tenant.slug, data.crmParty.slug) as Pathname)'),
                  ('resolve(dashboardHref)', 'resolve(dashboardHref as Pathname)'),
                  ('resolve(projectsHref)', 'resolve(projectsHref as Pathname)'),
                  ('resolve(actionsHref)', 'resolve(actionsHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/portal/[crmParty]/auth/forgot-password/+page.svelte': [
                  ('const tenant = $derived(page.params.tenant);', "const tenant = $derived(page.params.tenant ?? '');"),
                  ('const crmParty = $derived(page.params.crmParty);', "const crmParty = $derived(page.params.crmParty ?? '');"),
                  ('resolve(signInHref)', 'resolve(signInHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/portal/[crmParty]/auth/no-access/+page.svelte': [
                  ('resolve(data.signInHref)', 'resolve(data.signInHref as Pathname)'),
                  ('resolve(data.startHref)', 'resolve(data.startHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/portal/[crmParty]/auth/reset-password/+page.svelte': [
                  ('const tenant = $derived(page.params.tenant);', "const tenant = $derived(page.params.tenant ?? '');"),
                  ('const crmParty = $derived(page.params.crmParty);', "const crmParty = $derived(page.params.crmParty ?? '');"),
                  ('resolve(routes.portalSignIn(tenant, crmParty))', 'resolve(routes.portalSignIn(tenant, crmParty) as Pathname)'),
                  ('resolve(forgotHref)', 'resolve(forgotHref as Pathname)'),
              ],
              'appv2/src/routes/[tenant]/portal/[crmParty]/auth/verify-email/+page.svelte': [
                  ('const tenant = $derived(page.params.tenant);', "const tenant = $derived(page.params.tenant ?? '');"),
                  ('const crmParty = $derived(page.params.crmParty);', "const crmParty = $derived(page.params.crmParty ?? '');"),
                  ('resolve(signInHref)', 'resolve(signInHref as Pathname)'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old}')
                  text = text.replace(old, new)
              if "import { resolve } from '$app/paths';" in text and "import type { Pathname } from '$app/types';" not in text:
                  text = text.replace(
                      "import { resolve } from '$app/paths';",
                      "import { resolve } from '$app/paths';\n\timport type { Pathname } from '$app/types';"
                  )
              path.write_text(text)

          path = Path('appv2/src/routes/[tenant]/app/auth/invite/[token]/+page.server.ts')
          text = path.read_text()
          old = "\t\tconst rawToken = params.token;\n\t\tif (!rawToken) throw error(400, 'Invitation token is required.');\n\t\tawait requireInvitationForTenant(rawToken, params.tenant);"
          new = "\t\tconst rawToken = params.token;\n\t\tconst tenant = params.tenant;\n\t\tif (!rawToken) throw error(400, 'Invitation token is required.');\n\t\tif (!tenant) throw error(400, 'Tenant route context is required.');\n\t\tawait requireInvitationForTenant(rawToken, tenant);"
          if old not in text:
              raise SystemExit('Missing invitation action guard block')
          text = text.replace(old, new)
          text = text.replace('throw redirect(303, routes.app(params.tenant));', 'throw redirect(303, routes.app(tenant));')
          path.write_text(text)
          PY
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        working-directory: appv2
        run: pnpm exec prettier --write src
      - name: Lint V2
        working-directory: appv2
        run: pnpm lint
      - name: Type-check V2
        working-directory: appv2
        run: pnpm check
      - name: Install Playwright Chromium
        working-directory: appv2
        run: pnpm exec playwright install --with-deps chromium
      - name: Test V2
        working-directory: appv2
        run: pnpm test:unit
      - name: Build V2
        working-directory: appv2
        run: pnpm build
      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/src
          git diff --cached --quiet && exit 0
          git commit -m "fix(v2): type tenant-first navigation boundaries"
          git push origin main
