name: Temporary workflow administration fixer

on:
  push:
    branches:
      - feat/platform-workflow-administration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-workflow-administration
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Apply typecheck cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('appv2/src/routes/[tenant]/app/(protected)/workflow/+page.svelte')
          text = page.read_text()
          text = text.replace("\timport { resolve } from '$app/paths';\n", '')
          text = text.replace("href={resolve(`${appPath(tenant, 'workflow')}/${template.publicId}`)}", "href={`${appPath(tenant, 'workflow')}/${template.publicId}`}")
          page.write_text(text)

          detail = Path('appv2/src/routes/[tenant]/app/(protected)/workflow/[template]/+page.svelte')
          text = detail.read_text()
          text = text.replace('\t.node-meta,\n\t.participant-row,\n\t.template-meta {', '\t.node-meta,\n\t.participant-row {')
          detail.write_text(text)
          PY
      - working-directory: appv2
        run: >-
          pnpm exec prettier --write
          'src/routes/[tenant]/app/(protected)/workflow/+page.svelte'
          'src/routes/[tenant]/app/(protected)/workflow/[template]/+page.svelte'
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'appv2/src/routes/[tenant]/app/(protected)/workflow/+page.svelte' \
                  'appv2/src/routes/[tenant]/app/(protected)/workflow/[template]/+page.svelte'
          git commit -m 'fix(v2): satisfy workflow route type contracts'
          git push origin HEAD:feat/platform-workflow-administration
