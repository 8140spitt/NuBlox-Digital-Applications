name: Temporary workflow administration fixer

on:
  push:
    branches:
      - feat/platform-workflow-administration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/platform-workflow-administration
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install V2 dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          svelte = Path('appv2/src/routes/[tenant]/app/(protected)/workflow/[template]/+page.svelte')
          text = svelte.read_text()
          text = text.replace('{#each template.nodes as node}', '{#each template.nodes as node (node.publicId)}')
          text = text.replace('{#each template.versionHistory as version}', '{#each template.versionHistory as version (version.label)}')
          svelte.write_text(text)

          service = Path('appv2/src/lib/server/platform/workflow-admin-service.ts')
          text = service.read_text()
          text = text.replace('link.is_loop AS loop', 'link.is_loop AS `loop`')
          text = text.replace('connection.execute<WorkflowRoleAdmin[]>(', 'connection.execute<Array<RowDataPacket & WorkflowRoleAdmin>>(')
          service.write_text(text)
          PY
      - name: Format changed files
        working-directory: appv2
        run: >-
          pnpm exec prettier --write
          'src/lib/server/platform/workflow-admin-service.ts'
          'src/routes/[tenant]/app/(protected)/workflow/[template]/+page.svelte'
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appv2/src/lib/server/platform/workflow-admin-service.ts \
                  'appv2/src/routes/[tenant]/app/(protected)/workflow/[template]/+page.svelte'
          git commit -m 'fix(v2): satisfy workflow administration CI contracts'
          git push origin HEAD:feat/platform-workflow-administration
