name: Temporary F01 Approval Readiness Refinement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-f01-approval-readiness.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile

      - name: Remove stale CSS selector
        run: sed -i '/\.form-actions a {/,/}/d' 'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte'

      - name: Format refinement
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/components/ui/ReadinessChecklist.svelte src/lib/components/ui/index.ts src/lib/components/ui/README.md src/lib/server/strategy/approval-readiness-service.ts 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/+page.server.ts' 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/+page.svelte' 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte'

      - name: Install Chromium
        working-directory: appv2
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        working-directory: appv2
        run: pnpm lint

      - name: Type-check
        working-directory: appv2
        run: pnpm check

      - name: Unit tests
        working-directory: appv2
        run: pnpm test:unit

      - name: Production build
        working-directory: appv2
        run: pnpm build

      - name: Commit validated refinement
        run: |
          rm .github/workflows/temporary-f01-approval-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v2): refine F01 approval readiness UX'
          git push origin main
