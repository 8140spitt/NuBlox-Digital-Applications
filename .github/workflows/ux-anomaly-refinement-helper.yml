name: UX anomaly refinement helper

on:
  push:
    branches:
      - product/v1-ux-anomaly-refinement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-ux-anomaly-refinement

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Apply contextual workflow refinements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          migration = Path('database/migrations/20260821122500_crm_platform_organisation_links.sql')
          migration.write_text("""-- NuBlox CRM-to-platform organisation linkage for controlled collaboration\n-- A tenant-private CRM organisation may explicitly reference one NuBlox platform organisation.\n-- No company-name matching or unrestricted platform directory is introduced.\n-- migrate:up transaction:false\n\nALTER TABLE party_organisations\n    ADD COLUMN linked_organisation_id BIGINT UNSIGNED NULL AFTER trading_name,\n    ADD UNIQUE KEY uq_party_organisations_linked_org (organisation_id, linked_organisation_id),\n    ADD KEY idx_party_organisations_linked_org (linked_organisation_id),\n    ADD CONSTRAINT fk_party_organisations_linked_org\n        FOREIGN KEY (linked_organisation_id)\n        REFERENCES organisations (id)\n        ON UPDATE RESTRICT\n        ON DELETE RESTRICT,\n    ADD CONSTRAINT ck_party_organisations_not_self\n        CHECK (linked_organisation_id IS NULL OR linked_organisation_id <> organisation_id);\n\n-- migrate:down transaction:false\n-- Released CRM collaboration links are forward-only because project invitation and audit\n-- history may depend on the explicit association. Non-production environments are rebuilt.\nSELECT 1;\n""")

          replace_once(
              'app/src/lib/server/db/generated/database.d.ts',
              '''export interface PartyOrganisations {\n  created_at: Generated<Date>;\n  legal_name: string;\n  organisation_id: string;\n  party_id: string;\n  trading_name: string | null;\n}''',
              '''export interface PartyOrganisations {\n  created_at: Generated<Date>;\n  legal_name: string;\n  linked_organisation_id: string | null;\n  organisation_id: string;\n  party_id: string;\n  trading_name: string | null;\n}'''
          )

          replace_once(
              'app/src/lib/server/crm/crm-repository.ts',
              '''export type CrmPersonAffiliation = {\n\torganisationPartyId: string;\n\torganisationPublicId: string;\n\torganisationName: string;\n\torganisationStatus: CrmPartyStatus;\n\tjobTitle: string | null;\n\tdepartment: string | null;\n\tisPrimaryContact: boolean;\n\tstartedOn: Date | null;\n};''',
              '''export type CrmPersonAffiliation = {\n\torganisationPartyId: string;\n\torganisationPublicId: string;\n\torganisationName: string;\n\torganisationStatus: CrmPartyStatus;\n\tjobTitle: string | null;\n\tdepartment: string | null;\n\tisPrimaryContact: boolean;\n\tstartedOn: Date | null;\n};\n\nexport type CrmPlatformOrganisationLink = {\n\torganisationId: string;\n\torganisationPublicId: string;\n\torganisationName: string;\n\tstatus: string;\n};\n\nexport type CrmCollaborationOrganisation = {\n\tpartyId: string;\n\tpartyPublicId: string;\n\tdisplayName: string;\n\tlinkedOrganisationId: string | null;\n\tlinkedOrganisationPublicId: string | null;\n\tlinkedOrganisationName: string | null;\n\tlinkedOrganisationStatus: string | null;\n};'''
          )

          crm_repo_marker = '''\tasync listOrganisationContacts(\n\t\torganisationId: string,\n\t\torganisationPartyId: string\n\t): Promise<CrmOrganisationContact[]> {'''
          crm_repo_methods = '''\tasync findPlatformOrganisationLink(\n\t\torganisationId: string,\n\t\tpartyId: string\n\t): Promise<CrmPlatformOrganisationLink | null> {\n\t\tconst row = await this.db\n\t\t\t.selectFrom('party_organisations as company')\n\t\t\t.innerJoin('organisations as linked', 'linked.id', 'company.linked_organisation_id')\n\t\t\t.select([\n\t\t\t\t'linked.id as organisationId',\n\t\t\t\t'linked.public_id as organisationPublicId',\n\t\t\t\t'linked.legal_name as legalName',\n\t\t\t\t'linked.trading_name as tradingName',\n\t\t\t\t'linked.status as status'\n\t\t\t])\n\t\t\t.where('company.organisation_id', '=', organisationId)\n\t\t\t.where('company.party_id', '=', partyId)\n\t\t\t.executeTakeFirst();\n\t\treturn row\n\t\t\t? {\n\t\t\t\t\torganisationId: row.organisationId,\n\t\t\t\t\torganisationPublicId: row.organisationPublicId,\n\t\t\t\t\torganisationName: row.tradingName?.trim() || row.legalName,\n\t\t\t\t\tstatus: row.status\n\t\t\t\t}\n\t\t\t: null;\n\t}\n\n\tasync findActivePlatformOrganisationByPublicId(\n\t\tpublicId: string\n\t): Promise<CrmPlatformOrganisationLink | null> {\n\t\tconst row = await this.db\n\t\t\t.selectFrom('organisations')\n\t\t\t.select(['id', 'public_id', 'legal_name', 'trading_name', 'status'])\n\t\t\t.where('public_id', '=', publicId)\n\t\t\t.where('status', '=', 'active')\n\t\t\t.executeTakeFirst();\n\t\treturn row\n\t\t\t? {\n\t\t\t\t\torganisationId: row.id,\n\t\t\t\t\torganisationPublicId: row.public_id,\n\t\t\t\t\torganisationName: row.trading_name?.trim() || row.legal_name,\n\t\t\t\t\tstatus: row.status\n\t\t\t\t}\n\t\t\t: null;\n\t}\n\n\tasync findCrmOrganisationByLinkedOrganisationId(\n\t\torganisationId: string,\n\t\tlinkedOrganisationId: string\n\t): Promise<{ partyPublicId: string; displayName: string } | null> {\n\t\tconst row = await this.db\n\t\t\t.selectFrom('party_organisations as company')\n\t\t\t.innerJoin('parties as party', (join) =>\n\t\t\t\tjoin\n\t\t\t\t\t.onRef('party.id', '=', 'company.party_id')\n\t\t\t\t\t.onRef('party.organisation_id', '=', 'company.organisation_id')\n\t\t\t)\n\t\t\t.select([\n\t\t\t\t'party.public_id as partyPublicId',\n\t\t\t\t'company.legal_name as legalName',\n\t\t\t\t'company.trading_name as tradingName'\n\t\t\t])\n\t\t\t.where('company.organisation_id', '=', organisationId)\n\t\t\t.where('company.linked_organisation_id', '=', linkedOrganisationId)\n\t\t\t.executeTakeFirst();\n\t\treturn row\n\t\t\t? {\n\t\t\t\t\tpartyPublicId: row.partyPublicId,\n\t\t\t\t\tdisplayName: organisationDisplayName(row)\n\t\t\t\t}\n\t\t\t: null;\n\t}\n\n\tasync setPlatformOrganisationLink(\n\t\torganisationId: string,\n\t\tpartyId: string,\n\t\tlinkedOrganisationId: string | null\n\t): Promise<void> {\n\t\tawait this.db\n\t\t\t.updateTable('party_organisations')\n\t\t\t.set({ linked_organisation_id: linkedOrganisationId })\n\t\t\t.where('organisation_id', '=', organisationId)\n\t\t\t.where('party_id', '=', partyId)\n\t\t\t.executeTakeFirstOrThrow();\n\t}\n\n\tasync listCollaborationOrganisations(\n\t\torganisationId: string\n\t): Promise<CrmCollaborationOrganisation[]> {\n\t\tconst rows = await this.db\n\t\t\t.selectFrom('parties as party')\n\t\t\t.innerJoin('party_organisations as company', (join) =>\n\t\t\t\tjoin\n\t\t\t\t\t.onRef('company.party_id', '=', 'party.id')\n\t\t\t\t\t.onRef('company.organisation_id', '=', 'party.organisation_id')\n\t\t\t)\n\t\t\t.leftJoin('organisations as linked', 'linked.id', 'company.linked_organisation_id')\n\t\t\t.select([\n\t\t\t\t'party.id as partyId',\n\t\t\t\t'party.public_id as partyPublicId',\n\t\t\t\t'company.legal_name as legalName',\n\t\t\t\t'company.trading_name as tradingName',\n\t\t\t\t'linked.id as linkedOrganisationId',\n\t\t\t\t'linked.public_id as linkedOrganisationPublicId',\n\t\t\t\t'linked.legal_name as linkedLegalName',\n\t\t\t\t'linked.trading_name as linkedTradingName',\n\t\t\t\t'linked.status as linkedOrganisationStatus'\n\t\t\t])\n\t\t\t.where('party.organisation_id', '=', organisationId)\n\t\t\t.where('party.party_kind', '=', 'organisation')\n\t\t\t.where('party.status', '=', 'active')\n\t\t\t.orderBy('company.legal_name', 'asc')\n\t\t\t.execute();\n\t\treturn rows.map((row) => ({\n\t\t\tpartyId: row.partyId,\n\t\t\tpartyPublicId: row.partyPublicId,\n\t\t\tdisplayName: organisationDisplayName(row),\n\t\t\tlinkedOrganisationId: row.linkedOrganisationId,\n\t\t\tlinkedOrganisationPublicId: row.linkedOrganisationPublicId,\n\t\t\tlinkedOrganisationName:\n\t\t\t\trow.linkedLegalName === null\n\t\t\t\t\t? null\n\t\t\t\t\t: row.linkedTradingName?.trim() || row.linkedLegalName,\n\t\t\tlinkedOrganisationStatus: row.linkedOrganisationStatus\n\t\t}));\n\t}\n\n\tasync findCollaborationOrganisationByPublicId(\n\t\torganisationId: string,\n\t\tpartyPublicId: string\n\t): Promise<CrmCollaborationOrganisation | null> {\n\t\tconst organisations = await this.listCollaborationOrganisations(organisationId);\n\t\treturn organisations.find((candidate) => candidate.partyPublicId === partyPublicId) ?? null;\n\t}\n\n'''
          replace_once('app/src/lib/server/crm/crm-repository.ts', crm_repo_marker, crm_repo_methods + crm_repo_marker)

          replace_once(
              'app/src/lib/server/crm/crm-service.ts',
              '''\ttype CrmOrganisationContact,\n\ttype CrmPartyDetail,''',
              '''\ttype CrmOrganisationContact,\n\ttype CrmPlatformOrganisationLink,\n\ttype CrmPartyDetail,'''
          )
          replace_once(
              'app/src/lib/server/crm/crm-service.ts',
              '''\tcontactCandidates: CrmPartySummary[];\n};''',
              '''\tcontactCandidates: CrmPartySummary[];\n\tplatformOrganisationLink: CrmPlatformOrganisationLink | null;\n};'''
          )
          replace_once(
              'app/src/lib/server/crm/crm-service.ts',
              '''\t\tconst candidatesPromise =\n\t\t\tparty.kind === 'organisation' && canManageContacts\n\t\t\t\t? repository.listParties(actor.organisationId, { kind: 'person', status: 'active' })\n\t\t\t\t: Promise.resolve([]);\n\t\tconst [roleTypes, contacts, affiliations, candidateRows] = await Promise.all([\n\t\t\troleTypesPromise,\n\t\t\tcontactsPromise,\n\t\t\taffiliationsPromise,\n\t\t\tcandidatesPromise\n\t\t]);''',
              '''\t\tconst candidatesPromise =\n\t\t\tparty.kind === 'organisation' && canManageContacts\n\t\t\t\t? repository.listParties(actor.organisationId, { kind: 'person', status: 'active' })\n\t\t\t\t: Promise.resolve([]);\n\t\tconst platformOrganisationLinkPromise =\n\t\t\tparty.kind === 'organisation'\n\t\t\t\t? repository.findPlatformOrganisationLink(actor.organisationId, party.id)\n\t\t\t\t: Promise.resolve(null);\n\t\tconst [roleTypes, contacts, affiliations, candidateRows, platformOrganisationLink] =\n\t\t\tawait Promise.all([\n\t\t\t\troleTypesPromise,\n\t\t\t\tcontactsPromise,\n\t\t\t\taffiliationsPromise,\n\t\t\t\tcandidatesPromise,\n\t\t\t\tplatformOrganisationLinkPromise\n\t\t\t]);'''
          )
          replace_once(
              'app/src/lib/server/crm/crm-service.ts',
              '''\t\t\tcontacts,\n\t\t\taffiliations,\n\t\t\tcontactCandidates: candidateRows.filter((candidate) => !currentPersonIds.has(candidate.id))\n\t\t};''',
              '''\t\t\tcontacts,\n\t\t\taffiliations,\n\t\t\tcontactCandidates: candidateRows.filter((candidate) => !currentPersonIds.has(candidate.id)),\n\t\t\tplatformOrganisationLink\n\t\t};'''
          )

          crm_service_marker = '''\tasync createOrganisationContact(\n\t\tactor: TenantActorContext,'''
          crm_service_methods = '''\tasync linkPlatformOrganisation(\n\t\tactor: TenantActorContext,\n\t\tinput: { partyPublicId: string; organisationPublicId: string }\n\t): Promise<void> {\n\t\tawait this.assertActiveActor(actor);\n\t\tawait this.assertManage(actor, 'crm.party.manage');\n\t\tconst partyPublicId = normalisePublicId(input.partyPublicId, 'CRM party ID');\n\t\tconst organisationPublicId = normalisePublicId(\n\t\t\tinput.organisationPublicId,\n\t\t\t'NuBlox organisation ID'\n\t\t);\n\t\treturn this.db.transaction().execute(async (trx) => {\n\t\t\tconst membership = await this.assertActiveActor(actor, trx);\n\t\t\tawait this.assertManage(actor, 'crm.party.manage', trx);\n\t\t\tconst repository = new CrmRepository(trx);\n\t\t\tconst party = await repository.findPartyByPublicId(actor.organisationId, partyPublicId);\n\t\t\tif (!party || party.kind !== 'organisation')\n\t\t\t\tthrow new RecordNotFoundError('CRM organisation not found.');\n\t\t\tif (party.status === 'archived')\n\t\t\t\tthrow new CrmValidationError('An archived CRM organisation cannot be linked for collaboration.');\n\t\t\tconst target = await repository.findActivePlatformOrganisationByPublicId(organisationPublicId);\n\t\t\tif (!target)\n\t\t\t\tthrow new CrmValidationError('No active NuBlox organisation matches that exact organisation ID.');\n\t\t\tif (target.organisationId === actor.organisationId)\n\t\t\t\tthrow new CrmValidationError('A CRM organisation cannot be linked to your own NuBlox organisation.');\n\t\t\tconst existing = await repository.findCrmOrganisationByLinkedOrganisationId(\n\t\t\t\tactor.organisationId,\n\t\t\t\ttarget.organisationId\n\t\t\t);\n\t\t\tif (existing && existing.partyPublicId !== partyPublicId)\n\t\t\t\tthrow new CrmValidationError(\n\t\t\t\t\t`That NuBlox organisation is already linked to ${existing.displayName}.`\n\t\t\t\t);\n\t\t\tawait repository.setPlatformOrganisationLink(\n\t\t\t\tactor.organisationId,\n\t\t\t\tparty.id,\n\t\t\t\ttarget.organisationId\n\t\t\t);\n\t\t\tawait new AuditRepository(trx).append({\n\t\t\t\teventPublicId: this.publicIdFactory(),\n\t\t\t\tactingOrganisationId: actor.organisationId,\n\t\t\t\tactorUserId: actor.userId,\n\t\t\t\tactorMemberId: membership.id,\n\t\t\t\tactionKey: 'crm.party.platform_organisation_linked',\n\t\t\t\tsubjectType: 'crm_party',\n\t\t\t\tsubjectPublicId: partyPublicId,\n\t\t\t\tcorrelationId: actor.correlationId,\n\t\t\t\tchangeSummary: {\n\t\t\t\t\torganisationPublicId: target.organisationPublicId,\n\t\t\t\t\torganisationName: target.organisationName\n\t\t\t\t}\n\t\t\t});\n\t\t});\n\t}\n\n\tasync unlinkPlatformOrganisation(\n\t\tactor: TenantActorContext,\n\t\tpartyPublicIdInput: string\n\t): Promise<void> {\n\t\tawait this.assertActiveActor(actor);\n\t\tawait this.assertManage(actor, 'crm.party.manage');\n\t\tconst partyPublicId = normalisePublicId(partyPublicIdInput, 'CRM party ID');\n\t\treturn this.db.transaction().execute(async (trx) => {\n\t\t\tconst membership = await this.assertActiveActor(actor, trx);\n\t\t\tawait this.assertManage(actor, 'crm.party.manage', trx);\n\t\t\tconst repository = new CrmRepository(trx);\n\t\t\tconst party = await repository.findPartyByPublicId(actor.organisationId, partyPublicId);\n\t\t\tif (!party || party.kind !== 'organisation')\n\t\t\t\tthrow new RecordNotFoundError('CRM organisation not found.');\n\t\t\tconst current = await repository.findPlatformOrganisationLink(actor.organisationId, party.id);\n\t\t\tif (!current) throw new CrmValidationError('This CRM organisation is not linked to NuBlox.');\n\t\t\tawait repository.setPlatformOrganisationLink(actor.organisationId, party.id, null);\n\t\t\tawait new AuditRepository(trx).append({\n\t\t\t\teventPublicId: this.publicIdFactory(),\n\t\t\t\tactingOrganisationId: actor.organisationId,\n\t\t\t\tactorUserId: actor.userId,\n\t\t\t\tactorMemberId: membership.id,\n\t\t\t\tactionKey: 'crm.party.platform_organisation_unlinked',\n\t\t\t\tsubjectType: 'crm_party',\n\t\t\t\tsubjectPublicId: partyPublicId,\n\t\t\t\tcorrelationId: actor.correlationId,\n\t\t\t\tchangeSummary: { organisationPublicId: current.organisationPublicId }\n\t\t\t});\n\t\t});\n\t}\n\n'''
          replace_once('app/src/lib/server/crm/crm-service.ts', crm_service_marker, crm_service_methods + crm_service_marker)

          replace_once(
              'app/src/routes/(app)/crm/[partyPublicId]/+page.server.ts',
              '''\tcreateContact: async ({ request, locals, params }) => {''',
              '''\tlinkPlatformOrganisation: async ({ request, locals, params }) => {\n\t\tconst actor = actorFromLocals(locals);\n\t\tif (!actor)\n\t\t\treturn fail(401, {\n\t\t\t\tplatformLinkError: 'Authentication and organisation context are required.'\n\t\t\t});\n\t\tconst data = await request.formData();\n\t\ttry {\n\t\t\tawait new CrmService(getDatabase()).linkPlatformOrganisation(actor, {\n\t\t\t\tpartyPublicId: params.partyPublicId,\n\t\t\t\torganisationPublicId: String(data.get('organisationPublicId') ?? '')\n\t\t\t});\n\t\t} catch (error) {\n\t\t\treturn mutationFailure(error, 'platformLinkError');\n\t\t}\n\t\tthrow redirect(303, `/crm/${encodeURIComponent(params.partyPublicId)}#nublox-link`);\n\t},\n\n\tunlinkPlatformOrganisation: async ({ locals, params }) => {\n\t\tconst actor = actorFromLocals(locals);\n\t\tif (!actor)\n\t\t\treturn fail(401, {\n\t\t\t\tplatformLinkError: 'Authentication and organisation context are required.'\n\t\t\t});\n\t\ttry {\n\t\t\tawait new CrmService(getDatabase()).unlinkPlatformOrganisation(actor, params.partyPublicId);\n\t\t} catch (error) {\n\t\t\treturn mutationFailure(error, 'platformLinkError');\n\t\t}\n\t\tthrow redirect(303, `/crm/${encodeURIComponent(params.partyPublicId)}#nublox-link`);\n\t},\n\n\tcreateContact: async ({ request, locals, params }) => {'''
          )

          replace_once(
              'app/src/routes/(app)/crm/+page.svelte',
              '''<svelte:head>\n\t<title>CRM · NuBlox</title>\n</svelte:head>''',
              '''<svelte:head>\n\t<title>Customers · NuBlox</title>\n</svelte:head>'''
          )
          replace_once(
              'app/src/routes/(app)/crm/+page.svelte',
              '''\t\t<p class="eyebrow">Relationships</p>\n\t\t<h1>CRM</h1>''',
              '''\t\t<p class="eyebrow">Customers &amp; pipeline</p>\n\t\t<h1>Customers &amp; contacts</h1>'''
          )
          replace_once(
              'app/src/routes/(app)/crm/+page.svelte',
              '''{#if data.canManage}<a class="header-action" href="#new-party">Add CRM record</a>{/if}''',
              '''{#if data.canManage}<a class="header-action" href="#new-party">Add customer or contact</a>{/if}'''
          )

          replace_once(
              'app/src/routes/(app)/crm/[partyPublicId]/+page.svelte',
              '''\t<title>{data.party.displayName} · CRM · NuBlox</title>''',
              '''\t<title>{data.party.displayName} · Customers · NuBlox</title>'''
          )
          replace_once(
              'app/src/routes/(app)/crm/[partyPublicId]/+page.svelte',
              '''\t<a href="/crm">CRM</a>''',
              '''\t<a href="/crm">Customers</a>'''
          )
          collaboration_panel = '''\n\t{#if data.party.kind === 'organisation'}\n\t\t<section id="nublox-link" class="panel full-width collaboration-link">\n\t\t\t<div class="panel-heading">\n\t\t\t\t<div>\n\t\t\t\t\t<p class="eyebrow">Collaboration</p>\n\t\t\t\t\t<h2>NuBlox organisation link</h2>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<p class="muted">\n\t\t\t\tLink this private CRM organisation to its NuBlox account once. Project invitations then use\n\t\t\t\tthis customer record instead of asking users to copy platform IDs.\n\t\t\t</p>\n\t\t\t{#if form?.platformLinkError}<p class="error" role="alert">{form.platformLinkError}</p>{/if}\n\t\t\t{#if data.platformOrganisationLink}\n\t\t\t\t<div class="platform-link-summary">\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<strong>{data.platformOrganisationLink.organisationName}</strong>\n\t\t\t\t\t\t<span>NuBlox account · {data.platformOrganisationLink.status}</span>\n\t\t\t\t\t</div>\n\t\t\t\t\t{#if data.canManage}\n\t\t\t\t\t\t<form method="POST" action="?/unlinkPlatformOrganisation">\n\t\t\t\t\t\t\t<button class="danger-button" type="submit">Remove NuBlox link</button>\n\t\t\t\t\t\t</form>\n\t\t\t\t\t{/if}\n\t\t\t\t</div>\n\t\t\t{:else if data.canManage}\n\t\t\t\t<form method="POST" action="?/linkPlatformOrganisation" class="platform-link-form">\n\t\t\t\t\t<label>\n\t\t\t\t\t\t<span>NuBlox organisation ID</span>\n\t\t\t\t\t\t<input\n\t\t\t\t\t\t\tname="organisationPublicId"\n\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t\tmaxlength="64"\n\t\t\t\t\t\t\tplaceholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"\n\t\t\t\t\t\t/>\n\t\t\t\t\t</label>\n\t\t\t\t\t<button type="submit">Link NuBlox organisation</button>\n\t\t\t\t</form>\n\t\t\t{/if}\n\t\t</section>\n\t{/if}\n'''
          replace_once(
              'app/src/routes/(app)/crm/[partyPublicId]/+page.svelte',
              '''\n\t{#if data.party.kind === 'organisation'}\n\t\t<section id="contacts" class="panel contacts full-width">''',
              collaboration_panel + '''\n\t{#if data.party.kind === 'organisation'}\n\t\t<section id="contacts" class="panel contacts full-width">'''
          )
          replace_once(
