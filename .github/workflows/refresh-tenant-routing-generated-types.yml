name: Refresh tenant routing generated types

on:
  push:
    branches:
      - refactor/tenant-first-routing
    paths:
      - '.github/workflows/refresh-tenant-routing-generated-types.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: tenant-routing-generated-types-refresh
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tenant-first-routing
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply migrations and regenerate types
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:types
      - name: Commit generated database types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/db/generated/*.d.ts
          if git diff --cached --quiet; then
            echo "Generated database types already current."
            exit 0
          fi
          git commit -m "chore: refresh tenant routing generated database types"
          git push origin HEAD:refactor/tenant-first-routing
