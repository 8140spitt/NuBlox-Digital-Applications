name: F03 Generate Database Types

on:
  push:
    branches:
      - feat/f03-enterprise-performance-management
    paths:
      - 'database/migrations/20260910122500_enterprise_performance_management.sql'
      - '.github/workflows/f03-generate-types.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f03-enterprise-performance-management
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply authoritative migration stream
        working-directory: app
        run: pnpm db:migrate
      - name: Regenerate Kysely types
        working-directory: app
        run: pnpm db:types
      - name: Commit generated types and remove maintenance workflow
        run: |
          git rm .github/workflows/f03-generate-types.yml
          git add app/src/lib/server/db/generated/database.d.ts app/src/lib/server/db/generated/strategy.d.ts
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git commit -m 'F03: regenerate Kysely types for enterprise performance'
          git push origin HEAD:feat/f03-enterprise-performance-management
