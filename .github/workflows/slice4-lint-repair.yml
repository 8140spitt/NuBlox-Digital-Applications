name: Slice 4 Lint Repair

on:
  push:
    branches:
      - product/v1-procurement-commercial-control
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-procurement-commercial-control
      - name: Apply exact lint repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          procurement = Path('app/src/lib/server/procurement/procurement-service.ts')
          text = procurement.read_text()
          old = "\ttype PurchaseOrderVersionSummary,\n\ttype RfqSummary,\n\ttype RfqVersionSummary\n"
          new = "\ttype PurchaseOrderVersionSummary\n"
          if text.count(old) != 1:
              raise SystemExit('procurement import pattern did not match exactly once')
          procurement.write_text(text.replace(old, new, 1))

          commercial = Path('app/src/lib/server/commercial/project-commercial-control-service.ts')
          text = commercial.read_text()
          old = """\t\tlet selectedProject: ProjectRecord | null = null;\n\t\tif (selectedProjectPublicIdInput?.trim()) {\n\t\t\tselectedProject = await this.requireProject(actor, selectedProjectPublicIdInput);\n\t\t} else {\n\t\t\tselectedProject = projects[0] ?? null;\n\t\t}\n"""
          new = """\t\tconst selectedProject: ProjectRecord | null = selectedProjectPublicIdInput?.trim()\n\t\t\t? await this.requireProject(actor, selectedProjectPublicIdInput)\n\t\t\t: (projects[0] ?? null);\n"""
          if text.count(old) != 1:
              raise SystemExit('commercial selectedProject pattern did not match exactly once')
          commercial.write_text(text.replace(old, new, 1))
          PY
      - name: Commit lint repairs
        run: |
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add app/src/lib/server/procurement/procurement-service.ts app/src/lib/server/commercial/project-commercial-control-service.ts
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'Fix Slice 4 lint defects'
          git push origin HEAD:product/v1-procurement-commercial-control
