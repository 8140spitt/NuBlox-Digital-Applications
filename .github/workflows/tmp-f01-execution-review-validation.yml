name: Temporary F01 Execution Review Validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Install V2 dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: appv2
        run: pnpm exec playwright install --with-deps chromium

      - name: Tighten known F01 UI contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/+page.svelte')
          text = page.read_text()
          text = text.replace("tone={openHandoffs.length > 0 ? 'warning' : 'default'}", "tone={openHandoffs.length > 0 ? 'warning' : 'neutral'}")
          anchor = "\t\t\t\t\t</article>\n\t\t\t\t{/each}\n\t\t\t</div>\n\t\t{:else}"
          approval = """\t\t\t\t\t\t{#if plan.lifecycleStatus === 'draft' && data.permissions.canApprove}\n\t\t\t\t\t\t\t<form method=\"POST\" action=\"?/approvePlan\" use:enhance class=\"approval-row\">\n\t\t\t\t\t\t\t\t<input type=\"hidden\" name=\"planPublicId\" value={plan.publicId} />\n\t\t\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t\t\t<strong>Govern execution baseline</strong>\n\t\t\t\t\t\t\t\t\t<p>Approval requires objective scope, at least one initiative, and no resource requirement left without a downstream handoff.</p>\n\t\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t\t<Button type=\"submit\" variant=\"secondary\" size=\"sm\">Approve business plan</Button>\n\t\t\t\t\t\t\t</form>\n\t\t\t\t\t\t{/if}\n"""
          if anchor in text and 'action="?/approvePlan"' not in text:
              text = text.replace(anchor, approval + anchor, 1)
          style_anchor = "\t.ownership-grid div {\n\t\tdisplay: grid;\n\t\tgap: var(--nb-space-1);\n\t\tpadding: var(--nb-space-4);\n\t\tborder-left: 2px solid var(--nb-color-border-strong);\n\t}\n"
          approval_style = """\t.approval-row {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t\tgap: var(--nb-space-4);\n\t\tmargin-top: var(--nb-space-5);\n\t\tpadding-top: var(--nb-space-4);\n\t\tborder-top: 1px solid var(--nb-color-border-default);\n\t}\n\t.approval-row p {\n\t\tmargin: var(--nb-space-1) 0 0;\n\t\tcolor: var(--nb-color-text-secondary);\n\t\tfont-size: var(--nb-font-size-sm);\n\t}\n"""
          if style_anchor in text and '.approval-row {' not in text:
              text = text.replace(style_anchor, style_anchor + approval_style)
          page.write_text(text)

          form = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte')
          text = form.read_text()
          text = text.replace(
              "import { Alert, Breadcrumbs, Button, Field, PageHeader, Panel } from '$lib/components/ui';",
              "import { Alert, Breadcrumbs, Button, Field, LinkButton, PageHeader, Panel } from '$lib/components/ui';"
          )
          text = text.replace(
              '<a href={routes.strategyBusinessPlanning(data.tenant.slug, data.framework.publicId)}>Cancel</a>',
              '<LinkButton href={routes.strategyBusinessPlanning(data.tenant.slug, data.framework.publicId)} variant="quiet">Cancel</LinkButton>'
          )
          form.write_text(text)
          PY

      - name: Format F01 V2 source
        working-directory: appv2
        run: pnpm exec prettier --write "src/**/*.{ts,svelte,css}"

      - name: Validate V2
        id: validate
        working-directory: appv2
        shell: bash
        run: |
          set +e
          : > ../.tmp-f01-validation.log
          for command in "pnpm lint" "pnpm check" "pnpm test:unit" "pnpm build"; do
            echo "### $command" | tee -a ../.tmp-f01-validation.log
            bash -lc "$command" 2>&1 | tee -a ../.tmp-f01-validation.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              echo "FAILED_COMMAND=$command" >> ../.tmp-f01-validation.log
              exit "$code"
            fi
          done

      - name: Commit validation failure evidence
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2 .tmp-f01-validation.log
          git commit -m "chore(v2): capture F01 validation failure [skip ci]" || true
          git push origin main || true

      - name: Commit validated source and remove temporary workflow
        if: success()
        run: |
          rm -f .tmp-f01-validation.log
          git rm .github/workflows/tmp-f01-execution-review-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2
          git commit -m "fix(v2): validate F01 execution review slice"
          git push origin main
