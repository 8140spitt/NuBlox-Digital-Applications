name: Contextual Workspaces Format

on:
  push:
    branches:
      - product/v1-contextual-workspaces
    paths:
      - '.github/workflows/contextual-workspaces-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-contextual-workspaces
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format contextual workspace files
        working-directory: app
        run: |
          pnpm exec prettier --write \
            e2e/authenticated-workspaces.e2e.ts \
            e2e/ui-permissions.e2e.ts \
            src/lib/navigation/app-navigation.ts \
            'src/routes/(app)/+layout.server.ts' \
            'src/routes/(app)/+layout.svelte' \
            'src/routes/(app)/my-work/+page.svelte'
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/e2e/authenticated-workspaces.e2e.ts \
            app/e2e/ui-permissions.e2e.ts \
            app/src/lib/navigation/app-navigation.ts \
            'app/src/routes/(app)/+layout.server.ts' \
            'app/src/routes/(app)/+layout.svelte' \
            'app/src/routes/(app)/my-work/+page.svelte'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format contextual workspace UX"
          git push origin HEAD:product/v1-contextual-workspaces
