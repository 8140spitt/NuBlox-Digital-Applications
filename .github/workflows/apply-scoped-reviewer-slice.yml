name: Apply scoped reviewer slice

on:
  push:
    branches:
      - rbac/scoped-access-reviewers

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbac/scoped-access-reviewers
          fetch-depth: 0

      - name: Apply service, tests, docs and CI contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement + text[j:]

          service_path = Path('app/src/lib/server/organisations/access-review-service.ts')
          s = service_path.read_text()

          s = s.replace(
              "export type AccessReviewDecision = 'certify' | 'revoke';\n",
              "export type AccessReviewDecision = 'certify' | 'revoke';\nexport type AccessReviewReviewerMode = 'organisation_manage' | 'assigned';\n\nexport type AccessReviewReviewerAssignmentInput = {\n\tsubjectMemberPublicId: string;\n\treviewerMemberPublicId: string;\n};\n",
              1
          )
          s = s.replace(
              "\tdueAt: Date | null;\n\topenedAt: Date;",
              "\tdueAt: Date | null;\n\treviewerMode: AccessReviewReviewerMode;\n\topenedAt: Date;",
              1
          )
          s = s.replace(
              "\tsourceReason: string | null;\n\tdecision: AccessReviewDecision | null;",
              "\tsourceReason: string | null;\n\treviewerMemberPublicId: string | null;\n\tdecision: AccessReviewDecision | null;",
              1
          )
          s = s.replace(
              "export class AccessReviewAuthorisationError extends Error {\n\treadonly code = 'ACCESS_REVIEW_FORBIDDEN';\n\tconstructor() {\n\t\tsuper('Organisation management authority is required to administer access reviews.');\n\t\tthis.name = 'AccessReviewAuthorisationError';\n\t}\n}",
              "export class AccessReviewAuthorisationError extends Error {\n\treadonly code = 'ACCESS_REVIEW_FORBIDDEN';\n\tconstructor(message = 'Access review authority is required for this operation.') {\n\t\tsuper(message);\n\t\tthis.name = 'AccessReviewAuthorisationError';\n\t}\n}",
              1
          )
          marker = "function accessType(value: string): AccessReviewAccessType {"
          insert = "function reviewerMode(value: string): AccessReviewReviewerMode {\n\tif (value === 'organisation_manage' || value === 'assigned') return value;\n\tthrow new Error(`Unexpected access review reviewer mode: ${value}`);\n}\n\n"
          s = s.replace(marker, insert + marker, 1)

          list_assigned = '''\tasync listAssignedCampaigns(\n\t\tactor: TenantActorContext\n\t): Promise<AccessReviewCampaignSummary[]> {\n\t\tif ((await this.memberActor(this.db, actor.organisationId, actor.memberId, actor.correlationId)) === null) {\n\t\t\tthrow new AccessReviewAuthorisationError();\n\t\t}\n\t\tconst campaigns = await this.db\n\t\t\t.selectFrom('access_review_campaigns as campaign')\n\t\t\t.innerJoin('access_review_reviewer_assignments as assignment', (join) =>\n\t\t\t\tjoin\n\t\t\t\t\t.onRef('assignment.campaign_id', '=', 'campaign.id')\n\t\t\t\t\t.onRef('assignment.organisation_id', '=', 'campaign.organisation_id')\n\t\t\t)\n\t\t\t.select([\n\t\t\t\t'campaign.id as id',\n\t\t\t\t'campaign.public_id as public_id',\n\t\t\t\t'campaign.name as name',\n\t\t\t\t'campaign.status as status',\n\t\t\t\t'campaign.snapshot_at as snapshot_at',\n\t\t\t\t'campaign.due_at as due_at',\n\t\t\t\t'campaign.reviewer_mode as reviewer_mode',\n\t\t\t\t'campaign.opened_at as opened_at',\n\t\t\t\t'campaign.completed_at as completed_at',\n\t\t\t\t'campaign.cancelled_at as cancelled_at'\n\t\t\t])\n\t\t\t.where('campaign.organisation_id', '=', actor.organisationId)\n\t\t\t.where('assignment.reviewer_member_id', '=', actor.memberId)\n\t\t\t.distinct()\n\t\t\t.orderBy('campaign.opened_at', 'desc')\n\t\t\t.execute();\n\n\t\tconst campaignIds = campaigns.map((campaign) => campaign.id);\n\t\tconst counts = new Map<string, { total: number; pending: number }>();\n\t\tif (campaignIds.length > 0) {\n\t\t\tconst rows = await this.db\n\t\t\t\t.selectFrom('access_review_items as item')\n\t\t\t\t.innerJoin('access_review_reviewer_assignments as assignment', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('assignment.campaign_id', '=', 'item.campaign_id')\n\t\t\t\t\t\t.onRef('assignment.subject_member_id', '=', 'item.organisation_member_id')\n\t\t\t\t\t\t.onRef('assignment.organisation_id', '=', 'item.organisation_id')\n\t\t\t\t)\n\t\t\t\t.select(['item.campaign_id as campaignId', 'item.decision as decision'])\n\t\t\t\t.where('item.campaign_id', 'in', campaignIds)\n\t\t\t\t.where('assignment.reviewer_member_id', '=', actor.memberId)\n\t\t\t\t.where('assignment.organisation_id', '=', actor.organisationId)\n\t\t\t\t.execute();\n\t\t\tfor (const row of rows) {\n\t\t\t\tconst current = counts.get(row.campaignId) ?? { total: 0, pending: 0 };\n\t\t\t\tcurrent.total += 1;\n\t\t\t\tif (row.decision === null) current.pending += 1;\n\t\t\t\tcounts.set(row.campaignId, current);\n\t\t\t}\n\t\t}\n\n\t\treturn campaigns.map((campaign) => this.mapCampaign(campaign, counts.get(campaign.id)));\n\t}\n\n'''
          s = s.replace("\tasync loadCampaign(\n", list_assigned + "\tasync loadCampaign(\n", 1)

          new_load = '''\tasync loadCampaign(\n\t\tactor: TenantActorContext,\n\t\tcampaignPublicId: string\n\t): Promise<AccessReviewCampaignDetail> {\n\t\tconst campaign = await this.db\n\t\t\t.selectFrom('access_review_campaigns')\n\t\t\t.select([\n\t\t\t\t'id',\n\t\t\t\t'public_id',\n\t\t\t\t'name',\n\t\t\t\t'status',\n\t\t\t\t'snapshot_at',\n\t\t\t\t'due_at',\n\t\t\t\t'reviewer_mode',\n\t\t\t\t'opened_at',\n\t\t\t\t'completed_at',\n\t\t\t\t'cancelled_at'\n\t\t\t])\n\t\t\t.where('organisation_id', '=', actor.organisationId)\n\t\t\t.where('public_id', '=', campaignPublicId)\n\t\t\t.executeTakeFirst();\n\t\tif (!campaign) throw new AccessReviewNotFoundError('Access review campaign not found.');\n\n\t\tconst mode = reviewerMode(campaign.reviewer_mode);\n\t\tconst canManage = await this.canManage(this.db, actor, new Date());\n\t\tlet visibleSubjectIds: string[] | null = null;\n\t\tif (mode === 'organisation_manage') {\n\t\t\tif (!canManage) {\n\t\t\t\tthrow new AccessReviewAuthorisationError(\n\t\t\t\t\t'Organisation management authority is required to administer this access review.'\n\t\t\t\t);\n\t\t\t}\n\t\t} else if (!canManage) {\n\t\t\tconst assignments = await this.db\n\t\t\t\t.selectFrom('access_review_reviewer_assignments')\n\t\t\t\t.select('subject_member_id')\n\t\t\t\t.where('campaign_id', '=', campaign.id)\n\t\t\t\t.where('organisation_id', '=', actor.organisationId)\n\t\t\t\t.where('reviewer_member_id', '=', actor.memberId)\n\t\t\t\t.execute();\n\t\t\tvisibleSubjectIds = assignments.map((assignment) => assignment.subject_member_id);\n\t\t\tif (visibleSubjectIds.length === 0) {\n\t\t\t\tthrow new AccessReviewAuthorisationError(\n\t\t\t\t\t'You are not assigned to review any subjects in this campaign.'\n\t\t\t\t);\n\t\t\t}\n\t\t}\n\n\t\tlet itemQuery = this.db\n\t\t\t.selectFrom('access_review_items')\n\t\t\t.select([\n\t\t\t\t'public_id',\n\t\t\t\t'organisation_member_id',\n\t\t\t\t'member_public_id',\n\t\t\t\t'access_type',\n\t\t\t\t'source_key',\n\t\t\t\t'role_public_id',\n\t\t\t\t'stable_role_key',\n\t\t\t\t'permission_key',\n\t\t\t\t'permission_effect',\n\t\t\t\t'display_label',\n\t\t\t\t'lifecycle_state',\n\t\t\t\t'effective_from',\n\t\t\t\t'expires_at',\n\t\t\t\t'source_reason',\n\t\t\t\t'decision',\n\t\t\t\t'decision_reason',\n\t\t\t\t'decided_at',\n\t\t\t\t'revocation_applied_at'\n\t\t\t])\n\t\t\t.where('campaign_id', '=', campaign.id);\n\t\tif (visibleSubjectIds !== null) {\n\t\t\titemQuery = itemQuery.where('organisation_member_id', 'in', visibleSubjectIds);\n\t\t}\n\t\tconst items = await itemQuery\n\t\t\t.orderBy('organisation_member_id', 'asc')\n\t\t\t.orderBy('access_type', 'asc')\n\t\t\t.orderBy('display_label', 'asc')\n\t\t\t.execute();\n\n\t\tconst reviewerBySubject = new Map<string, string>();\n\t\tif (mode === 'assigned') {\n\t\t\tconst reviewerRows = await this.db\n\t\t\t\t.selectFrom('access_review_reviewer_assignments as assignment')\n\t\t\t\t.innerJoin('organisation_members as reviewer', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('reviewer.id', '=', 'assignment.reviewer_member_id')\n\t\t\t\t\t\t.onRef('reviewer.organisation_id', '=', 'assignment.organisation_id')\n\t\t\t\t)\n\t\t\t\t.select([\n\t\t\t\t\t'assignment.subject_member_id as subjectMemberId',\n\t\t\t\t\t'reviewer.public_id as reviewerMemberPublicId'\n\t\t\t\t])\n\t\t\t\t.where('assignment.campaign_id', '=', campaign.id)\n\t\t\t\t.where('assignment.organisation_id', '=', actor.organisationId)\n\t\t\t\t.execute();\n\t\t\tfor (const row of reviewerRows) {\n\t\t\t\treviewerBySubject.set(row.subjectMemberId, row.reviewerMemberPublicId);\n\t\t\t}\n\t\t}\n\n\t\tconst pendingItems = items.filter((item) => item.decision === null).length;\n\t\treturn {\n\t\t\tcampaign: this.mapCampaign(campaign, { total: items.length, pending: pendingItems }),\n\t\t\titems: items.map((item) => ({\n\t\t\t\tpublicId: item.public_id,\n\t\t\t\tmemberPublicId: item.member_public_id,\n\t\t\t\taccessType: accessType(item.access_type),\n\t\t\t\tsourceKey: item.source_key,\n\t\t\t\trolePublicId: item.role_public_id,\n\t\t\t\tstableRoleKey: item.stable_role_key,\n\t\t\t\tpermissionKey: item.permission_key,\n\t\t\t\tpermissionEffect: permissionEffect(item.permission_effect),\n\t\t\t\tdisplayLabel: item.display_label,\n\t\t\t\tlifecycleState: lifecycleState(item.lifecycle_state),\n\t\t\t\teffectiveFrom: item.effective_from,\n\t\t\t\texpiresAt: item.expires_at,\n\t\t\t\tsourceReason: item.source_reason,\n\t\t\t\treviewerMemberPublicId: reviewerBySubject.get(item.organisation_member_id) ?? null,\n\t\t\t\tdecision: reviewDecision(item.decision),\n\t\t\t\tdecisionReason: item.decision_reason,\n\t\t\t\tdecidedAt: item.decided_at,\n\t\t\t\trevocationAppliedAt: item.revocation_applied_at\n\t\t\t}))\n\t\t};\n\t}\n\n'''
          s = replace_between(s, "\tasync loadCampaign(\n", "\tasync openCampaign(\n", new_load)

          new_open = '''\tasync openCampaign(\n\t\tactor: TenantActorContext,\n\t\tinput: {\n\t\t\tname: string;\n\t\t\tdueAt?: Date | null;\n\t\t\treviewerMode?: AccessReviewReviewerMode;\n\t\t\treviewerAssignments?: AccessReviewReviewerAssignmentInput[];\n\t\t}\n\t): Promise<string> {\n\t\tconst name = campaignName(input.name);\n\t\tconst dueAt = input.dueAt ?? null;\n\t\tconst mode = reviewerMode(input.reviewerMode ?? 'organisation_manage');\n\t\tconst reviewerAssignments = input.reviewerAssignments ?? [];\n\t\tif (mode === 'organisation_manage' && reviewerAssignments.length > 0) {\n\t\t\tthrow new AccessReviewValidationError(\n\t\t\t\t'Reviewer assignments may be supplied only for assigned-mode campaigns.'\n\t\t\t);\n\t\t}\n\t\tconst publicId = randomUUID();\n\n\t\tawait this.db.transaction().execute(async (trx) => {\n\t\t\tconst snapshotAt = new Date();\n\t\t\tawait this.requireManage(trx, actor, snapshotAt);\n\t\t\tif (dueAt !== null && dueAt <= snapshotAt) {\n\t\t\t\tthrow new AccessReviewValidationError('Access review due date must be in the future.');\n\t\t\t}\n\t\t\tawait ensureStandardAccessRoleBindings(trx, actor.organisationId);\n\n\t\t\tconst campaignId = insertedId(\n\t\t\t\tawait trx\n\t\t\t\t\t.insertInto('access_review_campaigns')\n\t\t\t\t\t.values({\n\t\t\t\t\t\tpublic_id: publicId,\n\t\t\t\t\t\torganisation_id: actor.organisationId,\n\t\t\t\t\t\tname,\n\t\t\t\t\t\tstatus: 'open',\n\t\t\t\t\t\tsnapshot_at: snapshotAt,\n\t\t\t\t\t\tdue_at: dueAt,\n\t\t\t\t\t\treviewer_mode: mode,\n\t\t\t\t\t\topened_by_member_id: actor.memberId,\n\t\t\t\t\t\topened_at: snapshotAt,\n\t\t\t\t\t\tcompleted_at: null,\n\t\t\t\t\t\tcancelled_at: null\n\t\t\t\t\t})\n\t\t\t\t\t.executeTakeFirstOrThrow()\n\t\t\t);\n\n\t\t\tconst roleRows = await trx\n\t\t\t\t.selectFrom('member_roles as assignment')\n\t\t\t\t.innerJoin('organisation_members as member', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('member.id', '=', 'assignment.organisation_member_id')\n\t\t\t\t\t\t.onRef('member.organisation_id', '=', 'assignment.organisation_id')\n\t\t\t\t)\n\t\t\t\t.innerJoin('organisation_roles as role', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('role.id', '=', 'assignment.organisation_role_id')\n\t\t\t\t\t\t.onRef('role.organisation_id', '=', 'assignment.organisation_id')\n\t\t\t\t)\n\t\t\t\t.leftJoin('organisation_role_template_bindings as binding', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('binding.organisation_role_id', '=', 'assignment.organisation_role_id')\n\t\t\t\t\t\t.onRef('binding.organisation_id', '=', 'assignment.organisation_id')\n\t\t\t\t\t\t.on('binding.template_key', '=', STANDARD_ACCESS_ROLE_TEMPLATE_KEY)\n\t\t\t\t)\n\t\t\t\t.leftJoin('member_role_access_windows as window', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('window.organisation_id', '=', 'assignment.organisation_id')\n\t\t\t\t\t\t.onRef('window.organisation_member_id', '=', 'assignment.organisation_member_id')\n\t\t\t\t\t\t.onRef('window.organisation_role_id', '=', 'assignment.organisation_role_id')\n\t\t\t\t)\n\t\t\t\t.select([\n\t\t\t\t\t'assignment.organisation_member_id as memberId',\n\t\t\t\t\t'member.public_id as memberPublicId',\n\t\t\t\t\t'role.id as roleId',\n\t\t\t\t\t'role.public_id as rolePublicId',\n\t\t\t\t\t'role.name as roleName',\n\t\t\t\t\t'binding.role_key as stableRoleKey',\n\t\t\t\t\t'window.effective_from as effectiveFrom',\n\t\t\t\t\t'window.expires_at as expiresAt',\n\t\t\t\t\t'window.reason as sourceReason'\n\t\t\t\t])\n\t\t\t\t.where('assignment.organisation_id', '=', actor.organisationId)\n\t\t\t\t.execute();\n\n\t\t\tconst overrideRows = await trx\n\t\t\t\t.selectFrom('member_permission_overrides as override')\n\t\t\t\t.innerJoin('organisation_members as member', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('member.id', '=', 'override.organisation_member_id')\n\t\t\t\t\t\t.onRef('member.organisation_id', '=', 'override.organisation_id')\n\t\t\t\t)\n\t\t\t\t.innerJoin('permissions as permission', 'permission.id', 'override.permission_id')\n\t\t\t\t.leftJoin('member_permission_override_access_windows as window', (join) =>\n\t\t\t\t\tjoin\n\t\t\t\t\t\t.onRef('window.organisation_id', '=', 'override.organisation_id')\n\t\t\t\t\t\t.onRef('window.organisation_member_id', '=', 'override.organisation_member_id')\n\t\t\t\t\t\t.onRef('window.permission_id', '=', 'override.permission_id')\n\t\t\t\t)\n\t\t\t\t.select([\n\t\t\t\t\t'override.organisation_member_id as memberId',\n\t\t\t\t\t'member.public_id as memberPublicId',\n\t\t\t\t\t'permission.id as permissionId',\n\t\t\t\t\t'permission.permission_key as permissionKey',\n\t\t\t\t\t'permission.name as permissionName',\n\t\t\t\t\t'override.effect as permissionEffect',\n\t\t\t\t\t'override.reason as sourceReason',\n\t\t\t\t\t'window.effective_from as effectiveFrom',\n\t\t\t\t\t'window.expires_at as expiresAt'\n\t\t\t\t])\n\t\t\t\t.where('override.organisation_id', '=', actor.organisationId)\n\t\t\t\t.execute();\n\n\t\t\tconst itemValues = [\n\t\t\t\t...roleRows.map((row) => ({\n\t\t\t\t\tpublic_id: randomUUID(),\n\t\t\t\t\tcampaign_id: campaignId,\n\t\t\t\t\torganisation_id: actor.organisationId,\n\t\t\t\t\torganisation_member_id: row.memberId,\n\t\t\t\t\tmember_public_id: row.memberPublicId,\n\t\t\t\t\taccess_type: 'role_assignment',\n\t\t\t\t\tsource_key: row.rolePublicId,\n\t\t\t\t\torganisation_role_id: row.roleId,\n\t\t\t\t\trole_public_id: row.rolePublicId,\n\t\t\t\t\tstable_role_key: row.stableRoleKey,\n\t\t\t\t\tpermission_id: null,\n\t\t\t\t\tpermission_key: null,\n\t\t\t\t\tpermission_effect: null,\n\t\t\t\t\tdisplay_label: row.roleName,\n\t\t\t\t\tlifecycle_state: stateAt(row.effectiveFrom, row.expiresAt, snapshotAt),\n\t\t\t\t\teffective_from: row.effectiveFrom,\n\t\t\t\t\texpires_at: row.expiresAt,\n\t\t\t\t\tsource_reason: row.sourceReason,\n\t\t\t\t\tdecision: null,\n\t\t\t\t\tdecision_reason: null,\n\t\t\t\t\tdecided_by_member_id: null,\n\t\t\t\t\tdecided_at: null,\n\t\t\t\t\trevocation_applied_at: null\n\t\t\t\t})),\n\t\t\t\t...overrideRows.map((row) => ({\n\t\t\t\t\tpublic_id: randomUUID(),\n\t\t\t\t\tcampaign_id: campaignId,\n\t\t\t\t\torganisation_id: actor.organisationId,\n\t\t\t\t\torganisation_member_id: row.memberId,\n\t\t\t\t\tmember_public_id: row.memberPublicId,\n\t\t\t\t\taccess_type: 'permission_override',\n\t\t\t\t\tsource_key: row.permissionKey,\n\t\t\t\t\torganisation_role_id: null,\n\t\t\t\t\trole_public_id: null,\n\t\t\t\t\tstable_role_key: null,\n\t\t\t\t\tpermission_id: row.permissionId,\n\t\t\t\t\tpermission_key: row.permissionKey,\n\t\t\t\t\tpermission_effect: row.permissionEffect,\n\t\t\t\t\tdisplay_label: row.permissionName,\n\t\t\t\t\tlifecycle_state: stateAt(row.effectiveFrom, row.expiresAt, snapshotAt),\n\t\t\t\t\teffective_from: row.effectiveFrom,\n\t\t\t\t\texpires_at: row.expiresAt,\n\t\t\t\t\tsource_reason: row.sourceReason,\n\t\t\t\t\tdecision: null,\n\t\t\t\t\tdecision_reason: null,\n\t\t\t\t\tdecided_by_member_id: null,\n\t\t\t\t\tdecided_at: null,\n\t\t\t\t\trevocation_applied_at: null\n\t\t\t\t}))\n\t\t\t];\n\t\t\tif (itemValues.length > 0) {\n\t\t\t\tawait trx.insertInto('access_review_items').values(itemValues).execute();\n\t\t\t}\n\n\t\t\tconst reviewerCount =\n\t\t\t\tmode === 'assigned'\n\t\t\t\t\t? await this.createReviewerAssignments(\n\t\t\t\t\t\t\ttrx,\n\t\t\t\t\t\t\tactor,\n\t\t\t\t\t\t\tcampaignId,\n\t\t\t\t\t\t\treviewerAssignments,\n\t\t\t\t\t\t\t[\n\t\t\t\t\t\t\t\t...roleRows.map((row) => ({ memberId: row.memberId, memberPublicId: row.memberPublicId })),\n\t\t\t\t\t\t\t\t...overrideRows.map((row) => ({ memberId: row.memberId, memberPublicId: row.memberPublicId }))\n\t\t\t\t\t\t\t],\n\t\t\t\t\t\t\tsnapshotAt,\n\t\t\t\t\t\t\tpublicId\n\t\t\t\t\t\t)\n\t\t\t\t\t: 0;\n\n\t\t\tawait new AuditRepository(trx).append({\n\t\t\t\teventPublicId: randomUUID(),\n\t\t\t\tactingOrganisationId: actor.organisationId,\n\t\t\t\tactorUserId: actor.userId,\n\t\t\t\tactorMemberId: actor.memberId,\n\t\t\t\tactionKey: 'organisation.access-review.open',\n\t\t\t\tsubjectType: 'access_review_campaign',\n\t\t\t\tsubjectPublicId: publicId,\n\t\t\t\tcorrelationId: actor.correlationId,\n\t\t\t\tchangeSummary: {\n\t\t\t\t\tname,\n\t\t\t\t\tsnapshotAt: snapshotAt.toISOString(),\n\t\t\t\t\tdueAt: dueAt?.toISOString() ?? null,\n\t\t\t\t\treviewerMode: mode,\n\t\t\t\t\treviewerCount,\n\t\t\t\t\titemCount: itemValues.length\n\t\t\t\t}\n\t\t\t});\n\t\t});\n\n\t\treturn publicId;\n\t}\n\n'''
          s = replace_between(s, "\tasync openCampaign(\n", "\tasync decideItem(\n", new_open)

