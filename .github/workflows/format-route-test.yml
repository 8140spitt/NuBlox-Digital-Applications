name: Format route contract test

on:
  push:
    branches:
      - refactor/tenant-first-routing
    paths:
      - '.route-test-format-trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tenant-first-routing
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm exec prettier --write src/lib/routing/route-contract.test.ts
        working-directory: app
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/routing/route-contract.test.ts
          git commit -m 'Format route contract test'
          git push origin HEAD:refactor/tenant-first-routing
