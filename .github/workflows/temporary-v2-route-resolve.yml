name: Temporary V2 Route Resolve

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-v2-route-resolve.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Apply resolve wrappers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('appv2')
          files = {
              'src/lib/components/auth/SignInSurface.svelte': [
                  ("import { goto, invalidateAll } from '$app/navigation';", "import { goto, invalidateAll } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ('await goto(destination);', 'await goto(resolve(destination));'),
                  ('href={startHref}', 'href={resolve(startHref)}'),
                  ('href={forgotPasswordHref}', 'href={resolve(forgotPasswordHref)}'),
              ],
              'src/routes/+page.svelte': [
                  ("import { routes } from '$lib/routing/route-contract';", "import { resolve } from '$app/paths';\n\timport { routes } from '$lib/routing/route-contract';"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
              ],
              'src/routes/start/+page.svelte': [
                  ("import { routes } from '$lib/routing/route-contract';", "import { resolve } from '$app/paths';\n\timport { routes } from '$lib/routing/route-contract';"),
                  ('href="/"', "href={resolve('/') }"),
                  ('href={routes.register}', 'href={resolve(routes.register)}'),
              ],
              'src/routes/register/+page.svelte': [
                  ("import { goto } from '$app/navigation';", "import { goto } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ("await goto(`${routes.verifyEmail}?email=${encodeURIComponent(email.trim())}`, {", "await goto(resolve(`${routes.verifyEmail}?email=${encodeURIComponent(email.trim())}`), {"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
              ],
              'src/routes/verify-email/+page.svelte': [
                  ("import { page } from '$app/state';", "import { resolve } from '$app/paths';\n\timport { page } from '$app/state';"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={data.continueHref}', 'href={resolve(data.continueHref)}'),
              ],
              'src/routes/[tenant]/app/(protected)/+layout.svelte': [
                  ("import { goto, invalidateAll } from '$app/navigation';", "import { goto, invalidateAll } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ('await goto(routes.appSignIn(data.tenant.slug));', 'await goto(resolve(routes.appSignIn(data.tenant.slug)));'),
                  ('href={routes.dashboard(data.tenant.slug)}', 'href={resolve(routes.dashboard(data.tenant.slug))}'),
                  ('href={item.href}', 'href={resolve(item.href)}'),
              ],
              'src/routes/[tenant]/app/auth/forgot-password/+page.svelte': [
                  ("import { page } from '$app/state';", "import { resolve } from '$app/paths';\n\timport { page } from '$app/state';"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={signInHref}', 'href={resolve(signInHref)}'),
              ],
              'src/routes/[tenant]/app/auth/invite/[token]/+page.svelte': [
                  ("import { goto } from '$app/navigation';", "import { goto } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ("await goto(`${data.verifyEmailHref}?email=${encodeURIComponent(data.invitation.email)}`, {", "await goto(resolve(`${data.verifyEmailHref}?email=${encodeURIComponent(data.invitation.email)}`), {"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={data.signInHref}', 'href={resolve(data.signInHref)}'),
                  ('href={invitationSignIn}', 'href={resolve(invitationSignIn)}'),
              ],
              'src/routes/[tenant]/app/auth/no-access/+page.svelte': [
                  ("import { goto, invalidateAll } from '$app/navigation';", "import { goto, invalidateAll } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ('await goto(data.signInHref);', 'await goto(resolve(data.signInHref));'),
                  ('href={data.startHref}', 'href={resolve(data.startHref)}'),
              ],
              'src/routes/[tenant]/app/auth/reset-password/+page.svelte': [
                  ("import { goto } from '$app/navigation';", "import { goto } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ('await goto(routes.appSignIn(tenant), {', 'await goto(resolve(routes.appSignIn(tenant)), {'),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={forgotPasswordHref}', 'href={resolve(forgotPasswordHref)}'),
              ],
              'src/routes/[tenant]/app/auth/verify-email/+page.svelte': [
                  ("import { page } from '$app/state';", "import { resolve } from '$app/paths';\n\timport { page } from '$app/state';"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={signInHref}', 'href={resolve(signInHref)}'),
              ],
              'src/routes/[tenant]/portal/[crmParty]/(protected)/+layout.svelte': [
                  ("import { goto, invalidateAll } from '$app/navigation';", "import { goto, invalidateAll } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ('await goto(routes.portalSignIn(data.tenant.slug, data.crmParty.slug));', 'await goto(resolve(routes.portalSignIn(data.tenant.slug, data.crmParty.slug)));'),
                  ('href={dashboardHref}', 'href={resolve(dashboardHref)}'),
                  ('href={projectsHref}', 'href={resolve(projectsHref)}'),
                  ('href={actionsHref}', 'href={resolve(actionsHref)}'),
              ],
              'src/routes/[tenant]/portal/[crmParty]/auth/forgot-password/+page.svelte': [
                  ("import { page } from '$app/state';", "import { resolve } from '$app/paths';\n\timport { page } from '$app/state';"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={signInHref}', 'href={resolve(signInHref)}'),
              ],
              'src/routes/[tenant]/portal/[crmParty]/auth/no-access/+page.svelte': [
                  ("import { goto, invalidateAll } from '$app/navigation';", "import { goto, invalidateAll } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ('await goto(data.signInHref);', 'await goto(resolve(data.signInHref));'),
                  ('href={data.startHref}', 'href={resolve(data.startHref)}'),
              ],
              'src/routes/[tenant]/portal/[crmParty]/auth/reset-password/+page.svelte': [
                  ("import { goto } from '$app/navigation';", "import { goto } from '$app/navigation';\n\timport { resolve } from '$app/paths';"),
                  ('await goto(routes.portalSignIn(tenant, crmParty), {', 'await goto(resolve(routes.portalSignIn(tenant, crmParty)), {'),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={forgotHref}', 'href={resolve(forgotHref)}'),
              ],
              'src/routes/[tenant]/portal/[crmParty]/auth/verify-email/+page.svelte': [
                  ("import { page } from '$app/state';", "import { resolve } from '$app/paths';\n\timport { page } from '$app/state';"),
                  ('href={routes.start}', 'href={resolve(routes.start)}'),
                  ('href={signInHref}', 'href={resolve(signInHref)}'),
              ],
          }

          for relative, replacements in files.items():
              path = root / relative
              text = path.read_text()
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text == original:
                  print(f'No changes: {relative}')
              else:
                  path.write_text(text)
                  print(f'Updated: {relative}')
          PY
      - name: Format changed files
        working-directory: appv2
        run: pnpm exec prettier --write src
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/src
          git diff --cached --quiet && exit 0
          git commit -m "fix(v2): resolve tenant-first navigation paths"
          git push origin main
