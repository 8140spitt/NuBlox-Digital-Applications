name: F04 branch cleanup

on:
  push:
    paths:
      - '.github/workflows/f04-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged feature branches
        run: |
          git push origin --delete feat/f04-corporate-development-ma || true
          git push origin --delete cleanup/f04-branch-removal || true
      - name: Remove cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/f04-cleanup.yml
          git add .github/workflows/f04-cleanup.yml
          git commit -m "chore: remove F04 cleanup workflow"
          git push origin HEAD:main
