name: Format Slice 5 Branch

on:
  push:
    branches:
      - product/v1-site-quality-safety

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-site-quality-safety
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format Slice 5 implementation
        run: >-
          pnpm exec prettier --write
          src/lib/server/site/site-quality-safety-bootstrap.ts
          src/lib/server/site/site-quality-safety-repository.ts
          src/lib/server/site/site-quality-safety-service.ts
          src/lib/server/site/site-quality-safety.integration.test.ts
          'src/routes/(app)/site/+page.server.ts'
          'src/routes/(app)/site/+page.svelte'
      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/site app/src/routes/'(app)'/site
          git commit -m "Format Slice 5 implementation"
          git push origin HEAD:product/v1-site-quality-safety
