              """\trelationships: async ({ request, params, url }) => {\n\t\tconst kind = recordKind(params.kind);\n\t\tconst formData = await request.formData();\n\t\tconst selections: Record<string, string[]> = {};\n\t\tfor (const [key, value] of formData.entries()) {\n\t\t\tif (typeof value !== 'string') continue;\n\t\t\t(selections[key] ??= []).push(value);\n\t\t}\n\t\tconst { access, actor } = await actorFor(request, params, `${url.pathname}${url.search}`);\n\t\ttry {\n\t\t\tawait updateF01Relationships({\n\t\t\t\tactor,\n\t\t\t\tframeworkPublicId: params.strategy,\n\t\t\t\tkind,\n\t\t\t\trecordPublicId: params.record,\n\t\t\t\tselections\n\t\t\t});\n\t\t\tredirect(\n\t\t\t\t303,\n\t\t\t\troutes.strategyManage(access.organisationRouteSlug, params.strategy, kind, params.record)\n\t\t\t);\n\t\t} catch (cause) {\n\t\t\tif (cause instanceof StrategyValidationError) return fail(400, { formError: cause.message });\n\t\t\tif (cause instanceof StrategyAccessError) return fail(403, { formError: cause.message });\n\t\t\tthrow cause;\n\t\t}\n\t},\n\ttransition: async ({ request, params, url }) => {"""
          )

          # 6. Add the relationship editor to the manage UI.
          path = 'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/manage/[kind]/[record]/+page.svelte'
          replace_once(
              path,
              """\tconst record = $derived(data.managedRecord);\n\tconst postedValues = $derived((form?.values ?? {}) as Record<string, string>);""",
              """\tconst record = $derived(data.managedRecord);\n\tconst relationshipEditor = $derived(data.relationshipEditor);\n\tconst postedValues = $derived((form?.values ?? {}) as Record<string, string>);"""
          )
          relationship_panel = r'''
          
          	{#if relationshipEditor}
          		<Panel
          			title="Associations & strategic lineage"
          			description="Maintain the governed relationships that carry context downstream. NuBlox validates scope, lifecycle and orphaning rules before committing changes."
          		>
          			<form method="POST" action="?/relationships" use:enhance class="relationship-form">
          				{#each relationshipEditor.groups as group (group.key)}
          					<fieldset class="relationship-group">
          						<legend>{group.label}{group.required ? ' *' : ''}</legend>
          						<p>{group.description}</p>
          						{#if group.mode === 'single'}
          							<select class="nb-control" name={group.key} required={group.required}>
          								{#if !group.required}<option value="">No association</option>{/if}
          								{#each group.options as option (option.value)}
          									<option value={option.value} selected={option.selected}>{option.label}</option>
          								{/each}
          							</select>
          						{:else if group.options.length > 0}
          							<div class="relationship-options">
          								{#each group.options as option (option.value)}
          									<label class="relationship-option">
          										<input type="checkbox" name={group.key} value={option.value} checked={option.selected} />
          										<span>{option.label}</span>
          									</label>
          								{/each}
          							</div>
          						{:else}
          							<p class="relationship-empty">No eligible records are available in the governing context.</p>
          						{/if}
          					</fieldset>
          				{/each}
          				<div class="form-actions">
          					<Button type="submit">Save associations</Button>
          				</div>
          			</form>
          		</Panel>
          	{/if}
          '''
          replace_once(path, "\n\t{#if record.transitions.length > 0}", relationship_panel + "\n\t{#if record.transitions.length > 0}")
          p = Path(path)
          text = p.read_text()
          css_marker = "\n</style>"
          css = r'''
          
          	.relationship-form {
          		display: grid;
          		gap: var(--nb-space-6);
          	}
          
          	.relationship-group {
          		display: grid;
          		gap: var(--nb-space-3);
          		margin: 0;
          		padding: 0 0 var(--nb-space-5);
          		border: 0;
          		border-bottom: 1px solid var(--nb-color-border-subtle);
          	}
          
          	.relationship-group legend {
          		font-weight: 750;
          	}
          
          	.relationship-group p,
          	.relationship-empty {
          		margin: 0;
          		color: var(--nb-color-text-muted);
          		font-size: var(--nb-font-size-sm);
          	}
          
          	.relationship-options {
          		display: grid;
          		gap: var(--nb-space-2);
          	}
          
          	.relationship-option {
          		display: grid;
          		grid-template-columns: auto minmax(0, 1fr);
          		align-items: start;
          		gap: var(--nb-space-3);
          		padding: var(--nb-space-3);
          		border: 1px solid var(--nb-color-border-subtle);
          		border-radius: var(--nb-radius-md);
          	}
          '''
          text = text.replace(css_marker, css + css_marker, 1)
          p.write_text(text)

          # 7. Fix version labels and stop presenting unimplemented V2 workspaces as ready.
          path = 'appv2/src/routes/[tenant]/app/(protected)/functions/f01/+page.svelte'
          replace_once(path, '<span>{focusFramework.code} · v{focusFramework.versionNumber}</span>', '<span>{focusFramework.code} · v{focusFramework.versionLabel}</span>')
          replace_once(path, '<span class="cycle-code">{framework.code} · v{framework.versionNumber}</span>', '<span class="cycle-code">{framework.code} · v{framework.versionLabel}</span>')
          replace_once(
              path,
              """\t\t\t\t\t\tstate: focusFramework.operatingModelComponentCount > 0 ? 'active' : 'ready'""",
              """\t\t\t\t\t\tstate: 'not-implemented'"""
          )
          replace_once(
              path,
              """\t\t\t\t\t\tstate: focusFramework.scenarioCount > 0 ? 'active' : 'ready'""",
              """\t\t\t\t\t\tstate: 'not-implemented'"""
          )
          replace_once(
              path,
              """{workstream.state === 'active' ? 'In use' : 'Ready'}""",
              """{workstream.state === 'active'\n\t\t\t\t\t\t\t\t\t? 'In use'\n\t\t\t\t\t\t\t\t\t: workstream.state === 'not-implemented'\n\t\t\t\t\t\t\t\t\t\t? 'Not yet activated'\n\t\t\t\t\t\t\t\t\t\t: 'Ready'}"""
          )

          # 8. Make the route README truthful about current V2 coverage.
          Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/README.md').write_text('''# F01 Strategy & Enterprise Planning\n\nThis route tree is the active V2 implementation of F01 Strategy & Enterprise Planning.\n\nImplemented V2 workspaces currently cover F01.01 direction, F01.02 environmental analysis, F01.03 strategic planning, F01.04 business planning, F01.06 goal/KPI management and F01.07 strategic review. F01.05 Operating Model and F01.08 Scenario & Foresight remain explicit V2 delivery gaps and must not be presented as available workflows until their transaction surfaces exist.\n\nF01 uses one strategy-cycle context, server-side effective permissions, transactional audit/outbox evidence, controlled CRUD/lifecycle policies and governed major/minor versions. Association editing is part of record governance: lineage must be amendable while mutable, validated against the parent context and frozen once the relevant lifecycle/version is published.\n\nThe governing product and domain architecture is `docs/world-class/15-f01-strategy-enterprise-planning-v2.md`.\n''')

          # 9. Correct the historical closure document so it cannot be mistaken for V2 completion evidence.
          path = 'docs/world-class/f01-strategy-enterprise-planning-closure-evidence.md'
          replace_once(
              path,
              '**Status:** Complete. F01.01–F01.08 are merged to `main`, the exact PR head and merged `main` commit both passed Complete System Validation, issue #124 is closed as completed, there are zero open pull requests, and `main` is the only remote branch.',
              '**Status:** Historical V1 closure evidence. This document records the earlier V1 closure and does **not** assert that the active `appv2` F01.01–F01.08 implementation is complete. V2 status is governed by `15-f01-strategy-enterprise-planning-v2.md` and the active `appv2` route tree.'
          )

          # 10. Add regression assertions for discard semantics.
          path = 'appv2/src/lib/server/platform/governed-versioning.test.ts'
          replace_once(
              path,
              """\tit('increments only the working minor coordinate between meaningful saves', () => {\n\t\texpect(nextMinorVersion(1)).toBe(2);\n\t\texpect(nextMinorVersion(4)).toBe(5);\n\t});""",
              """\tit('increments only the working minor coordinate between meaningful saves', () => {\n\t\texpect(nextMinorVersion(1)).toBe(2);\n\t\texpect(nextMinorVersion(4)).toBe(5);\n\t});\n\n\tit('keeps draft, published and historical coordinates distinct from discarded history', () => {\n\t\texpect(\n\t\t\tgovernedVersionCoordinates({ versionNumber: 3, minorVersionNumber: 2, lifecycleStatus: 'draft' })\n\t\t).toMatchObject({ label: '2.2', status: 'draft' });\n\t});"""
          )
          PY

      - name: Install V2 dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile

      - name: Format V2 changes
        working-directory: appv2
        run: pnpm format

      - name: Lint V2
        working-directory: appv2
        run: pnpm lint

      - name: Type-check V2
        working-directory: appv2
        run: pnpm check

      - name: Unit regression tests
        working-directory: appv2
        run: pnpm test:unit

      - name: Production build
        working-directory: appv2
        run: pnpm build

      - name: Commit validated hardening and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f01-integrity-hardening.yml
          git add appv2 docs/world-class/f01-strategy-enterprise-planning-closure-evidence.md
          git commit -m "fix(v2): harden F01 integrity and lineage"
          git push origin main
