name: Repository Branch Cleanup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged development branches
        run: |
          git push origin --delete feat/project-financial-control
          git push origin --delete noop
