name: Temporary F01 workflow transition semantics

on:
  push:
    branches:
      - feat/platform-workflow-lifecycle-engine

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-workflow-lifecycle-engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Separate submit authority from approval authority
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('appv2/src/lib/server/strategy/f01-lifecycle.ts')
          text = path.read_text()
          replacements = {
              "{ to: 'approved', label: 'Approve strategy', requiredPermissionKey: 'strategy.approve' }": "{ to: 'approved', label: 'Submit strategy for approval', requiredPermissionKey: 'strategy.manage', workflowKey: 'f01.strategy-approval' }",
              "label: 'Approve business plan',\n\t\t\t\t\trequiredPermissionKey: 'strategy.approve'": "label: 'Submit business plan for approval',\n\t\t\t\t\trequiredPermissionKey: 'strategy.manage',\n\t\t\t\t\tworkflowKey: 'f01.business-plan-approval'",
              "{ to: 'approved', label: 'Approve KPI', requiredPermissionKey: 'strategy.approve' }": "{ to: 'approved', label: 'Submit KPI for approval', requiredPermissionKey: 'strategy.manage', workflowKey: 'f01.kpi-approval' }",
              "{ to: 'approved', label: 'Approve review', requiredPermissionKey: 'strategy.approve' }": "{ to: 'approved', label: 'Submit review for approval', requiredPermissionKey: 'strategy.manage', workflowKey: 'f01.strategic-review-approval' }",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected lifecycle transition: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format patched lifecycle
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/server/strategy/f01-lifecycle.ts src/lib/server/strategy/f01-workflow-service.ts src/lib/server/strategy/f01-workflows.ts src/routes/[tenant]/app/'(protected)'/my-work/[request]/+page.server.ts
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-f01-workflow-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2 .github/workflows/temporary-f01-workflow-labels.yml
          git commit -m "fix(v2): route F01 submit actions into approval workflow"
          git push origin HEAD:feat/platform-workflow-lifecycle-engine
