name: F05 lifecycle formatter

on:
  push:
    branches:
      - feat/f05-product-service-innovation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f05-product-service-innovation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Canonicalise lifecycle files
        working-directory: app
        run: pnpm exec prettier --write src/lib/server/product-service/product-service-lifecycle-repository.ts src/lib/server/product-service/product-service-lifecycle-service.ts src/lib/server/product-service/product-service-lifecycle.integration.test.ts 'src/routes/(app)/product-service/+page.server.ts'
      - name: Commit formatter output and remove helper
        run: |
          rm .github/workflows/f05-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'F05: canonicalise lifecycle formatting'
          git push origin HEAD:feat/f05-product-service-innovation
