name: Temporary F01 World-Class Versioning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Integrate governed major/minor versioning
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # F01 strategy aggregate: expose 0.1 / 1.0 / 1.1 version semantics.
          # ------------------------------------------------------------------
          p = 'appv2/src/lib/server/strategy/f01-service.ts'
          s = read(p)
          s = rep(s,
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\n",
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\nimport { appendGovernedVersion, governedVersionCoordinates } from '$lib/server/platform/governed-versioning';\n",
              'f01-service versioning import')
          s = rep(s,
              "\tversionNumber: number;\n\ttitle: string;",
              "\tversionNumber: number;\n\tminorVersionNumber: number;\n\tversionLabel: string;\n\tversionStage: 'draft' | 'published' | 'historical';\n\ttitle: string;",
              'framework summary version fields')
          s = rep(s,
              "\tversionNumber: number | string;\n\ttitle: string;",
              "\tversionNumber: number | string;\n\tminorVersionNumber: number | string;\n\ttitle: string;",
              'framework row minor field')
          s = rep(s,
              "function mapFramework(row: FrameworkRow, memberId: string): StrategyFrameworkSummary {\n\treturn {\n\t\tpublicId: row.publicId,\n\t\tcode: row.code,\n\t\tversionNumber: Number(row.versionNumber),",
              "function mapFramework(row: FrameworkRow, memberId: string): StrategyFrameworkSummary {\n\tconst version = governedVersionCoordinates({\n\t\tversionNumber: Number(row.versionNumber),\n\t\tminorVersionNumber: Number(row.minorVersionNumber),\n\t\tlifecycleStatus: row.lifecycleStatus\n\t});\n\treturn {\n\t\tpublicId: row.publicId,\n\t\tcode: row.code,\n\t\tversionNumber: Number(row.versionNumber),\n\t\tminorVersionNumber: Number(row.minorVersionNumber),\n\t\tversionLabel: version.label,\n\t\tversionStage: version.status,",
              'map framework version coordinates')
          s = rep(s,
              "\t\t        framework.version_number AS versionNumber,\n\t\t        framework.title AS title,",
              "\t\t        framework.version_number AS versionNumber,\n\t\t        framework.minor_version_number AS minorVersionNumber,\n\t\t        framework.title AS title,",
              'framework list minor select')
          s = rep(s,
              "\t\t\t\t(organisation_id, public_id, framework_code, version_number, title,\n",
              "\t\t\t\t(organisation_id, public_id, framework_code, version_number, minor_version_number, title,\n",
              'framework insert minor column')
          s = rep(s,
              "\t\t\t VALUES (?, ?, ?, 1, ?, ?, ?, ?, ?, ?, 'draft', NULL, ?, ?, NULL, NULL)`,",
              "\t\t\t VALUES (?, ?, ?, 1, 1, ?, ?, ?, ?, ?, ?, 'draft', NULL, ?, ?, NULL, NULL)`,",
              'framework insert minor value')
          anchor = "\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.framework.create',"
          version_call = "\t\tawait appendGovernedVersion(connection, {\n\t\t\tactor: input.actor,\n\t\t\tdomainCode: 'F01',\n\t\t\trecordType: 'strategy_framework',\n\t\t\tlineageKey: code,\n\t\t\trecordPublicId: publicId,\n\t\t\tversionNumber: 1,\n\t\t\tminorVersionNumber: 1,\n\t\t\tlifecycleStatus: 'draft',\n\t\t\tsnapshot: { title, horizonStart, horizonEnd, purpose, vision, mission, lifecycleStatus: 'draft' },\n\t\t\tchangeNote: 'Initial working draft'\n\t\t});\n\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.framework.create',"
          s = rep(s, anchor, version_call, 'framework create version history')
          s = rep(s,
              "\t\t\t\tversionNumber: 1,\n\t\t\t\tlifecycleStatus: 'draft',",
              "\t\t\t\tversionNumber: 1,\n\t\t\t\tversionLabel: '0.1',\n\t\t\t\tlifecycleStatus: 'draft',",
              'framework create audit version label')
          write(p, s)

          # ------------------------------------------------------------------
          # Strategy approval promotes working minor to next published major.
          # ------------------------------------------------------------------
          p = 'appv2/src/lib/server/strategy/approval-service.ts'
          s = read(p)
          s = rep(s,
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\n",
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\nimport { appendGovernedVersion, markPublishedVersionHistorical } from '$lib/server/platform/governed-versioning';\n",
              'approval versioning import')
          s = rep(s,
              "\tcode: string;\n\ttitle: string;\n\tlifecycleStatus:",
              "\tcode: string;\n\tversionNumber: number | string;\n\tminorVersionNumber: number | string;\n\ttitle: string;\n\thorizonStart: Date | string;\n\thorizonEnd: Date | string;\n\tpurpose: string;\n\tvision: string;\n\tmission: string;\n\tlifecycleStatus:",
              'approval framework row fields')
          s = rep(s,
              "\t\t        framework_code AS code,\n\t\t        title,\n\t\t        lifecycle_status AS lifecycleStatus,",
              "\t\t        framework_code AS code,\n\t\t        version_number AS versionNumber,\n\t\t        minor_version_number AS minorVersionNumber,\n\t\t        title,\n\t\t        horizon_start AS horizonStart,\n\t\t        horizon_end AS horizonEnd,\n\t\t        purpose_text AS purpose,\n\t\t        vision_text AS vision,\n\t\t        mission_text AS mission,\n\t\t        lifecycle_status AS lifecycleStatus,",
              'approval lock select version fields')
          s = rep(s,
              "Promise<{ id: string; publicId: string; code: string } | null>",
              "Promise<{ id: string; publicId: string; code: string; versionNumber: number } | null>",
              'approved framework return type')
          s = rep(s,
              "(RowDataPacket & { id: string | number; publicId: string; code: string })[]",
              "(RowDataPacket & { id: string | number; publicId: string; code: string; versionNumber: number | string })[]",
              'approved framework row type')
          s = rep(s,
              "`SELECT id, public_id AS publicId, framework_code AS code\n",
              "`SELECT id, public_id AS publicId, framework_code AS code, version_number AS versionNumber\n",
              'approved framework select version')
          s = rep(s,
              "return row ? { id: row.id.toString(), publicId: row.publicId, code: row.code } : null;",
              "return row\n\t\t? { id: row.id.toString(), publicId: row.publicId, code: row.code, versionNumber: Number(row.versionNumber) }\n\t\t: null;",
              'approved framework map version')
          marker = "\t\t\tawait connection.execute(\n\t\t\t\t`UPDATE strategy_frameworks\n\t\t\t\t SET lifecycle_status = 'superseded'"
          if marker not in s: raise SystemExit('Missing predecessor supersede marker')
          # Insert history status change immediately after the supersede execute block.
          old = "\t\t\tawait connection.execute(\n\t\t\t\t`UPDATE strategy_frameworks\n\t\t\t\t SET lifecycle_status = 'superseded'\n\t\t\t\t WHERE organisation_id = ? AND id = ? AND lifecycle_status = 'approved'`,\n\t\t\t\t[input.actor.organisationId, existingApproved.id]\n\t\t\t);"
          new = old + "\n\t\t\tawait markPublishedVersionHistorical(connection, {\n\t\t\t\torganisationId: input.actor.organisationId,\n\t\t\t\tdomainCode: 'F01',\n\t\t\t\trecordType: 'strategy_framework',\n\t\t\t\tlineageKey: framework.code,\n\t\t\t\tmajorVersion: existingApproved.versionNumber\n\t\t\t});"
          s = rep(s, old, new, 'framework predecessor version historical')
          s = rep(s,
              "\t\t\t SET lifecycle_status = 'approved',\n\t\t\t     approved_by_member_id = ?,",
              "\t\t\t SET lifecycle_status = 'approved',\n\t\t\t     minor_version_number = 0,\n\t\t\t     approved_by_member_id = ?,",
              'framework approval zero minor')
          anchor = "\n\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.framework.approve',"
          call = "\n\t\tawait appendGovernedVersion(connection, {\n\t\t\tactor: input.actor,\n\t\t\tdomainCode: 'F01',\n\t\t\trecordType: 'strategy_framework',\n\t\t\tlineageKey: framework.code,\n\t\t\trecordPublicId: framework.publicId,\n\t\t\tversionNumber: Number(framework.versionNumber),\n\t\t\tminorVersionNumber: 0,\n\t\t\tlifecycleStatus: 'approved',\n\t\t\tsnapshot: {\n\t\t\t\ttitle: framework.title,\n\t\t\t\thorizonStart: framework.horizonStart,\n\t\t\t\thorizonEnd: framework.horizonEnd,\n\t\t\t\tpurpose: framework.purpose,\n\t\t\t\tvision: framework.vision,\n\t\t\t\tmission: framework.mission,\n\t\t\t\tlifecycleStatus: 'approved'\n\t\t\t},\n\t\t\tchangeNote: 'Approved strategic direction',\n\t\t\tpublished: true\n\t\t});\n\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.framework.approve',"
          s = rep(s, anchor, call, 'framework published version snapshot')
          s = rep(s,
              "\t\t\t\tlifecycleStatus: 'approved',\n\t\t\t\ttraceableObjectiveCount:",
              "\t\t\t\tlifecycleStatus: 'approved',\n\t\t\t\tversionLabel: `${Number(framework.versionNumber)}.0`,\n\t\t\t\ttraceableObjectiveCount:",
              'framework approval audit label')
          write(p, s)

          # ------------------------------------------------------------------
          # Business-plan approval uses the same publish/history mechanism.
          # ------------------------------------------------------------------
          p = 'appv2/src/lib/server/strategy/business-plan-approval-service.ts'
          s = read(p)
          s = rep(s,
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\n",
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\nimport { appendGovernedVersion, markPublishedVersionHistorical } from '$lib/server/platform/governed-versioning';\n",
              'plan approval versioning import')
          s = rep(s,
              "\tcode: string;\n\tlifecycleStatus:",
              "\tcode: string;\n\tversionNumber: number | string;\n\tminorVersionNumber: number | string;\n\ttitle: string;\n\tperiodStart: Date | string;\n\tperiodEnd: Date | string;\n\tnarrative: string;\n\tcurrencyCode: string;\n\tplannedRevenueAmount: string | number;\n\tplannedOpexAmount: string | number;\n\tplannedCapexAmount: string | number;\n\tlifecycleStatus:",
              'plan approval row fields')
          s = rep(s,
              "\t\t        plan.plan_code AS code,\n\t\t        plan.lifecycle_status AS lifecycleStatus,",
              "\t\t        plan.plan_code AS code,\n\t\t        plan.version_number AS versionNumber,\n\t\t        plan.minor_version_number AS minorVersionNumber,\n\t\t        plan.title,\n\t\t        plan.period_start AS periodStart,\n\t\t        plan.period_end AS periodEnd,\n\t\t        plan.narrative,\n\t\t        plan.currency_code AS currencyCode,\n\t\t        plan.planned_revenue_amount AS plannedRevenueAmount,\n\t\t        plan.planned_opex_amount AS plannedOpexAmount,\n\t\t        plan.planned_capex_amount AS plannedCapexAmount,\n\t\t        plan.lifecycle_status AS lifecycleStatus,",
              'plan approval select fields')
          s = rep(s,
              "(RowDataPacket & { id: string | number; publicId: string })[]",
              "(RowDataPacket & { id: string | number; publicId: string; versionNumber: number | string })[]",
              'previous plan row version')
          s = rep(s,
              "`SELECT id, public_id AS publicId\n",
              "`SELECT id, public_id AS publicId, version_number AS versionNumber\n",
              'previous plan select version')
          old = "\t\t\tawait connection.execute(\n\t\t\t\t`UPDATE strategy_business_plans SET lifecycle_status = 'superseded' WHERE organisation_id = ? AND id = ? AND lifecycle_status = 'approved'`,\n\t\t\t\t[input.actor.organisationId, previousApproved.id]\n\t\t\t);"
          new = old + "\n\t\t\tawait markPublishedVersionHistorical(connection, {\n\t\t\t\torganisationId: input.actor.organisationId,\n\t\t\t\tdomainCode: 'F01',\n\t\t\t\trecordType: 'strategy_business_plan',\n\t\t\t\tlineageKey: plan.code,\n\t\t\t\tmajorVersion: Number(previousApproved.versionNumber)\n\t\t\t});"
          s = rep(s, old, new, 'plan predecessor version historical')
          s = rep(s,
              "\t\t\t SET lifecycle_status = 'approved',\n\t\t\t     approved_by_member_id = ?,",
              "\t\t\t SET lifecycle_status = 'approved',\n\t\t\t     minor_version_number = 0,\n\t\t\t     approved_by_member_id = ?,",
              'plan approval zero minor')
          anchor = "\n\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.business-plan.approve',"
          call = "\n\t\tawait appendGovernedVersion(connection, {\n\t\t\tactor: input.actor,\n\t\t\tdomainCode: 'F01',\n\t\t\trecordType: 'strategy_business_plan',\n\t\t\tlineageKey: plan.code,\n\t\t\trecordPublicId: plan.publicId,\n\t\t\tversionNumber: Number(plan.versionNumber),\n\t\t\tminorVersionNumber: 0,\n\t\t\tlifecycleStatus: 'approved',\n\t\t\tsnapshot: {\n\t\t\t\ttitle: plan.title,\n\t\t\t\tperiodStart: plan.periodStart,\n\t\t\t\tperiodEnd: plan.periodEnd,\n\t\t\t\tnarrative: plan.narrative,\n\t\t\t\tcurrencyCode: plan.currencyCode,\n\t\t\t\tplannedRevenueAmount: plan.plannedRevenueAmount,\n\t\t\t\tplannedOpexAmount: plan.plannedOpexAmount,\n\t\t\t\tplannedCapexAmount: plan.plannedCapexAmount,\n\t\t\t\tlifecycleStatus: 'approved'\n\t\t\t},\n\t\t\tchangeNote: 'Approved business plan',\n\t\t\tpublished: true\n\t\t});\n\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.business-plan.approve',"
          s = rep(s, anchor, call, 'plan published version snapshot')
          s = rep(s,
              "\t\t\t\tlifecycleStatus: 'approved',\n\t\t\t\tobjectiveCount:",
              "\t\t\t\tlifecycleStatus: 'approved',\n\t\t\t\tversionLabel: `${Number(plan.versionNumber)}.0`,\n\t\t\t\tobjectiveCount:",
              'plan approval audit label')
          write(p, s)

          # ------------------------------------------------------------------
          # F01 execution service: version labels, initial minors and KPI publish.
          # ------------------------------------------------------------------
          p = 'appv2/src/lib/server/strategy/execution-review-service.ts'
          s = read(p)
          s = rep(s,
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\n",
              "import { appendDomainEvidence, type EvidenceActor } from '$lib/server/platform/evidence';\nimport { appendGovernedVersion, governedVersionCoordinates, markPublishedVersionHistorical } from '$lib/server/platform/governed-versioning';\n",
              'execution versioning import')
          s = rep(s,
              "\tversionNumber: number;\n\ttitle: string;",
              "\tversionNumber: number;\n\tminorVersionNumber: number;\n\tversionLabel: string;\n\tversionStage: 'draft' | 'published' | 'historical';\n\ttitle: string;",
              'plan type version fields')
          s = rep(s,
              "export type StrategyKpi = {\n\tpublicId: string;\n\tcode: string;\n\ttitle: string;",
              "export type StrategyKpi = {\n\tpublicId: string;\n\tcode: string;\n\tversionNumber: number;\n\tminorVersionNumber: number;\n\tversionLabel: string;\n\tversionStage: 'draft' | 'published' | 'historical';\n\ttitle: string;",
              'kpi type version fields')
          s = rep(s,
              "\tversionNumber: number | string;\n\ttitle: string;",
              "\tversionNumber: number | string;\n\tminorVersionNumber: number | string;\n\ttitle: string;",
              'plan row minor field')
          s = rep(s,
              "type KpiRow = RowDataPacket & {\n\tpublicId: string;\n\tcode: string;\n\ttitle: string;",
              "type KpiRow = RowDataPacket & {\n\tpublicId: string;\n\tcode: string;\n\tversionNumber: number | string;\n\tminorVersionNumber: number | string;\n\ttitle: string;",
              'kpi row version fields')
          s = rep(s,
              "\t\t        plan.version_number AS versionNumber,\n\t\t        plan.title,",
              "\t\t        plan.version_number AS versionNumber,\n\t\t        plan.minor_version_number AS minorVersionNumber,\n\t\t        plan.title,",
              'plan list minor select')
          old = "\treturn rows.map((row) => ({\n\t\tpublicId: row.publicId,\n\t\tcode: row.code,\n\t\tversionNumber: Number(row.versionNumber),\n\t\ttitle: row.title,"
          new = "\treturn rows.map((row) => {\n\t\tconst version = governedVersionCoordinates({\n\t\t\tversionNumber: Number(row.versionNumber),\n\t\t\tminorVersionNumber: Number(row.minorVersionNumber),\n\t\t\tlifecycleStatus: row.lifecycleStatus\n\t\t});\n\t\treturn {\n\t\t\tpublicId: row.publicId,\n\t\t\tcode: row.code,\n\t\t\tversionNumber: Number(row.versionNumber),\n\t\t\tminorVersionNumber: Number(row.minorVersionNumber),\n\t\t\tversionLabel: version.label,\n\t\t\tversionStage: version.status,\n\t\t\ttitle: row.title,"
          s = rep(s, old, new, 'plan map version start')
          s = rep(s,
              "\t\tinitiativeCount: Number(row.initiativeCount)\n\t}));\n}\n\nasync function listInitiatives",
              "\t\t\tinitiativeCount: Number(row.initiativeCount)\n\t\t};\n\t});\n}\n\nasync function listInitiatives",
              'plan map version end')
          s = rep(s,
              "\t\t        kpi.kpi_code AS code,\n\t\t        kpi.title,",
              "\t\t        kpi.kpi_code AS code,\n\t\t        kpi.version_number AS versionNumber,\n\t\t        kpi.minor_version_number AS minorVersionNumber,\n\t\t        kpi.title,",
              'kpi list version select')
          old = "\treturn rows.map((row) => ({\n\t\tpublicId: row.publicId,\n\t\tcode: row.code,\n\t\ttitle: row.title,\n\t\tobjectivePublicId: row.objectivePublicId,"
          new = "\treturn rows.map((row) => {\n\t\tconst version = governedVersionCoordinates({\n\t\t\tversionNumber: Number(row.versionNumber),\n\t\t\tminorVersionNumber: Number(row.minorVersionNumber),\n\t\t\tlifecycleStatus: row.lifecycleStatus\n\t\t});\n\t\treturn {\n\t\t\tpublicId: row.publicId,\n\t\t\tcode: row.code,\n\t\t\tversionNumber: Number(row.versionNumber),\n\t\t\tminorVersionNumber: Number(row.minorVersionNumber),\n\t\t\tversionLabel: version.label,\n\t\t\tversionStage: version.status,\n\t\t\ttitle: row.title,\n\t\t\tobjectivePublicId: row.objectivePublicId,"
          s = rep(s, old, new, 'kpi map version start')
          s = rep(s,
              "\t\tlatestObservedOn: dateValue(row.latestObservedOn)\n\t}));\n}\n\nasync function listReviews",
              "\t\t\tlatestObservedOn: dateValue(row.latestObservedOn)\n\t\t};\n\t});\n}\n\nasync function listReviews",
              'kpi map version end')
          s = rep(s,
              "\t\t\t\t(organisation_id, strategy_framework_id, public_id, plan_code, version_number,\n",
              "\t\t\t\t(organisation_id, strategy_framework_id, public_id, plan_code, version_number, minor_version_number,\n",
              'plan create minor column')
          s = rep(s,
              "\t\t\t VALUES (?, ?, ?, ?, 1, ?, ?, ?, ?, ?, ?, ?, ?, 'draft', NULL, ?, ?, NULL, NULL)`,",
              "\t\t\t VALUES (?, ?, ?, ?, 1, 1, ?, ?, ?, ?, ?, ?, ?, ?, 'draft', NULL, ?, ?, NULL, NULL)`,",
              'plan create minor value')
          anchor = "\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.business-plan.create',"
          call = "\t\tawait appendGovernedVersion(connection, {\n\t\t\tactor: input.actor,\n\t\t\tdomainCode: 'F01',\n\t\t\trecordType: 'strategy_business_plan',\n\t\t\tlineageKey: code,\n\t\t\trecordPublicId: publicId,\n\t\t\tversionNumber: 1,\n\t\t\tminorVersionNumber: 1,\n\t\t\tlifecycleStatus: 'draft',\n\t\t\tsnapshot: { title, periodStart, periodEnd, narrative, currencyCode, plannedRevenueAmount, plannedOpexAmount, plannedCapexAmount, objectivePublicIds, lifecycleStatus: 'draft' },\n\t\t\tchangeNote: 'Initial business-plan working draft'\n\t\t});\n\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.business-plan.create',"
          s = rep(s, anchor, call, 'plan initial version')
          s = rep(s,
              "\t\t\t\t kpi_code, version_number, title, description, unit_label, direction,",
              "\t\t\t\t kpi_code, version_number, minor_version_number, title, description, unit_label, direction,",
              'kpi create minor column')
          s = rep(s,
              "\t\t\t VALUES (?, ?, ?, ?, ?, 1, ?, ?, ?, ?, 'latest', ?, ?, NULL, NULL, ?,",
              "\t\t\t VALUES (?, ?, ?, ?, ?, 1, 1, ?, ?, ?, ?, 'latest', ?, ?, NULL, NULL, ?,",
              'kpi create minor value')
          anchor = "\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.kpi.create',"
          call = "\t\tawait appendGovernedVersion(connection, {\n\t\t\tactor: input.actor,\n\t\t\tdomainCode: 'F01',\n\t\t\trecordType: 'strategy_kpi',\n\t\t\tlineageKey: code,\n\t\t\trecordPublicId: publicId,\n\t\t\tversionNumber: 1,\n\t\t\tminorVersionNumber: 1,\n\t\t\tlifecycleStatus: 'draft',\n\t\t\tsnapshot: { title, description, unitLabel, direction: input.direction, baselineValue, targetValue, targetDate, objectivePublicId: input.objectivePublicId, initiativePublicIds, lifecycleStatus: 'draft' },\n\t\t\tchangeNote: 'Initial KPI working draft'\n\t\t});\n\t\tawait appendDomainEvidence(connection, {\n\t\t\tactor: input.actor,\n\t\t\tactionKey: 'strategy.kpi.create',"
          s = rep(s, anchor, call, 'kpi initial version')
          # KPI approval: enrich locked record and predecessor, publish to major.
          s = rep(s,
              "\t\t\t\tid: string | number;\n\t\t\t\tcode: string;\n\t\t\t\tlifecycleStatus: KpiStatus;",
              "\t\t\t\tid: string | number;\n\t\t\t\tcode: string;\n\t\t\t\tversionNumber: number | string;\n\t\t\t\tminorVersionNumber: number | string;\n\t\t\t\ttitle: string;\n\t\t\t\tdescription: string;\n\t\t\t\tunitLabel: string;\n\t\t\t\tdirection: string;\n\t\t\t\tbaselineValue: string | number;\n\t\t\t\ttargetValue: string | number;\n\t\t\t\ttargetDate: Date | string | null;\n\t\t\t\tlifecycleStatus: KpiStatus;",
              'kpi approval lock fields')
          s = rep(s,
              "`SELECT id, kpi_code AS code, lifecycle_status AS lifecycleStatus,\n\t\t\t        supersedes_strategy_kpi_id AS supersedesKpiId",
              "`SELECT id, kpi_code AS code, version_number AS versionNumber, minor_version_number AS minorVersionNumber,\n\t\t\t        title, description, unit_label AS unitLabel, direction, baseline_value AS baselineValue,\n\t\t\t        target_value AS targetValue, target_date AS targetDate, lifecycle_status AS lifecycleStatus,\n\t\t\t        supersedes_strategy_kpi_id AS supersedesKpiId",
