name: Temporary F01 World-Class Versioning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Integrate governed major/minor versioning
        run: |
          python3 .github/scripts/fix-f01-versioning-stage.py
          python3 .github/scripts/f01-world-class-versioning.py
      - name: Install
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Format
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/server/platform/governed-versioning.ts src/lib/server/platform/governed-versioning.test.ts src/lib/server/strategy/f01-service.ts src/lib/server/strategy/approval-service.ts src/lib/server/strategy/business-plan-approval-service.ts src/lib/server/strategy/execution-review-service.ts src/lib/server/strategy/f01-record-management-service.ts 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/+page.svelte' 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/manage/[kind]/[record]/+page.svelte'
      - name: Lint
        working-directory: appv2
        run: pnpm lint
      - name: Type-check
        working-directory: appv2
        run: pnpm check
      - name: Unit tests
        working-directory: appv2
        run: pnpm test:unit
      - name: Build
        working-directory: appv2
        run: pnpm build
      - name: Commit validated F01 versioning and clean branches
        shell: bash
        run: |
          rm -f .github/workflows/temporary-f01-world-class-versioning.yml
          rm -f .github/scripts/f01-world-class-versioning.py
          rm -f .github/scripts/fix-f01-versioning-stage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v2): govern F01 major minor versioning"
          git push origin HEAD:main
          git push origin --delete fix/f01-crud-lifecycle f01-crud-lifecycle-integrity || true
