name: F05 format repair

on:
  push:
    branches:
      - feat/f05-product-service-innovation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f05-product-service-innovation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Normalize F05 lifecycle files
        working-directory: app
        run: pnpm exec prettier --write src/lib/server/product-service/product-service-lifecycle-service.ts src/lib/server/product-service/product-service-repository.ts
      - name: Commit normalized files and remove helper
        run: |
          rm .github/workflows/f05-format-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/product-service/product-service-lifecycle-service.ts app/src/lib/server/product-service/product-service-repository.ts .github/workflows/f05-format-repair.yml
          git commit -m 'F05: normalize lifecycle repair formatting'
          git push origin HEAD:feat/f05-product-service-innovation
