name: Fix Delegated Authority Lint

on:
  push:
    branches:
      - rbac/delegated-access-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbac/delegated-access-authority

      - name: Remove unused Owner role public ID fixture variable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/organisations/delegated-access-authority.integration.test.ts')
          text = path.read_text()
          text = text.replace("let ownerRolePublicId: string;\n", "")
          text = text.replace("\t({ id: ownerRoleId, publicId: ownerRolePublicId } = await createRole('Owner'));", "\t({ id: ownerRoleId } = await createRole('Owner'));")
          path.write_text(text)
          PY

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/organisations/delegated-access-authority.integration.test.ts
          git commit -m "Remove unused delegated authority fixture variable"
          git push origin HEAD:rbac/delegated-access-authority
