name: F01 Tranche C Typecheck Fix

on:
  push:
    branches:
      - feat/f01-performance-foresight

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-performance-foresight
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Fix F01 typecheck diagnostics
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('src/lib/server/strategy/performance-foresight-service.ts')
          source = service.read_text()
          old = "\t\tlet selectedFramework = frameworks[0] ?? null;"
          new = "\t\tlet selectedFramework: StrategyFrameworkRecord | null = frameworks[0] ?? null;"
          if old not in source:
              raise SystemExit('selectedFramework assignment not found')
          service.write_text(source.replace(old, new, 1))

          page = Path('src/routes/(app)/strategy/performance/+page.svelte')
          source = page.read_text()
          css = "\t.table-wrap {\n\t\toverflow: auto;\n\t}\n\ttable {\n\t\twidth: 100%;\n\t\tborder-collapse: collapse;\n\t}\n\tth,\n\ttd {\n\t\ttext-align: left;\n\t\tpadding: 0.65rem;\n\t\tborder-bottom: 1px solid var(--color-border, #dfe3e8);\n\t\tvertical-align: top;\n\t\tfont-size: 0.82rem;\n\t}\n"
          if css not in source:
              raise SystemExit('obsolete table CSS not found')
          page.write_text(source.replace(css, '', 1))
          PY
          pnpm exec prettier --write \
            src/lib/server/strategy/performance-foresight-service.ts \
            'src/routes/(app)/strategy/performance/+page.svelte'
          pnpm check
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/strategy/performance-foresight-service.ts \
            'app/src/routes/(app)/strategy/performance/+page.svelte'
          git rm .github/workflows/f01-tranche-c-typecheck-fix.yml
          git commit -m 'Fix F01 tranche C typecheck diagnostics'
          git push origin HEAD:feat/f01-performance-foresight
