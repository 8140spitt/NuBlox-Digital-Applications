name: Temporary F01 CRUD Lifecycle Repair

on:
  push:
    branches:
      - fix/f01-crud-lifecycle

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/f01-crud-lifecycle
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Apply F01 lifecycle patches
        run: |
          python scripts/temporary-f01-crud-lifecycle-repair.py
          python scripts/temporary-f01-crud-lifecycle-type-fix.py
          python scripts/temporary-f01-crud-lifecycle-followup.py

      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        working-directory: appv2
        run: pnpm exec prettier --write "src/lib/routing/route-contract.ts" "src/lib/server/strategy/f01-lifecycle.ts" "src/lib/server/strategy/f01-lifecycle.test.ts" "src/lib/server/strategy/f01-record-management-service.ts" "src/lib/server/strategy/approval-readiness-service.ts" "src/lib/server/strategy/approval-service.ts" "src/lib/server/strategy/business-plan-approval-service.ts" "src/lib/server/strategy/execution-review-service.ts" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/analysis/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/planning/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/new/[record]/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/new/[record]/+page.svelte" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/manage/[kind]/[record]/+page.server.ts" "src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/manage/[kind]/[record]/+page.svelte"

      - name: Lint
        working-directory: appv2
        run: pnpm lint

      - name: Type-check
        working-directory: appv2
        run: pnpm check

      - name: Unit tests
        working-directory: appv2
        run: pnpm test:unit

      - name: Production build
        working-directory: appv2
        run: pnpm build

      - name: Commit validated repair and remove temporary helpers
        run: |
          rm scripts/temporary-f01-crud-lifecycle-repair.py
          rm scripts/temporary-f01-crud-lifecycle-type-fix.py
          rm scripts/temporary-f01-crud-lifecycle-followup.py
          rm .github/workflows/temporary-f01-crud-lifecycle-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v2): complete F01 CRUD and lifecycle controls"
          git push origin HEAD:fix/f01-crud-lifecycle
