name: Fix AP accounting source references

on:
  push:
    branches:
      - feat/ap-accounting-digital-thread

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ap-source-ref-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ap-accounting-digital-thread
          fetch-depth: 0
      - name: Apply correction
        run: python3 scripts/fix-ap-accounting-source-references.py
      - name: Remove one-time correction machinery
        run: |
          rm scripts/fix-ap-accounting-source-references.py
          rm .github/workflows/fix-ap-accounting-source-references.yml
      - name: Commit correction
        run: |
          git config user.name 'NuBlox CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix AP accounting source reference ordering [ap-source-ref-fixed]'
          git push origin HEAD:feat/ap-accounting-digital-thread
