name: F02 Dependency Audit Fix

on:
  push:
    branches:
      - feat/f02-corporate-governance
    paths:
      - '.github/workflows/f02-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f02-corporate-governance

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Pin patched Vitest dependency graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/package.json')
          data = json.loads(path.read_text())
          data['devDependencies']['vitest'] = '^4.1.11'
          data['devDependencies']['@vitest/browser-playwright'] = '^4.1.11'
          overrides = data.setdefault('pnpm', {}).setdefault('overrides', {})
          overrides['vitest'] = '4.1.11'
          overrides['@vitest/mocker'] = '4.1.11'
          path.write_text(json.dumps(data, indent='\t') + '\n')
          PY

      - name: Refresh lockfile and prove production audit
        working-directory: app
        run: |
          pnpm install
          pnpm audit --prod --audit-level moderate

      - name: Self-clean and commit patched dependency graph
        run: |
          rm .github/workflows/f02-audit-fix.yml
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add app/package.json app/pnpm-lock.yaml .github/workflows/f02-audit-fix.yml
          git commit -m 'Patch Vitest advisory in production dependency graph'
          git push origin HEAD:feat/f02-corporate-governance
