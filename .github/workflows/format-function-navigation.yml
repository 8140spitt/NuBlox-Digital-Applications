name: Format function navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-function-navigation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format navigation file
        working-directory: app
        run: pnpm exec prettier --write src/lib/navigation/function-navigation.ts
      - name: Remove formatter workflow
        run: rm .github/workflows/format-function-navigation.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/navigation/function-navigation.ts .github/workflows/format-function-navigation.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format enterprise function navigation"
          git push origin HEAD:main
