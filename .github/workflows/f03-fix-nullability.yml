name: F03 Fix Workspace Nullability

on:
  push:
    branches:
      - feat/f03-enterprise-performance-management
    paths:
      - '.github/workflows/f03-fix-nullability.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f03-enterprise-performance-management
      - name: Apply narrow type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/lib/server/strategy/enterprise-performance-service.ts')
          s = p.read_text()
          old = "\t\tlet selectedFramework = frameworks.find((row) => row.lifecycle_status === 'approved') ?? frameworks[0] ?? null;"
          new = "\t\tlet selectedFramework: PerformanceFrameworkRecord | null = frameworks.find((row) => row.lifecycle_status === 'approved') ?? frameworks[0] ?? null;"
          if old not in s:
              raise SystemExit('Expected nullability line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/f03-core-check.yml .github/workflows/f03-fix-nullability.yml
      - name: Commit fix
        run: |
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add app/src/lib/server/strategy/enterprise-performance-service.ts .github/workflows/f03-core-check.yml .github/workflows/f03-fix-nullability.yml
          git commit -m 'F03: fix performance workspace framework typing'
          git push origin HEAD:feat/f03-enterprise-performance-management
