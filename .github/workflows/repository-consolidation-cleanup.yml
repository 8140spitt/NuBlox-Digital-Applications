name: Repository branch purge

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/repository-cleanup-trigger'

permissions:
  contents: write
  pull-requests: write

jobs:
  purge:
    if: github.head_ref == 'chore/repository-consolidation-cleanup-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Close cleanup trigger pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed >/dev/null

      - name: Delete every remote branch except main
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == 'main' || "$branch" == 'HEAD' ]] && continue
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/ | sort)

      - name: Verify main is the only remaining branch
        shell: bash
        run: |
          mapfile -t branches < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)
          printf 'Remaining branches:\n'
          printf ' - %s\n' "${branches[@]}"
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = 'main'
