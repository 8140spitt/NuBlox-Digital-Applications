name: Format scoped reviewer files

on:
  push:
    branches:
      - rbac/scoped-access-reviewers

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbac/scoped-access-reviewers
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        working-directory: app
        run: pnpm exec prettier --write src/lib/server/organisations/access-review-service.ts src/lib/server/organisations/access-review.integration.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/organisations/access-review-service.ts app/src/lib/server/organisations/access-review.integration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format scoped access reviewer implementation"
          git push origin HEAD:rbac/scoped-access-reviewers
