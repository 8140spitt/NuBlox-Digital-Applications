name: Apply AP accounting digital-thread patch

on:
  push:
    branches:
      - feat/ap-accounting-digital-thread

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ap-accounting-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ap-accounting-digital-thread
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply integration patch
        run: python3 scripts/apply-ap-accounting-digital-thread.py
      - name: Format changed application files
        working-directory: app
        run: >-
          pnpm exec prettier --write
          src/lib/server/finance/accounting-source-service.ts
          src/lib/server/finance/accounting-service.ts
          'src/routes/(app)/finance/accounting/+page.svelte'
          src/lib/server/finance/accounts-payable.integration.test.ts
      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-ap-accounting-digital-thread.py
          rm .github/workflows/ap-accounting-digital-thread-patch.yml
      - name: Commit applied integration
        run: |
          git config user.name 'NuBlox CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Connect approved AP documents to accounting sources [ap-accounting-patch-applied]'
          git push origin HEAD:feat/ap-accounting-digital-thread
