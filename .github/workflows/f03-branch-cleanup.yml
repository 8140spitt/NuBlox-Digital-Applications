name: F03 Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/f03-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged F03 branch and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --delete feat/f03-enterprise-performance-management || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f03-branch-cleanup.yml
          git commit -m "chore: remove F03 branch cleanup workflow"
          git push origin main
