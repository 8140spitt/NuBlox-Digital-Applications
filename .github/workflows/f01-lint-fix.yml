name: F01 Lint Fix

on:
  push:
    branches:
      - feat/f01-completion-reset

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(v2): resolve final F01 lint findings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/f01-completion-reset
          fetch-depth: 0

      - name: Apply lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('appv2/src/lib/server/strategy/operating-foresight-service.ts')
          text = service.read_text()
          text = text.replace('PoolConnection, ResultSetHeader, RowDataPacket', 'PoolConnection, RowDataPacket')
          service.write_text(text)

          page = Path('appv2/src/routes/[tenant]/app/(protected)/functions/[functionId]/+page.svelte')
          text = page.read_text()
          text = text.replace("<script lang=\"ts\">\n", "<script lang=\"ts\">\n\timport { resolve } from '$app/paths';\n", 1)
          text = text.replace('<a href={architectureHref}>Open job architecture</a>', '<a href={resolve(architectureHref)}>Open job architecture</a>')
          page.write_text(text)

          strategy = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/+page.svelte')
          text = strategy.read_text()
          text = text.replace("\timport { enhance } from '$app/forms';\n", "\timport { enhance } from '$app/forms';\n\timport { resolve } from '$app/paths';\n", 1)
          text = text.replace('<a href={area.href} class="area-card">', '<a href={resolve(area.href)} class="area-card">')
          strategy.write_text(text)
          PY

      - name: Format affected files
        working-directory: appv2
        run: npx prettier --write src/lib/server/strategy/operating-foresight-service.ts 'src/routes/[tenant]/app/(protected)/functions/[functionId]/+page.svelte' 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/+page.svelte'

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2
          git commit -m "fix(v2): resolve final F01 lint findings"
          git push origin HEAD:feat/f01-completion-reset
