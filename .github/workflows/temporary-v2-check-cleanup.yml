name: Temporary V2 Check Cleanup

on:
  push:
    branches:
      - fix/lifecycle-workflow-runtime
    paths:
      - '.github/workflows/temporary-v2-check-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lifecycle-workflow-runtime
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply check cleanup
        run: |
          python <<'PY'
          from pathlib import Path

          runtime_test = Path('appv2/src/lib/server/platform/workflow-request-runtime.integration.test.ts')
          text = runtime_test.read_text()
          text = text.replace("nodeIds.get('prepare'),", "nodeIds.get('prepare')!,")
          text = text.replace("nodeIds.get('review'),", "nodeIds.get('review')!,")
          text = text.replace("nodeIds.get(from),", "nodeIds.get(from)!,")
          text = text.replace("nodeIds.get(to),", "nodeIds.get(to)!,")
          runtime_test.write_text(text)

          designer = Path('appv2/src/routes/[tenant]/app/(protected)/workflow/[template]/designer/+page.svelte')
          text = designer.read_text()
          old = "\tlet nodes = $state([...data.template.nodes]);"
          new = "\tlet nodes = $state<Array<(typeof data.template.nodes)[number]>>([]);"
          if old not in text:
              raise SystemExit('designer state pattern not found')
          designer.write_text(text.replace(old, new, 1))

          pages = [
              Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte'),
              Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/new/[record]/+page.svelte'),
              Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/new/[record]/+page.svelte'),
          ]
          for page in pages:
              text = page.read_text()
              text = text.replace("\n\t.transaction-page {\n\t}\n", "\n")
              page.write_text(text)
          PY

      - name: Format changed files
        working-directory: appv2
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/lib/server/platform/workflow-request-runtime.integration.test.ts 'src/routes/[tenant]/app/(protected)/workflow/[template]/designer/+page.svelte' 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte' 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/new/[record]/+page.svelte' 'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/new/[record]/+page.svelte'

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "8140spitt"
          git config user.email "56647740+8140spitt@users.noreply.github.com"
          git rm .github/workflows/temporary-v2-check-cleanup.yml
          git add appv2/src/lib/server/platform/workflow-request-runtime.integration.test.ts 'appv2/src/routes/[tenant]/app/(protected)/workflow/[template]/designer/+page.svelte' 'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte' 'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/new/[record]/+page.svelte' 'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/new/[record]/+page.svelte'
          git commit -m "fix(v2): clear runtime type and Svelte diagnostics"
          git push origin HEAD:fix/lifecycle-workflow-runtime
