name: Patch MySQL 8.4 Self-Parent Checks

on:
  push:
    branches:
      - validation/database-baseline-v1
    paths:
      - '.github/workflows/patch-parent-self-checks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/database-baseline-v1
          fetch-depth: 0

      - name: Remove AUTO_INCREMENT self-reference CHECK constraints
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p9 = Path('database/schema/009-commercial-cost-control.sql')
          t9 = p9.read_text()
          old9 = """    CONSTRAINT ck_project_cost_codes_parent\n        CHECK (parent_cost_code_id IS NULL OR parent_cost_code_id <> id),\n"""
          if old9 not in t9:
              raise SystemExit('Package 009 self-parent CHECK block not found')
          t9 = t9.replace(old9, '', 1)
          marker9 = "-- 2. Cost codes are classification/master data, not stored balances.\n"
          if marker9 in t9 and 'Cost-code self-parent prohibition' not in t9:
              t9 = t9.replace(marker9, marker9 + "--    Cost-code self-parent prohibition is enforced in the domain layer because MySQL 8.4\n--    does not permit CHECK constraints to reference an AUTO_INCREMENT column.\n", 1)
          p9.write_text(t9)

          p10 = Path('database/schema/010-assets-maintenance.sql')
          t10 = p10.read_text()
          replacements = [
              ("""    CONSTRAINT fk_facility_spaces_parent\n        FOREIGN KEY (\n            parent_space_id, organisation_id, facility_id, facility_building_id\n        ) REFERENCES facility_spaces (\n            id, organisation_id, facility_id, facility_building_id\n        ) ON UPDATE RESTRICT ON DELETE RESTRICT,\n    CONSTRAINT ck_facility_spaces_parent\n        CHECK (parent_space_id IS NULL OR parent_space_id <> id)\n""",
               """    CONSTRAINT fk_facility_spaces_parent\n        FOREIGN KEY (\n            parent_space_id, organisation_id, facility_id, facility_building_id\n        ) REFERENCES facility_spaces (\n            id, organisation_id, facility_id, facility_building_id\n        ) ON UPDATE RESTRICT ON DELETE RESTRICT\n"""),
              ("""    CONSTRAINT ck_building_systems_parent\n        CHECK (parent_system_id IS NULL OR parent_system_id <> id),\n""", ""),
              ("""    CONSTRAINT ck_assets_parent\n        CHECK (parent_asset_id IS NULL OR parent_asset_id <> id),\n""", ""),
          ]
          for old, new in replacements:
              if old not in t10:
                  raise SystemExit('Package 010 expected self-parent block not found')
              t10 = t10.replace(old, new, 1)
          marker10 = "-- 3. Building/space/system/asset identity is relational; no generic EAV asset master is introduced.\n"
          if marker10 in t10 and 'Hierarchy self-parent prohibition' not in t10:
              t10 = t10.replace(marker10, marker10 + "--    Hierarchy self-parent prohibition is enforced in the domain layer because MySQL 8.4\n--    does not permit CHECK constraints to reference AUTO_INCREMENT identity columns.\n", 1)
          p10.write_text(t10)
          PY

      - name: Commit compatibility corrections
        run: |
          git config user.name 'NuBlox Schema Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add database/schema/009-commercial-cost-control.sql database/schema/010-assets-maintenance.sql
          git commit -m 'Make hierarchy self-parent rules MySQL 8.4 compatible'
          git push origin HEAD:validation/database-baseline-v1
