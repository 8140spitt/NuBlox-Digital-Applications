name: Temporary Runtime Review Fixes

on:
  push:
    branches:
      - fix/lifecycle-workflow-runtime
    paths:
      - '.github/workflows/temporary-runtime-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lifecycle-workflow-runtime
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Apply reviewed runtime fixes
        run: python .github/scripts/apply-runtime-review-fixes.py

      - name: Install and format
        working-directory: appv2
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/lib/server/platform/workflow-request-service.ts src/lib/server/platform/workflow-request-runtime.integration.test.ts src/lib/server/strategy/f01-lifecycle-resolver.ts src/lib/server/strategy/f01-lifecycle-resolver.test.ts

      - name: Commit fixes and remove temporary tooling
        run: |
          git config user.name "8140spitt"
          git config user.email "56647740+8140spitt@users.noreply.github.com"
          git rm .github/workflows/temporary-runtime-review-fixes.yml .github/scripts/apply-runtime-review-fixes.py
          git add appv2/src/lib/server/platform/workflow-request-service.ts appv2/src/lib/server/platform/workflow-request-runtime.integration.test.ts appv2/src/lib/server/strategy/f01-lifecycle-resolver.ts appv2/src/lib/server/strategy/f01-lifecycle-resolver.test.ts
          git commit -m "fix(v2): close workflow runtime review gaps"
          git push origin HEAD:fix/lifecycle-workflow-runtime
