name: Patch Organisation Admin Governance Test

on:
  push:
    branches:
      - rbac/delegated-access-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbac/delegated-access-authority

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Make backup manager perform the restoration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/organisations/organisation-administration.integration.test.ts')
          text = path.read_text()
          marker = "\t\tawait service.updateRole(actor(), {\n\t\t\trolePublicId: adminRolePublicId,\n\t\t\tname: `${PREFIX}Administrator`,\n\t\t\tisActive: true,\n\t\t\tpermissionKeys: ['organisation.manage', 'member.manage', 'member.invite']\n\t\t});"
          replacement = "\t\tawait service.updateRole(\n\t\t\t{\n\t\t\t\torganisationId,\n\t\t\t\tuserId: backupUserId,\n\t\t\t\tmemberId: backupMemberId,\n\t\t\t\tcorrelationId: `organisation-admin-backup-it-${randomUUID()}`\n\t\t\t},\n\t\t\t{\n\t\t\t\trolePublicId: adminRolePublicId,\n\t\t\t\tname: `${PREFIX}Administrator`,\n\t\t\t\tisActive: true,\n\t\t\t\tpermissionKeys: ['organisation.manage', 'member.manage', 'member.invite']\n\t\t\t}\n\t\t);"
          if marker not in text:
              raise SystemExit('Expected final manager restoration call not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Canonically format changed test
        working-directory: app
        run: pnpm exec prettier --write src/lib/server/organisations/organisation-administration.integration.test.ts

      - name: Commit governance regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/organisations/organisation-administration.integration.test.ts
          git commit -m "Require active manager for role authority restoration"
          git push origin HEAD:rbac/delegated-access-authority
