name: F01 Format Helper

on:
  push:
    branches:
      - feat/f01-strategy-intent-analysis

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Format F01 strategy files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-strategy-intent-analysis
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format F01 files
        working-directory: app
        run: >-
          pnpm exec prettier --write
          e2e/strategy-enterprise-planning.e2e.ts
          src/lib/server/strategy/strategy-repository.ts
          src/lib/server/strategy/strategy-service.ts
          src/lib/server/strategy/strategy.integration.test.ts
          'src/routes/(app)/strategy/+page.server.ts'
          'src/routes/(app)/strategy/+page.svelte'
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/strategy-enterprise-planning.e2e.ts \
            app/src/lib/server/strategy/strategy-repository.ts \
            app/src/lib/server/strategy/strategy-service.ts \
            app/src/lib/server/strategy/strategy.integration.test.ts \
            'app/src/routes/(app)/strategy/+page.server.ts' \
            'app/src/routes/(app)/strategy/+page.svelte'
          git diff --cached --quiet && exit 0
          git commit -m "Format F01 strategy files"
          git push origin feat/f01-strategy-intent-analysis
