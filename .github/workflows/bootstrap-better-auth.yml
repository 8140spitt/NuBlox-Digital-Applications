name: Bootstrap Better Auth

on:
  push:
    branches:
      - implementation/auth-tenant-permissions
    paths:
      - '.github/workflows/bootstrap-better-auth.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/auth-tenant-permissions
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply NuBlox migrations including authentication boundary
        working-directory: app
        env:
          DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_auth_bootstrap
        run: pnpm db:migrate

      - name: Regenerate Kysely types
        working-directory: app
        env:
          DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_auth_bootstrap
        run: pnpm db:types

      - name: Commit generated types
        run: |
          git config user.name 'NuBlox Auth Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/lib/server/db/generated/database.d.ts
          git commit -m 'Regenerate database types for authentication boundary'
          git fetch origin implementation/auth-tenant-permissions
          git rebase origin/implementation/auth-tenant-permissions
          git push origin HEAD:implementation/auth-tenant-permissions
