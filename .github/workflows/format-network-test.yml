name: Format Network integration test

on:
  push:
    branches:
      - feature/external-access-kernel

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-access-kernel
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format integration test
        working-directory: app
        run: pnpm exec prettier --write src/lib/server/projects/project-external-collaboration.integration.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/projects/project-external-collaboration.integration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Network collaboration integration test"
          git push origin HEAD:feature/external-access-kernel
