name: F04 Nullability Fix

on:
  push:
    branches:
      - feat/f04-corporate-development-ma
    paths:
      - .github/workflows/f04-nullability-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f04-corporate-development-ma
      - name: Apply targeted TypeScript fix and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/lib/server/corporate-development/corporate-development-service.ts')
          s = p.read_text()
          old = "\t\tlet selectedOpportunity = opportunities[0] ?? null;"
          new = "\t\tlet selectedOpportunity: CorporateDevelopmentOpportunityRecord | null =\n\t\t\topportunities[0] ?? null;"
          if old not in s:
              raise SystemExit('target declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/f04-nullability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/corporate-development/corporate-development-service.ts
          git commit -m "fix: type F04 selected opportunity explicitly"
          git push origin HEAD:feat/f04-corporate-development-ma
