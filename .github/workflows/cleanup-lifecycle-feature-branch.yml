name: Clean merged lifecycle feature branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-lifecycle-feature-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove merged feature branch and cleanup workflow
        run: |
          git push origin --delete feat/platform-lifecycle-administration
          rm .github/workflows/cleanup-lifecycle-feature-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove lifecycle merge cleanup'
          git push origin HEAD:main
