name: Temporary F01 workflow closeout

on:
  push:
    branches:
      - feat/platform-workflow-lifecycle-engine

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-workflow-lifecycle-engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Close workflow bypasses and extend golden thread
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('appv2/src/lib/server/strategy/f01-golden-thread.integration.test.ts')
          text = test.read_text()
          import_anchor = "import { getPool } from '$lib/server/db/pool';\n"
          workflow_import = "import { listPendingWorkflowTasks } from '$lib/server/platform/workflow-request-service';\n"
          if workflow_import not in text:
              if import_anchor not in text:
                  raise SystemExit('missing golden-thread import anchor')
              text = text.replace(import_anchor, import_anchor + workflow_import, 1)
          relationship_anchor = "import { getF01RelationshipEditor, updateF01Relationships } from './f01-relationship-service';\n"
          f01_workflow_import = "import { decideF01WorkflowRequest, submitF01WorkflowTransition } from './f01-workflow-service';\n"
          if f01_workflow_import not in text:
              if relationship_anchor not in text:
                  raise SystemExit('missing relationship import anchor')
              text = text.replace(relationship_anchor, relationship_anchor + f01_workflow_import, 1)

          old = """\t\tawait transitionF01Record({\n\t\t\tactor,\n\t\t\tframeworkPublicId: frameworkId,\n\t\t\tkind: 'framework',\n\t\t\trecordPublicId: frameworkId,\n\t\t\ttargetStatus: 'approved'\n\t\t});\n\t\tlet workspace = await getStrategyWorkspace({ organisationId, memberId: actor.memberId });\n"""
          new = """\t\tconst returnedWorkflow = await submitF01WorkflowTransition({\n\t\t\tactor,\n\t\t\tframeworkPublicId: frameworkId,\n\t\t\tkind: 'framework',\n\t\t\trecordPublicId: frameworkId,\n\t\t\ttargetStatus: 'approved'\n\t\t});\n\t\texpect(returnedWorkflow).not.toBeNull();\n\t\tlet pendingTasks = await listPendingWorkflowTasks({\n\t\t\torganisationId,\n\t\t\tmemberId: actor.memberId\n\t\t});\n\t\texpect(pendingTasks.find((task) => task.requestPublicId === returnedWorkflow!.requestPublicId)).toMatchObject({\n\t\t\trequiredPermissionKey: 'strategy.approve',\n\t\t\tfromState: 'draft',\n\t\t\ttoState: 'approved'\n\t\t});\n\t\tmanaged = await getF01ManagedRecord({\n\t\t\torganisationId,\n\t\t\tmemberId: actor.memberId,\n\t\t\tframeworkPublicId: frameworkId,\n\t\t\tkind: 'framework',\n\t\t\trecordPublicId: frameworkId\n\t\t});\n\t\texpect(managed.status).toBe('draft');\n\n\t\tawait decideF01WorkflowRequest({\n\t\t\tactor,\n\t\t\trequestPublicId: returnedWorkflow!.requestPublicId,\n\t\t\tdecision: 'returned',\n\t\t\tnote: 'Return for one final governance check.'\n\t\t});\n\t\tpendingTasks = await listPendingWorkflowTasks({ organisationId, memberId: actor.memberId });\n\t\texpect(pendingTasks.some((task) => task.requestPublicId === returnedWorkflow!.requestPublicId)).toBe(false);\n\t\tmanaged = await getF01ManagedRecord({\n\t\t\torganisationId,\n\t\t\tmemberId: actor.memberId,\n\t\t\tframeworkPublicId: frameworkId,\n\t\t\tkind: 'framework',\n\t\t\trecordPublicId: frameworkId\n\t\t});\n\t\texpect(managed.status).toBe('draft');\n\n\t\tconst rejectedWorkflow = await submitF01WorkflowTransition({\n\t\t\tactor,\n\t\t\tframeworkPublicId: frameworkId,\n\t\t\tkind: 'framework',\n\t\t\trecordPublicId: frameworkId,\n\t\t\ttargetStatus: 'approved'\n\t\t});\n\t\texpect(rejectedWorkflow).not.toBeNull();\n\t\tawait decideF01WorkflowRequest({\n\t\t\tactor,\n\t\t\trequestPublicId: rejectedWorkflow!.requestPublicId,\n\t\t\tdecision: 'rejected',\n\t\t\tnote: 'Reject this submission without changing the governed source state.'\n\t\t});\n\t\tmanaged = await getF01ManagedRecord({\n\t\t\torganisationId,\n\t\t\tmemberId: actor.memberId,\n\t\t\tframeworkPublicId: frameworkId,\n\t\t\tkind: 'framework',\n\t\t\trecordPublicId: frameworkId\n\t\t});\n\t\texpect(managed.status).toBe('draft');\n\n\t\tconst approvedWorkflow = await submitF01WorkflowTransition({\n\t\t\tactor,\n\t\t\tframeworkPublicId: frameworkId,\n\t\t\tkind: 'framework',\n\t\t\trecordPublicId: frameworkId,\n\t\t\ttargetStatus: 'approved'\n\t\t});\n\t\texpect(approvedWorkflow).not.toBeNull();\n\t\tawait decideF01WorkflowRequest({\n\t\t\tactor,\n\t\t\trequestPublicId: approvedWorkflow!.requestPublicId,\n\t\t\tdecision: 'approved',\n\t\t\tnote: 'Approve after governed workflow review.'\n\t\t});\n\t\tlet workspace = await getStrategyWorkspace({ organisationId, memberId: actor.memberId });\n"""
          if old not in text:
              raise SystemExit('missing direct framework approval block')
          text = text.replace(old, new, 1)
          test.write_text(text)

          replacements = {
              'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/+page.svelte': {
                  'Approval authority available': 'Submission authority available',
                  'Your effective permissions include strategy approval authority.': 'Your effective permissions include authority to submit this strategy into governed approval workflow.',
                  'Your effective permissions do not include strategy approval. An authorised approver must complete the governed transition.': 'Your effective permissions do not include authority to submit this strategy. An authorised strategy manager must submit it; an authorised approver decides the resulting work item.',
                  'Approve the strategic direction': 'Submit the strategic direction for approval',
                  'All approval prerequisites are satisfied. NuBlox will re-check them inside the approval transaction before committing the strategy.': 'All submission prerequisites are satisfied. NuBlox will re-check them before creating the governed approval work item; the strategy remains draft until an authorised approver accepts it.',
                  'Complete every approval prerequisite above before committing this strategy as the current enterprise direction.': 'Complete every prerequisite above before submitting this strategy into governed approval workflow.',
                  'Approve strategy for business planning': 'Submit strategy for approval',
                  '>Approve business plan</Button>': '>Submit business plan for approval</Button>'
              },
              'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/+page.svelte': {
                  '>Approve KPI</Button>': '>Submit KPI for approval</Button>',
                  'Approve this definition before actual performance can be recorded against it.': 'Submit this definition for approval before actual performance can be recorded against it.'
              },
              'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/+page.svelte': {
                  '>Approve review</Button>': '>Submit review for approval</Button>'
              }
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              value = path.read_text()
              for old_text, new_text in pairs.items():
                  if old_text not in value:
                      raise SystemExit(f'missing UI text in {filename}: {old_text}')
                  value = value.replace(old_text, new_text)
              path.write_text(value)
          PY
      - name: Format changed application files
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/server/strategy/f01-golden-thread.integration.test.ts src/lib/server/strategy/f01-workflow-service.ts src/routes/[tenant]/app/'(protected)'/functions/f01/strategies/[strategy]/business-planning/+page.server.ts src/routes/[tenant]/app/'(protected)'/functions/f01/strategies/[strategy]/business-planning/+page.svelte src/routes/[tenant]/app/'(protected)'/functions/f01/strategies/[strategy]/performance/+page.server.ts src/routes/[tenant]/app/'(protected)'/functions/f01/strategies/[strategy]/performance/+page.svelte src/routes/[tenant]/app/'(protected)'/functions/f01/strategies/[strategy]/review/+page.server.ts src/routes/[tenant]/app/'(protected)'/functions/f01/strategies/[strategy]/review/+page.svelte
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-f01-workflow-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2 .github/workflows/temporary-f01-workflow-closeout.yml
          git commit -m "fix(v2): close F01 approval workflow bypasses"
          git push origin HEAD:feat/platform-workflow-lifecycle-engine
