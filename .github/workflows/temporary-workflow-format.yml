name: Temporary workflow tranche format

on:
  push:
    branches:
      - feat/platform-workflow-lifecycle-engine

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-workflow-lifecycle-engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Format workflow tranche
        working-directory: appv2
        run: pnpm exec prettier --write "src/lib/server/platform/workflow-kernel.test.ts" "src/lib/server/platform/workflow-kernel.ts" "src/lib/server/platform/workflow-request-service.ts" "src/lib/server/strategy/f01-workflow-service.ts" "src/lib/server/strategy/f01-workflows.ts" "src/routes/[tenant]/app/(protected)/my-work/[request]/+page.server.ts" "src/routes/[tenant]/app/(protected)/my-work/[request]/+page.svelte"
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-workflow-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2 .github/workflows/temporary-workflow-format.yml
          git commit -m "chore(v2): format governed workflow tranche"
          git push origin HEAD:feat/platform-workflow-lifecycle-engine
