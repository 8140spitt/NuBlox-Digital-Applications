name: F03 Evidence Patch

on:
  push:
    branches:
      - feat/f03-enterprise-performance-management
    paths:
      - '.github/workflows/f03-evidence-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f03-enterprise-performance-management
      - name: Align F03 capability evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/architecture/function-capability-map/map-f01-f08.md')
          s = p.read_text()
          old = '**Current reality:** Native foundations exist; material depth remains in D8, D5. Domain maturity is not proof that every sub-function is complete.'
          new = '**Current reality:** PR #137 implements F03.01–F03.06 as one native enterprise-performance thread: versioned performance frameworks composed from approved F01 KPIs, period-bound authoritative KPI reporting packs, variance/root-cause/corrective-action controls, executive reviews with optional F02 governance linkage, comparable-period benchmarking, and evidence-based benefits realisation. F03 remains a merge candidate until exact-head and merged-`main` validation pass and issue #136 closes.'
          if old not in s: raise SystemExit('F03 map status not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/src/lib/navigation/capability-registry.ts')
          s = p.read_text()
          old = "'Project budgets/cost control, versioned EAC forecasts, forecast cash flow and financial reporting foundations are native. F01 strategy, business planning, target operating model, KPI/review/scenario and canonical Finance-actual drill-through are native; treasury, broader management accounting and consolidation depth remain.'"
          new = "'Project budgets/cost control, versioned EAC forecasts, forecast cash flow and financial reporting foundations are native. F01 strategy/planning and F03 enterprise performance frameworks, period-bound KPI reporting, governed variance/action, executive review, benchmarking and benefits realisation are native; treasury, broader management accounting and consolidation depth remain.'"
          if old not in s: raise SystemExit('D8 maturity note not found')
          s = s.replace(old, new, 1)
          old = """\t\t\t{\n\t\t\t\tlabel: 'Strategy performance & foresight',\n\t\t\t\thref: '/strategy/performance',\n\t\t\t\tanyPermissionNamespaces: ['strategy.']\n\t\t\t},"""
          new = old + """\n\t\t\t{\n\t\t\t\tlabel: 'Enterprise performance management',\n\t\t\t\thref: '/performance',\n\t\t\t\tanyPermissionNamespaces: ['strategy.']\n\t\t\t},"""
          if old not in s: raise SystemExit('D8 strategy route not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/sap-capability-coverage-register.csv')
          s = p.read_text()
          old = '49,Strategic Enterprise Management (SEM),functional,E24/E08/E07 Enterprise performance,partial,21,P1-finance,VS8|VS3|VS1|VS2,A,sequential-priority,"Native strategy objectives, KPI performance, variance/action, strategic review, scenarios and canonical Finance drill-through now exist; broader enterprise performance depth remains"'
          new = '49,Strategic Enterprise Management (SEM),functional,E24/E08/E07 Enterprise performance,partial,21,P1-finance,VS8|VS3|VS1|VS2,A,sequential-priority,"F01 strategy/KPI/scenario foundations plus F03 governed performance frameworks, period-bound KPI reporting packs, variance/root-cause/corrective action, executive reviews, comparable benchmarking and benefits realisation now exist with canonical fact drill-through; broader analytics and remaining enterprise-finance depth continue"'
          if old not in s: raise SystemExit('SAP SEM row not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/world-class/11-sap-benchmark-coverage.md')
          s = p.read_text()
          marker = 'F01 Strategy & Enterprise Planning now provides governed strategy-linked business planning, KPI targets and forecasts, strategic review and scenario/foresight foundations. Its closure proof resolves a canonical accounting P&L actual into the strategy KPI and drills back to the accounting report/source thread. This materially advances the BPC, SEM and SEM-IP benchmark outcomes without claiming that consolidation, treasury or the remaining P1 enterprise-finance gaps are complete.'
          addition = marker + '\n\nF03 Enterprise Performance Management now extends that canonical KPI thread into governed enterprise execution: versioned performance frameworks, reporting periods and KPI packs, root-cause variance intervention, executive review, comparable-period benchmarks, and measured benefits. F03 snapshots canonical KPI observations for evidence rather than creating a second performance ledger, and preserves cross-domain project/governance references for drill-through. This materially deepens the SEM benchmark while leaving broader analytics, consolidation and treasury gaps explicitly open.'
          if marker not in s: raise SystemExit('SAP benchmark F01 paragraph not found')
          p.write_text(s.replace(marker, addition, 1))
          PY
          rm .github/workflows/f03-evidence-patch.yml
      - name: Commit evidence alignment
        run: |
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add app/src/lib/navigation/capability-registry.ts docs/architecture/function-capability-map/map-f01-f08.md docs/sap-capability-coverage-register.csv docs/world-class/11-sap-benchmark-coverage.md .github/workflows/f03-evidence-patch.yml
          git commit -m 'F03: align capability and SAP benchmark evidence'
          git push origin HEAD:feat/f03-enterprise-performance-management
