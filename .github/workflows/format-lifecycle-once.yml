name: Format lifecycle kernel once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-lifecycle-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile

      - name: Format lifecycle files
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/server/platform/lifecycle-kernel.ts src/lib/server/strategy/f01-lifecycle.ts

      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/format-lifecycle-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(v2): format lifecycle kernel'
          git push origin HEAD:main
