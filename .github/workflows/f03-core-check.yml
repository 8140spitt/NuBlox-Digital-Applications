name: F03 Core Check

on:
  push:
    branches:
      - feat/f03-enterprise-performance-management

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      BETTER_AUTH_SECRET: f03-core-${{ github.run_id }}-${{ github.run_attempt }}-test-key
      BETTER_AUTH_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - working-directory: app
        run: pnpm install --frozen-lockfile
      - working-directory: app
        run: pnpm db:migrate
      - working-directory: app
        run: pnpm db:types && git diff --exit-code -- src/lib/server/db/generated/database.d.ts src/lib/server/db/generated/strategy.d.ts
      - working-directory: app
        run: pnpm check
      - working-directory: app
        run: pnpm lint
