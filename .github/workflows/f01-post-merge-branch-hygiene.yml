name: F01 Post-Merge Branch Hygiene

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/f01-post-merge-branch-hygiene.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged F01 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/f01-digital-thread-closure"
