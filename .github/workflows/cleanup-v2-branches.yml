name: One-shot V2 branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-v2-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete obsolete remote branches
        run: |
          git push origin --delete \
            refactor/tenant-first-routing \
            v2/reset-foundation \
            v2/experience-foundation \
            v2/identity-tenant-context

      - name: Remove this one-shot workflow
        run: |
          git config user.name "NuBlox repository cleanup"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/cleanup-v2-branches.yml
          git commit -m "chore: remove completed V2 branch cleanup workflow"
          git push origin HEAD:main
