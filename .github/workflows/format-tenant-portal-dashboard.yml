name: Format tenant portal dashboard

on:
  push:
    branches:
      - refactor/tenant-first-routing
    paths:
      - '.github/workflows/format-tenant-portal-dashboard.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tenant-first-routing
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format portal dashboard
        working-directory: app
        run: pnpm exec prettier --write src/routes/portal/+page.svelte
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/routes/portal/+page.svelte
          if git diff --cached --quiet; then
            echo "Portal dashboard already formatted."
            exit 0
          fi
          git commit -m "style: format tenant portal dashboard"
          git push origin HEAD:refactor/tenant-first-routing
