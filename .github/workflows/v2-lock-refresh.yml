name: V2 Lockfile Artifact

on:
  push:
    branches:
      - v2/identity-tenant-context
    paths:
      - 'appv2/package.json'
      - '.github/workflows/v2-lock-refresh.yml'

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        working-directory: appv2
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: appv2-pnpm-lock
          path: appv2/pnpm-lock.yaml
          if-no-files-found: error
