\t.pending-invitation span, .pending-invitation small { color: #666; }
\t.warning-hint { color: #8a5a00; }
""" + style_marker, 1)
          project_page.write_text(pp)

          # CRM record: connection state, not a manual ID collection form.
          crm_page = Path('app/src/routes/(app)/crm/[partyPublicId]/+page.svelte')
          crm = crm_page.read_text()
          pattern = re.compile(r"\t\t\t\{:else if data\.canManage\}\n\t\t\t\t<form method=\"POST\" action=\"\?/linkPlatformOrganisation\" class=\"platform-link-form\">.*?\t\t\t\t</form>\n\t\t\t\{/if\}", re.S)
          if len(pattern.findall(crm)) != 1:
              raise SystemExit(f'CRM manual link block matches: {len(pattern.findall(crm))}')
          crm = pattern.sub("""\t\t\t{:else}
\t\t\t\t<div class="connection-empty">
\t\t\t\t\t<strong>Not connected yet</strong>
\t\t\t\t\t<p>
\t\t\t\t\t\tInvite this customer to a project. NuBlox will send a secure invitation to one of
\t\t\t\t\t\ttheir CRM contacts and connect the organisation during onboarding. No organisation ID
\t\t\t\t\t\tneeds to be exchanged.
\t\t\t\t\t</p>
\t\t\t\t\t{#if data.canManage}<a href="/projects">Open projects</a>{/if}
\t\t\t\t</div>
\t\t\t{/if}""", crm, count=1)
          crm = re.sub(r"\n\t\.platform-link-form \{.*?\n\t\.platform-link-form input \{.*?\n\t\}", "", crm, count=1, flags=re.S)
          panel_marker = "\n\t.panel-heading {"
          crm = crm.replace(panel_marker, """
\t.connection-empty { padding: 0.9rem; border: 1px dashed #c9c9c1; border-radius: 0.55rem; background: #fafaf7; }
\t.connection-empty p { margin: 0.35rem 0 0.6rem; color: #666; line-height: 1.5; }
""" + panel_marker, 1)
          crm_page.write_text(crm)

          # Organisation selector preserves collaboration continuation.
          select_server = Path('app/src/routes/(auth)/select-organisation/+page.server.ts')
          ss = select_server.read_text()
          ss = ss.replace(
              "import { OrganisationMembershipRepository } from '$lib/server/organisations/membership-repository';\n",
              "import { OrganisationMembershipRepository } from '$lib/server/organisations/membership-repository';\n\nfunction safeReturnTo(value: string | null): string | null {\n\tif (!value || !value.startsWith('/') || value.startsWith('//')) return null;\n\treturn value;\n}\n"
          )
          ss = ss.replace(
              "export const load: PageServerLoad = async ({ locals }) => {",
              "export const load: PageServerLoad = async ({ locals, url }) => {"
          )
          ss = ss.replace(
              "\t\tcurrentOrganisationPublicId: locals.tenant.organisationPublicId,\n\t\tmemberships\n",
              "\t\tcurrentOrganisationPublicId: locals.tenant.organisationPublicId,\n\t\treturnTo: safeReturnTo(url.searchParams.get('returnTo')),\n\t\tmemberships\n"
          )
          select_server.write_text(ss)

          select_page = Path('app/src/routes/(auth)/select-organisation/+page.svelte')
          sp = select_page.read_text().replace(
              "\t\tawait goto('/dashboard', { invalidateAll: true });",
              "\t\tawait goto(data.returnTo ?? '/dashboard', { invalidateAll: true });"
          )
          select_page.write_text(sp)

          # Fix route helper typing to use the public SvelteKit Cookies type.
          collaborate_server = Path('app/src/routes/collaborate/[token]/+page.server.ts')
          cs = collaborate_server.read_text()
          cs = cs.replace(
              "import { error, fail, redirect } from '@sveltejs/kit';",
              "import { error, fail, redirect, type Cookies } from '@sveltejs/kit';"
          )
          cs = cs.replace(
              "function setOrganisationCookie(cookies: Parameters<Actions[string]>[0]['cookies'], publicId: string) {",
              "function setOrganisationCookie(cookies: Cookies, publicId: string) {"
          )
          cs = cs.replace(
              "function clearSignupCookies(cookies: Parameters<Actions[string]>[0]['cookies']) {",
              "function clearSignupCookies(cookies: Cookies) {"
          )
          collaborate_server.write_text(cs)
          PY

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply migrations and regenerate DB types
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:types

      - name: Format changed implementation
        working-directory: app
        run: >-
          pnpm exec prettier --write
          src/lib/server/auth/better-auth.ts
          src/lib/server/auth/project-collaboration-cookie.ts
          src/lib/server/projects/project-collaboration-invitation-service.ts
          src/lib/server/db/generated/database.d.ts
          'src/routes/(app)/projects/[projectPublicId]/+page.server.ts'
          'src/routes/(app)/projects/[projectPublicId]/+page.svelte'
          'src/routes/(app)/crm/[partyPublicId]/+page.svelte'
          'src/routes/(auth)/select-organisation/+page.server.ts'
          'src/routes/(auth)/select-organisation/+page.svelte'
          'src/routes/collaborate/[token]/+page.server.ts'
          'src/routes/collaborate/[token]/+page.svelte'
          src/routes/api/project-collaboration/bootstrap-intents/+server.ts

      - name: Type-check implementation
        working-directory: app
        run: pnpm check

      - name: Commit generated and wired implementation
        shell: bash
        run: |
          rm -f .github/workflows/project-collaboration-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire invite-first project collaboration onboarding"
          git push origin HEAD:product/v1-project-collaboration-onboarding
