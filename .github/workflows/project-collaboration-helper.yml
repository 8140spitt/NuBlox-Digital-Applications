name: Project collaboration development helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.head_ref == 'product/v1-project-collaboration-onboarding'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_collaboration_helper
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-project-collaboration-onboarding

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Wire collaboration flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:100]!r}; found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # Tighten the collaboration domain service and expose contact-aware invite options.
          service_path = Path('app/src/lib/server/projects/project-collaboration-invitation-service.ts')
          service = service_path.read_text()
          service = service.replace(
              "import { ProjectTeamService, ProjectTeamValidationError } from './project-team-service';",
              "import { ProjectTeamService } from './project-team-service';"
          )
          marker = "export type PendingProjectCollaborationInvitation = {\n\tpublicId: string;\n\tcrmOrganisationName: string;\n\tcontactName: string;\n\temail: string;\n\texpiresAt: Date;\n\tcreatedAt: Date;\n};\n"
          if marker not in service:
              raise SystemExit('Pending invitation type marker not found.')
          service = service.replace(marker, marker + "\nexport type ProjectCollaborationInviteOption = {\n\tpartyPublicId: string;\n\tdisplayName: string;\n\tlinkedOrganisationId: string | null;\n\tlinkedOrganisationPublicId: string | null;\n\tlinkedOrganisationName: string | null;\n\tlinkedOrganisationStatus: string | null;\n\tcontacts: Array<{\n\t\tpartyPublicId: string;\n\t\tdisplayName: string;\n\t\temail: string;\n\t\tisPrimaryContact: boolean;\n\t}>;\n};\n")
          method_marker = "\n\tasync inviteFromCrm(\n"
          if method_marker not in service:
              raise SystemExit('inviteFromCrm marker not found.')
          invite_options = """
\n\tasync listInviteOptions(
\t\tactor: TenantActorContext,
\t\tprojectPublicId: string
\t): Promise<ProjectCollaborationInviteOption[]> {
\t\tconst team = await new ProjectTeamService(this.db).getTeamView(actor, projectPublicId);
\t\tif (!team.canManageParticipants) return [];
\t\tconst crm = new CrmRepository(this.db);
\t\treturn Promise.all(
\t\t\tteam.invitationCandidates.map(async (candidate) => {
\t\t\t\tconst contacts = candidate.linkedOrganisationId
\t\t\t\t\t? []
\t\t\t\t\t: await crm.listOrganisationContacts(actor.organisationId, candidate.partyId);
\t\t\t\treturn {
\t\t\t\t\tpartyPublicId: candidate.partyPublicId,
\t\t\t\t\tdisplayName: candidate.displayName,
\t\t\t\t\tlinkedOrganisationId: candidate.linkedOrganisationId,
\t\t\t\t\tlinkedOrganisationPublicId: candidate.linkedOrganisationPublicId,
\t\t\t\t\tlinkedOrganisationName: candidate.linkedOrganisationName,
\t\t\t\t\tlinkedOrganisationStatus: candidate.linkedOrganisationStatus,
\t\t\t\t\tcontacts: contacts
\t\t\t\t\t\t.filter((contact) => contact.status === 'active' && Boolean(contact.primaryEmail))
\t\t\t\t\t\t.map((contact) => ({
\t\t\t\t\t\t\tpartyPublicId: contact.personPublicId,
\t\t\t\t\t\t\tdisplayName: contact.displayName,
\t\t\t\t\t\t\temail: contact.primaryEmail!,
\t\t\t\t\t\t\tisPrimaryContact: contact.isPrimaryContact
\t\t\t\t\t\t}))
\t\t\t\t};
\t\t\t})
\t\t);
\t}
"""
          service = service.replace(method_marker, invite_options + method_marker, 1)
          service = service.replace("\t\tcorrelationId: string;\n\t}): Promise<string | null> {", "\t\tcorrelationId?: string;\n\t}): Promise<string | null> {", 1)
          service = service.replace("\t\t\t\tcorrelationId: input.correlationId\n", "\t\t\t\tcorrelationId: input.correlationId ?? randomUUID()\n", 1)

          old_contact_join = """\t\t\t.innerJoin('party_persons as person', (join) =>
\t\t\t\tjoin
\t\t\t\t\t.onRef('person.party_id', '=', 'invitation.crm_contact_party_id')
\t\t\t\t\t.onRef('person.organisation_id', '=', 'invitation.inviting_organisation_id')
\t\t\t)
"""
          new_contact_join = """\t\t\t.innerJoin('parties as contact_party', (join) =>
\t\t\t\tjoin
\t\t\t\t\t.onRef('contact_party.id', '=', 'invitation.crm_contact_party_id')
\t\t\t\t\t.onRef('contact_party.organisation_id', '=', 'invitation.inviting_organisation_id')
\t\t\t)
\t\t\t.innerJoin('party_persons as person', (join) =>
\t\t\t\tjoin
\t\t\t\t\t.onRef('person.party_id', '=', 'contact_party.id')
\t\t\t\t\t.onRef('person.organisation_id', '=', 'contact_party.organisation_id')
\t\t\t)
"""
          if service.count(old_contact_join) != 1:
              raise SystemExit(f'Expected one pending-invitation contact join, found {service.count(old_contact_join)}')
          service = service.replace(old_contact_join, new_contact_join, 1)
          select_marker = "\t\t\t\t'company.linked_organisation_id as linkedOrganisationId',\n\t\t\t\t'person.preferred_name as preferredName',"
          if select_marker not in service:
              raise SystemExit('Pending invitation select marker not found.')
          service = service.replace(
              select_marker,
              "\t\t\t\t'company.linked_organisation_id as linkedOrganisationId',\n\t\t\t\t'contact_party.public_id as contactPartyPublicId',\n\t\t\t\t'person.preferred_name as preferredName',",
              1
          )
          service = service.replace("\t\t\tcontactPartyPublicId: '',\n", "\t\t\tcontactPartyPublicId: row.contactPartyPublicId,\n", 1)
          finalise_select = "\t\t\t\t\t'company_party.public_id as crmOrganisationPartyPublicId',\n\t\t\t\t\t'company.linked_organisation_id as linkedOrganisationId'"
          if finalise_select not in service:
              raise SystemExit('Finalise CRM select marker not found.')
          service = service.replace(
              finalise_select,
              "\t\t\t\t\t'company_party.id as crmOrganisationPartyId',\n\t\t\t\t\t'company_party.public_id as crmOrganisationPartyPublicId',\n\t\t\t\t\t'company.linked_organisation_id as linkedOrganisationId'",
              1
          )
          service = re.sub(
              r"\t\t\tconst conflictingLink = await trx\n\t\t\t\t\.selectFrom\('party_organisations'\).*?\t\t\t\t\.executeTakeFirst\(\);",
              """\t\t\tconst conflictingLink = await trx
\t\t\t\t.selectFrom('party_organisations')
\t\t\t\t.select('party_id')
\t\t\t\t.where('organisation_id', '=', invitation.invitingOrganisationId)
\t\t\t\t.where('linked_organisation_id', '=', actor.organisationId)
\t\t\t\t.where('party_id', '!=', invitation.crmOrganisationPartyId)
\t\t\t\t.executeTakeFirst();""",
              service,
              count=1,
              flags=re.S
          )
          service = re.sub(
              r"\t\t\tawait trx\n\t\t\t\t\.updateTable\('party_organisations'\)\n\t\t\t\t\.set\(\{ linked_organisation_id: actor\.organisationId \}\)\n\t\t\t\t\.where\('organisation_id', '=', invitation\.invitingOrganisationId\)\n\t\t\t\t\.where\('party_id', '=', trx\n.*?\t\t\t\t\.executeTakeFirstOrThrow\(\);",
              """\t\t\tawait trx
\t\t\t\t.updateTable('party_organisations')
\t\t\t\t.set({ linked_organisation_id: actor.organisationId })
\t\t\t\t.where('organisation_id', '=', invitation.invitingOrganisationId)
\t\t\t\t.where('party_id', '=', invitation.crmOrganisationPartyId)
\t\t\t\t.executeTakeFirstOrThrow();""",
              service,
              count=1,
              flags=re.S
          )
          service_path.write_text(service)

          # Better Auth: collaboration is continuation state alongside the existing signed bootstrap.
          auth_path = Path('app/src/lib/server/auth/better-auth.ts')
          auth = auth_path.read_text()
          auth = auth.replace(
              "import { INVITATION_SIGNUP_COOKIE } from './invitation-cookie';",
              "import { INVITATION_SIGNUP_COOKIE } from './invitation-cookie';\nimport { PROJECT_COLLABORATION_SIGNUP_COOKIE } from './project-collaboration-cookie';"
          )
          auth = auth.replace(
              "import { ensurePortalCollaborationStandardRoleDefaults } from '$lib/server/portal/portal-collaboration-bootstrap';",
              "import { ProjectCollaborationInvitationService } from '$lib/server/projects/project-collaboration-invitation-service';\nimport { ensurePortalCollaborationStandardRoleDefaults } from '$lib/server/portal/portal-collaboration-bootstrap';"
          )
          auth = auth.replace(
              "function bootstrapService(): OrganisationBootstrapService {\n\treturn new OrganisationBootstrapService(getDatabase());\n}\n",
              "function bootstrapService(): OrganisationBootstrapService {\n\treturn new OrganisationBootstrapService(getDatabase());\n}\n\nfunction collaborationService(): ProjectCollaborationInvitationService {\n\treturn new ProjectCollaborationInvitationService(getDatabase());\n}\n"
          )
          defaults_end = """\t\t\t\t\t\t\tensurePortalCollaborationStandardRoleDefaults(db, created.organisationId)
\t\t\t\t\t\t]);
"""
          if auth.count(defaults_end) != 1:
              raise SystemExit(f'Bootstrap defaults marker count {auth.count(defaults_end)}')
          auth = auth.replace(
              defaults_end,
              defaults_end + """\t\t\t\t\t\tconst collaborationToken =
\t\t\t\t\t\t\tctx.getCookie(PROJECT_COLLABORATION_SIGNUP_COOKIE)?.trim() ?? '';
\t\t\t\t\t\tif (collaborationToken) {
\t\t\t\t\t\t\tawait collaborationService().bindSignupAuthUser(
\t\t\t\t\t\t\t\tcollaborationToken,
\t\t\t\t\t\t\t\tuser.email,
\t\t\t\t\t\t\t\tuser.id
\t\t\t\t\t\t\t);
\t\t\t\t\t\t}
""",
              1
          )
          old_activation = """\t\t\tawait bootstrapService().activateVerifiedAuthUser({
\t\t\t\tauthUserId: user.id,
\t\t\t\temail: user.email,
\t\t\t\tdisplayName: user.name,
\t\t\t\tcorrelationId
\t\t\t});
"""
          if auth.count(old_activation) != 1:
              raise SystemExit('Bootstrap verification activation marker not found.')
          auth = auth.replace(
              old_activation,
              """\t\t\tconst bootstrapped = await bootstrapService().activateVerifiedAuthUser({
\t\t\t\tauthUserId: user.id,
\t\t\t\temail: user.email,
\t\t\t\tdisplayName: user.name,
\t\t\t\tcorrelationId
\t\t\t});
\t\t\tif (bootstrapped) {
\t\t\t\tawait collaborationService().activateVerifiedBootstrap({
\t\t\t\t\tauthUserId: user.id,
\t\t\t\t\temail: user.email,
\t\t\t\t\torganisationId: bootstrapped.organisationId,
\t\t\t\t\torganisationPublicId: bootstrapped.organisationPublicId,
\t\t\t\t\tmemberId: bootstrapped.memberId,
\t\t\t\t\tuserId: bootstrapped.userId,
\t\t\t\t\tcorrelationId
\t\t\t\t});
\t\t\t}
""",
              1
          )
          auth_path.write_text(auth)

          # Project page server: use collaboration service for both linked and unlinked customers.
          project_server = Path('app/src/routes/(app)/projects/[projectPublicId]/+page.server.ts')
          ps = project_server.read_text()
          ps = ps.replace(
              "import type { ProjectLifecycleStatus } from '$lib/server/projects/project-repository';",
              "import {\n\tProjectCollaborationInvitationAccessError,\n\tProjectCollaborationInvitationService,\n\tProjectCollaborationInvitationValidationError\n} from '$lib/server/projects/project-collaboration-invitation-service';\nimport type { ProjectLifecycleStatus } from '$lib/server/projects/project-repository';"
          )
          ps = ps.replace(
              "\tif (error instanceof ProjectTeamValidationError) {\n\t\treturn fail(400, actionFailure({ teamError: error.message, teamAction }));\n\t}",
              "\tif (\n\t\terror instanceof ProjectTeamValidationError ||\n\t\terror instanceof ProjectCollaborationInvitationValidationError ||\n\t\terror instanceof ProjectCollaborationInvitationAccessError\n\t) {\n\t\treturn fail(400, actionFailure({ teamError: error.message, teamAction }));\n\t}"
          )
          old_load = """\t\tconst team = await new ProjectTeamService(db).getTeamView(actor, params.projectPublicId);
\t\treturn { ...workspace, team };
"""
          if ps.count(old_load) != 1:
              raise SystemExit('Project page load marker not found.')
          ps = ps.replace(
              old_load,
              """\t\tconst team = await new ProjectTeamService(db).getTeamView(actor, params.projectPublicId);
\t\tconst collaboration = new ProjectCollaborationInvitationService(db);
\t\tconst [collaborationInviteOptions, pendingCollaborationInvitations] = await Promise.all([
\t\t\tcollaboration.listInviteOptions(actor, params.projectPublicId),
\t\t\tcollaboration.listPendingForProject(actor, params.projectPublicId)
\t\t]);
\t\treturn { ...workspace, team, collaborationInviteOptions, pendingCollaborationInvitations };
""",
              1
          )
          old_invite = """\t\ttry {
\t\t\tawait new ProjectTeamService(getDatabase()).inviteCrmParticipant(actor, {
\t\t\t\tprojectPublicId: params.projectPublicId,
\t\t\t\tcrmPartyPublicId: String(data.get('crmPartyPublicId') ?? ''),
\t\t\t\troleKeys: roleKeys(data)
\t\t\t});
\t\t} catch (cause) {
"""
          if ps.count(old_invite) != 1:
              raise SystemExit('Project invite action marker not found.')
          ps = ps.replace(
              old_invite,
              """\t\ttry {
\t\t\tawait new ProjectCollaborationInvitationService(getDatabase()).inviteFromCrm(actor, {
\t\t\t\tprojectPublicId: params.projectPublicId,
\t\t\t\tcrmPartyPublicId: String(data.get('crmPartyPublicId') ?? ''),
\t\t\t\tcontactPartyPublicId: String(data.get('contactPartyPublicId') ?? ''),
\t\t\t\troleKeys: roleKeys(data)
\t\t\t});
\t\t} catch (cause) {
""",
              1
          )
          action_marker = "\n\tupdateParticipantRoles: async ({ request, locals, params }) => {"
          if action_marker not in ps:
              raise SystemExit('Project updateParticipantRoles marker not found.')
          revoke_action = """
\n\trevokeCollaborationInvitation: async ({ request, locals, params }) => {
\t\tconst actor = actorFromLocals(locals);
\t\tif (!actor) {
\t\t\treturn fail(
\t\t\t\t401,
\t\t\t\tactionFailure({ teamError: 'Authentication is required.', teamAction: 'collaboration-invite' })
\t\t\t);
\t\t}
\t\tconst data = await request.formData();
\t\ttry {
\t\t\tawait new ProjectCollaborationInvitationService(getDatabase()).revoke(actor, {
\t\t\t\tprojectPublicId: params.projectPublicId,
\t\t\t\tinvitationPublicId: String(data.get('invitationPublicId') ?? '')
\t\t\t});
\t\t} catch (cause) {
\t\t\treturn teamFailure(cause, 'collaboration-invite');
\t\t}
\t\tthrow redirect(303, `/projects/${encodeURIComponent(params.projectPublicId)}`);
\t},
"""
          ps = ps.replace(action_marker, revoke_action + action_marker, 1)
          project_server.write_text(ps)

          # Project page UI: linked organisations invite directly; unlinked organisations use a CRM contact.
          project_page = Path('app/src/routes/(app)/projects/[projectPublicId]/+page.svelte')
          pp = project_page.read_text()
          script_marker = "\tlet { data, form } = $props();\n"
          pp = pp.replace(
              script_marker,
              script_marker + "\tlet inviteOrganisationPublicId = $state('');\n\tlet selectedInviteOrganisation = $derived(\n\t\tdata.collaborationInviteOptions.find(\n\t\t\t(option) => option.partyPublicId === inviteOrganisationPublicId\n\t\t) ?? null\n\t);\n",
              1
          )
          start = pp.index("\t\t{#if data.team.canManageParticipants}\n\t\t\t<form method=\"POST\" action=\"?/inviteParticipant\" class=\"invite-form\">")
          end_token = "\n\t\t{/if}\n\t</section>"
          end = pp.index(end_token, start) + len("\n\t\t{/if}")
          replacement = """\t\t{#if data.team.canManageParticipants}
\t\t\t<form method="POST" action="?/inviteParticipant" class="invite-form">
\t\t\t\t<h3>Invite organisation</h3>
\t\t\t\t<p class="hint">
\t\t\t\t\tChoose the customer from CRM. Existing NuBlox organisations receive a normal project
\t\t\t\t\tinvitation; new customers receive an onboarding invitation through one of their contacts.
\t\t\t\t</p>
\t\t\t\t{#if data.collaborationInviteOptions.length === 0}
\t\t\t\t\t<p class="hint">
\t\t\t\t\t\tNo active CRM organisations are available.
\t\t\t\t\t\t<a href="/crm?kind=organisation&status=active">Open Customers</a> to maintain them.
\t\t\t\t\t</p>
\t\t\t\t{:else}
\t\t\t\t\t<label>
\t\t\t\t\t\t<span>Organisation</span>
\t\t\t\t\t\t<select name="crmPartyPublicId" bind:value={inviteOrganisationPublicId} required>
\t\t\t\t\t\t\t<option value="">Select CRM organisation</option>
\t\t\t\t\t\t\t{#each data.collaborationInviteOptions as option}
\t\t\t\t\t\t\t\t<option value={option.partyPublicId}>
\t\t\t\t\t\t\t\t\t{option.displayName} · {option.linkedOrganisationStatus === 'active'
\t\t\t\t\t\t\t\t\t\t? 'Connected to NuBlox'
\t\t\t\t\t\t\t\t\t\t: option.linkedOrganisationId
\t\t\t\t\t\t\t\t\t\t\t? 'NuBlox connection unavailable'
\t\t\t\t\t\t\t\t\t\t\t: 'Not connected yet'}
\t\t\t\t\t\t\t\t</option>
\t\t\t\t\t\t\t{/each}
\t\t\t\t\t\t</select>
\t\t\t\t\t</label>
\t\t\t\t\t{#if selectedInviteOrganisation && !selectedInviteOrganisation.linkedOrganisationId}
\t\t\t\t\t\t<label>
\t\t\t\t\t\t\t<span>Invite contact</span>
\t\t\t\t\t\t\t<select name="contactPartyPublicId" required>
\t\t\t\t\t\t\t\t<option value="">Select a customer contact</option>
\t\t\t\t\t\t\t\t{#each selectedInviteOrganisation.contacts as contact}
\t\t\t\t\t\t\t\t\t<option value={contact.partyPublicId}>
\t\t\t\t\t\t\t\t\t\t{contact.displayName} · {contact.email}{contact.isPrimaryContact ? ' · Primary' : ''}
\t\t\t\t\t\t\t\t\t</option>
\t\t\t\t\t\t\t\t{/each}
\t\t\t\t\t\t\t</select>
\t\t\t\t\t\t</label>
\t\t\t\t\t\t{#if selectedInviteOrganisation.contacts.length === 0}
\t\t\t\t\t\t\t<p class="hint warning-hint">
\t\t\t\t\t\t\t\tAdd an active CRM contact with a primary email before inviting this organisation.
\t\t\t\t\t\t\t</p>
\t\t\t\t\t\t{/if}
\t\t\t\t\t{/if}
\t\t\t\t\t<label>
\t\t\t\t\t\t<span>Project roles</span>
\t\t\t\t\t\t<select name="roleKeys" multiple size="6" required>
\t\t\t\t\t\t\t{#each data.team.roleTypes as role}<option value={role.roleKey}>{role.name}</option>{/each}
\t\t\t\t\t\t</select>
\t\t\t\t\t</label>
\t\t\t\t\t<button
\t\t\t\t\t\ttype="submit"
\t\t\t\t\t\tdisabled={!selectedInviteOrganisation ||
\t\t\t\t\t\t\tBoolean(selectedInviteOrganisation.linkedOrganisationId && selectedInviteOrganisation.linkedOrganisationStatus !== 'active') ||
\t\t\t\t\t\t\t(!selectedInviteOrganisation.linkedOrganisationId && selectedInviteOrganisation.contacts.length === 0)}
\t\t\t\t\t>
\t\t\t\t\t\t{selectedInviteOrganisation?.linkedOrganisationStatus === 'active'
\t\t\t\t\t\t\t? 'Send project invitation'
\t\t\t\t\t\t\t: 'Invite contact to connect & join project'}
\t\t\t\t\t</button>
\t\t\t\t{/if}
\t\t\t</form>

\t\t\t{#if data.pendingCollaborationInvitations.length > 0}
\t\t\t\t<div class="pending-collaboration">
\t\t\t\t\t<h3>Awaiting customer onboarding</h3>
\t\t\t\t\t{#each data.pendingCollaborationInvitations as invitation}
\t\t\t\t\t\t<div class="pending-invitation">
\t\t\t\t\t\t\t<div>
\t\t\t\t\t\t\t\t<strong>{invitation.crmOrganisationName}</strong>
\t\t\t\t\t\t\t\t<span>{invitation.contactName} · {invitation.email}</span>
\t\t\t\t\t\t\t\t<small>Expires {new Date(invitation.expiresAt).toLocaleString()}</small>
\t\t\t\t\t\t\t</div>
\t\t\t\t\t\t\t<form method="POST" action="?/revokeCollaborationInvitation">
\t\t\t\t\t\t\t\t<input type="hidden" name="invitationPublicId" value={invitation.publicId} />
\t\t\t\t\t\t\t\t<button class="danger" type="submit">Revoke</button>
\t\t\t\t\t\t\t</form>
\t\t\t\t\t\t</div>
\t\t\t\t\t{/each}
\t\t\t\t</div>
\t\t\t{/if}
\t\t{/if}"""
          pp = pp[:start] + replacement + pp[end:]
          # Add small support styles before the last media query.
          style_marker = "\n\t@media (max-width: 900px) {"
          if style_marker in pp:
              pp = pp.replace(style_marker, """
\t.pending-collaboration { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e1e1da; }
\t.pending-collaboration h3 { margin: 0 0 0.7rem; }
\t.pending-invitation { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.8rem; border: 1px solid #deded7; border-radius: 0.55rem; background: #fafaf7; }
