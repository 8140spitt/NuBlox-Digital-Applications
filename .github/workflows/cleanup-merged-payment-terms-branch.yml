name: Cleanup merged payment terms branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'Add one-time merged payment terms branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged feature branch
        run: git push origin --delete feat/enterprise-payment-terms-engine || true
      - name: Remove one-time cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-merged-payment-terms-branch.yml
          git commit -m 'Remove merged payment terms branch cleanup'
          git push origin HEAD:main
