name: F04 Fixture Fix
on:
  push:
    branches: [feat/f04-corporate-development-ma]
    paths:
      - '.github/workflows/f04-fixture-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f04-corporate-development-ma
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Replace F04 actor fixture with canonical RBAC seed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/lib/server/corporate-development/corporate-development.integration.test.ts')
          s = p.read_text()
          start = s.index('async function seedActor() {')
          end = s.index("\ndescribe('F04 corporate development'", start)
          replacement = '''async function seedActor() {
\tconst db = getDatabase();
\tconst suffix = Math.random().toString(36).slice(2, 10);
\tconst organisationPublicId = crypto.randomUUID();
\tconst userPublicId = crypto.randomUUID();
\tawait db
\t\t.insertInto('organisations')
\t\t.values({
\t\t\tpublic_id: organisationPublicId,
\t\t\tlegal_name: `F04 Test ${suffix}`,
\t\t\tdefault_timezone: 'Europe/London',
\t\t\tdefault_currency_code: 'GBP',
\t\t\tstatus: 'active'
\t\t})
\t\t.executeTakeFirstOrThrow();
\tconst organisation = await db
\t\t.selectFrom('organisations')
\t\t.selectAll()
\t\t.where('public_id', '=', organisationPublicId)
\t\t.executeTakeFirstOrThrow();
\tawait db
\t\t.insertInto('users')
\t\t.values({
\t\t\tpublic_id: userPublicId,
\t\t\tdisplay_name: `F04 Owner ${suffix}`,
\t\t\tstatus: 'active'
\t\t})
\t\t.executeTakeFirstOrThrow();
\tconst user = await db
\t\t.selectFrom('users')
\t\t.selectAll()
\t\t.where('public_id', '=', userPublicId)
\t\t.executeTakeFirstOrThrow();
\tawait db
\t\t.insertInto('organisation_members')
\t\t.values({
\t\t\tpublic_id: crypto.randomUUID(),
\t\t\torganisation_id: organisation.id,
\t\t\tuser_id: user.id,
\t\t\tstatus: 'active',
\t\t\tjoined_at: new Date('2026-09-10T08:00:00.000Z')
\t\t})
\t\t.executeTakeFirstOrThrow();
\tconst member = await db
\t\t.selectFrom('organisation_members')
\t\t.selectAll()
\t\t.where('organisation_id', '=', organisation.id)
\t\t.where('user_id', '=', user.id)
\t\t.executeTakeFirstOrThrow();
\tconst roleResult = await db
\t\t.insertInto('organisation_roles')
\t\t.values({
\t\t\torganisation_id: organisation.id,
\t\t\tpublic_id: crypto.randomUUID(),
\t\t\tname: `F04 Owner ${suffix}`,
\t\t\tis_active: 1
\t\t})
\t\t.executeTakeFirstOrThrow();
\tif (roleResult.insertId === undefined) throw new Error('Expected F04 role insert ID.');
\tconst roleId = roleResult.insertId.toString();
\tconst permissionKeys = ['strategy.view', 'strategy.manage', 'strategy.approve'];
\tconst permissionRows = await db
\t\t.selectFrom('permissions')
\t\t.select(['id', 'permission_key'])
\t\t.where('permission_key', 'in', permissionKeys)
\t\t.where('is_active', '=', 1)
\t\t.execute();
\texpect(permissionRows.map((row) => row.permission_key).sort()).toEqual([...permissionKeys].sort());
\tawait db
\t\t.insertInto('role_permissions')
\t\t.values(
\t\t\tpermissionRows.map((permission) => ({
\t\t\t\torganisation_id: organisation.id,
\t\t\t\torganisation_role_id: roleId,
\t\t\t\tpermission_id: permission.id
\t\t\t}))
\t\t)
\t\t.execute();
\tawait db
\t\t.insertInto('member_roles')
\t\t.values({
\t\t\torganisation_id: organisation.id,
\t\t\torganisation_member_id: member.id,
\t\t\torganisation_role_id: roleId
\t\t})
\t\t.executeTakeFirstOrThrow();
\tactor = {
\t\torganisationId: organisation.id,
\t\tuserId: user.id,
\t\tmemberId: member.id,
\t\tcorrelationId: crypto.randomUUID()
\t};
}
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Format fixture
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/lib/server/corporate-development/corporate-development.integration.test.ts
      - name: Remove workflow and commit
        run: |
          git rm .github/workflows/f04-fixture-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/corporate-development/corporate-development.integration.test.ts
          git commit -m 'Fix F04 integration fixture against canonical RBAC schema'
          git push origin HEAD:feat/f04-corporate-development-ma