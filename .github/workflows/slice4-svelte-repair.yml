name: Slice 4 Svelte Repair

on:
  push:
    branches:
      - product/v1-procurement-commercial-control
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-procurement-commercial-control
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Apply Svelte event-handler repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/routes/(app)/commercial/cost-control/+page.svelte')
          text = path.read_text()
          old = '<select name="project" onchange="this.form?.requestSubmit()">'
          new = '<select name="project" onchange={(event) => event.currentTarget.form?.requestSubmit()}>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy onchange, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cd app
          pnpm exec prettier --write 'src/routes/(app)/commercial/cost-control/+page.svelte'
      - name: Commit repair
        run: |
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add 'app/src/routes/(app)/commercial/cost-control/+page.svelte'
          git commit -m 'Fix Slice 4 project selector event handler'
          git push origin HEAD:product/v1-procurement-commercial-control
