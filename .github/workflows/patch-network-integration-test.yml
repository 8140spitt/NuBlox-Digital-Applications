name: Patch Network collaboration integration coverage

on:
  push:
    branches:
      - feature/external-access-kernel

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-access-kernel
      - name: Patch Network grant lifecycle coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/lib/server/projects/project-external-collaboration.integration.test.ts')
          text = path.read_text()

          old = """\tif (projectIds.length > 0) {\n\t\tawait db.deleteFrom('audit_events').where('project_id', 'in', projectIds).execute();"""
          new = """\tif (projectIds.length > 0) {\n\t\tawait db\n\t\t\t.deleteFrom('external_instruction_acknowledgements')\n\t\t\t.where('project_id', 'in', projectIds)\n\t\t\t.execute();\n\t\tawait db\n\t\t\t.deleteFrom('external_submittal_reviews')\n\t\t\t.where('project_id', 'in', projectIds)\n\t\t\t.execute();\n\t\tawait db\n\t\t\t.deleteFrom('external_rfi_responses')\n\t\t\t.where('project_id', 'in', projectIds)\n\t\t\t.execute();\n\t\tif (organisationId) {\n\t\t\tawait db\n\t\t\t\t.deleteFrom('external_work_items')\n\t\t\t\t.where('owning_organisation_id', '=', organisationId)\n\t\t\t\t.execute();\n\t\t\tawait db\n\t\t\t\t.deleteFrom('external_access_grants')\n\t\t\t\t.where('owning_organisation_id', '=', organisationId)\n\t\t\t\t.execute();\n\t\t}\n\t\tawait db.deleteFrom('audit_events').where('project_id', 'in', projectIds).execute();"""
          if old not in text:
              raise SystemExit('Cleanup patch target missing')
          text = text.replace(old, new, 1)

          old = """\t\texpect(portalProjects[0]).toMatchObject({\n\t\t\tprojectPublicId,\n\t\t\tprojectName: 'Person-level collaboration project',\n\t\t\tcrmOrganisationName: `${PREFIX}Customer Ltd`,\n\t\t\troles: ['Engineer']\n\t\t});\n\n\t\tconst audit = await db"""
          new = """\t\texpect(portalProjects[0]).toMatchObject({\n\t\t\tprojectPublicId,\n\t\t\tprojectName: 'Person-level collaboration project',\n\t\t\tcrmOrganisationName: `${PREFIX}Customer Ltd`,\n\t\t\troles: ['Engineer']\n\t\t});\n\n\t\tconst projectGrant = await db\n\t\t\t.selectFrom('external_access_grants')\n\t\t\t.select(['capability_key as capabilityKey', 'revoked_at as revokedAt'])\n\t\t\t.where('auth_user_id', '=', externalAuthUserId)\n\t\t\t.where('context_type', '=', 'project')\n\t\t\t.where('context_public_id', '=', projectPublicId)\n\t\t\t.where('resource_type', '=', 'project')\n\t\t\t.where('resource_public_id', '=', projectPublicId)\n\t\t\t.executeTakeFirstOrThrow();\n\t\texpect(projectGrant).toEqual({ capabilityKey: 'project.view', revokedAt: null });\n\n\t\tconst audit = await db"""
          if old not in text:
              raise SystemExit('Grant assertion patch target missing')
          text = text.replace(old, new, 1)

          old = """\t\tawait service.removeCollaborator(actor, projectPublicId, collaborator.public_id);\n\t\texpect(await service.listExternalPortalProjects(externalAuthUserId)).toEqual([]);\n\n\t\tconst membershipCount = await db"""
          new = """\t\tawait service.removeCollaborator(actor, projectPublicId, collaborator.public_id);\n\t\texpect(await service.listExternalPortalProjects(externalAuthUserId)).toEqual([]);\n\n\t\tconst activeGrantCount = await db\n\t\t\t.selectFrom('external_access_grants')\n\t\t\t.select((eb) => eb.fn.countAll<number>().as('count'))\n\t\t\t.where('auth_user_id', '=', externalAuthUserId)\n\t\t\t.where('context_type', '=', 'project')\n\t\t\t.where('context_public_id', '=', projectPublicId)\n\t\t\t.where('revoked_at', 'is', null)\n\t\t\t.executeTakeFirstOrThrow();\n\t\texpect(Number(activeGrantCount.count)).toBe(0);\n\n\t\tconst membershipCount = await db"""
          if old not in text:
              raise SystemExit('Revocation assertion patch target missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit Network grant lifecycle coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/projects/project-external-collaboration.integration.test.ts
          git commit -m "test: cover Network project grant lifecycle"
          git push origin HEAD:feature/external-access-kernel
