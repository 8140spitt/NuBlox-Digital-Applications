name: F01 Tranche B Review Fixes

on:
  push:
    branches:
      - feat/f01-business-planning-operating-model
    paths:
      - '.github/workflows/f01-tranche-b-review-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-business-planning-operating-model
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          # Preserve exact fixed-point planning values without a JavaScript Number round-trip.
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """function nonNegativeDecimal(\n\tvalue: number | string | null | undefined,\n\tlabel: string,\n\tmaximum = 999_999_999_999_999.9999\n): string {\n\tif (value === null || value === undefined || value === '') return '0.0000';\n\tconst parsed = typeof value === 'number' ? value : Number(value);\n\tif (!Number.isFinite(parsed) || parsed < 0 || parsed > maximum) {\n\t\tthrow new BusinessPlanningValidationError(\n\t\t\t`${label} must be a non-negative number within supported range.`\n\t\t);\n\t}\n\treturn parsed.toFixed(4);\n}\n\nfunction nonNegativeFte(value: number | string | null | undefined): string {\n\tif (value === null || value === undefined || value === '') return '0.00';\n\tconst parsed = typeof value === 'number' ? value : Number(value);\n\tif (!Number.isFinite(parsed) || parsed < 0 || parsed > 9_999_999_999.99) {\n\t\tthrow new BusinessPlanningValidationError(\n\t\t\t'Planned FTE must be a non-negative number within supported range.'\n\t\t);\n\t}\n\treturn parsed.toFixed(2);\n}\n""",
              """function nonNegativeFixedPoint(\n\tvalue: number | string | null | undefined,\n\tlabel: string,\n\tscale: number,\n\tmaximumIntegerDigits: number\n): string {\n\tif (value === null || value === undefined || value === '') {\n\t\treturn `0.${'0'.repeat(scale)}`;\n\t}\n\tconst raw = typeof value === 'number' ? String(value) : value.trim();\n\tif (!/^\\d+(?:\\.\\d+)?$/.test(raw)) {\n\t\tthrow new BusinessPlanningValidationError(\n\t\t\t`${label} must be a non-negative fixed-point number within supported range.`\n\t\t);\n\t}\n\tconst [integerRaw, fractionRaw = ''] = raw.split('.');\n\tconst integer = integerRaw.replace(/^0+(?=\\d)/, '');\n\tif (integer.length > maximumIntegerDigits || fractionRaw.length > scale) {\n\t\tthrow new BusinessPlanningValidationError(\n\t\t\t`${label} must be a non-negative fixed-point number within supported range.`\n\t\t);\n\t}\n\treturn `${integer}.${fractionRaw.padEnd(scale, '0')}`;\n}\n\nfunction nonNegativeDecimal(\n\tvalue: number | string | null | undefined,\n\tlabel: string\n): string {\n\treturn nonNegativeFixedPoint(value, label, 4, 15);\n}\n\nfunction nonNegativeFte(value: number | string | null | undefined): string {\n\treturn nonNegativeFixedPoint(value, 'Planned FTE', 2, 10);\n}\n"""
          )

          # Persist the exact approved project-budget version referenced by an initiative.
          replace_once(
              'database/migrations/20260906204500_strategy_business_planning_operating_model.sql',
              """    project_id BIGINT UNSIGNED NULL,\n    project_budget_id BIGINT UNSIGNED NULL,\n    lifecycle_status VARCHAR(24) CHARACTER SET ascii COLLATE ascii_bin NOT NULL DEFAULT 'proposed',\n""",
              """    project_id BIGINT UNSIGNED NULL,\n    project_budget_id BIGINT UNSIGNED NULL,\n    project_budget_version_id BIGINT UNSIGNED NULL,\n    lifecycle_status VARCHAR(24) CHARACTER SET ascii COLLATE ascii_bin NOT NULL DEFAULT 'proposed',\n"""
          )
          replace_once(
              'database/migrations/20260906204500_strategy_business_planning_operating_model.sql',
              """    KEY ix_strategy_initiative_project (project_id, project_budget_id),\n""",
              """    KEY ix_strategy_initiative_project (project_id, project_budget_id, project_budget_version_id),\n"""
          )
          replace_once(
              'database/migrations/20260906204500_strategy_business_planning_operating_model.sql',
              """    CONSTRAINT fk_strategy_initiative_budget\n        FOREIGN KEY (project_budget_id) REFERENCES project_budgets(id),\n    CONSTRAINT fk_strategy_initiative_created_by\n""",
              """    CONSTRAINT fk_strategy_initiative_budget\n        FOREIGN KEY (project_budget_id) REFERENCES project_budgets(id),\n    CONSTRAINT fk_strategy_initiative_budget_version\n        FOREIGN KEY (project_budget_version_id) REFERENCES project_budget_versions(id),\n    CONSTRAINT fk_strategy_initiative_created_by\n"""
          )
          replace_once(
              'database/migrations/20260906204500_strategy_business_planning_operating_model.sql',
              """    CONSTRAINT chk_strategy_initiative_status CHECK (lifecycle_status IN ('proposed', 'approved', 'in_progress', 'completed', 'cancelled')),\n    CONSTRAINT chk_strategy_initiative_budget_project CHECK (project_budget_id IS NULL OR project_id IS NOT NULL)\n""",
              """    CONSTRAINT chk_strategy_initiative_status CHECK (lifecycle_status IN ('proposed', 'approved', 'in_progress', 'completed', 'cancelled')),\n    CONSTRAINT chk_strategy_initiative_budget_project CHECK (project_budget_id IS NULL OR project_id IS NOT NULL),\n    CONSTRAINT chk_strategy_initiative_budget_version CHECK ((project_budget_id IS NULL AND project_budget_version_id IS NULL) OR (project_budget_id IS NOT NULL AND project_budget_version_id IS NOT NULL))\n"""
          )
          replace_once(
              '.github/workflows/database-migration-validation.yml',
              """          test \"$fk_count\" = '1097'\n          test \"$check_count\" = '683'\n""",
              """          test \"$fk_count\" = '1098'\n          test \"$check_count\" = '684'\n"""
          )
          replace_once(
              'app/src/lib/server/db/generated/strategy.d.ts',
              """  project_budget_id: string | null;\n  project_id: string | null;\n""",
              """  project_budget_id: string | null;\n  project_budget_version_id: string | null;\n  project_id: string | null;\n"""
          )

          # Repository exposes current approved choices separately from immutable version evidence.
          replace_once(
              'app/src/lib/server/strategy/business-planning-repository.ts',
              """export type ExecutionBudget = {\n\tid: string;\n\tpublicId: string;\n\tprojectId: string;\n\tbudgetNumber: string;\n\tname: string;\n\tcurrencyCode: string;\n\tapprovedVersion: number;\n};\n""",
              """export type ExecutionBudget = {\n\tid: string;\n\tversionId: string;\n\tpublicId: string;\n\tprojectId: string;\n\tbudgetNumber: string;\n\tname: string;\n\tcurrencyCode: string;\n\tapprovedVersion: number;\n\tversionStatus: string;\n};\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-repository.ts',
              """\tasync listApprovedExecutionBudgets(\n\t\torganisationId: string,\n\t\tprojectId?: string | null\n\t): Promise<ExecutionBudget[]> {\n\t\tlet query = this.db\n\t\t\t.selectFrom('project_budgets as budget')\n\t\t\t.innerJoin('project_budget_versions as version', (join) =>\n\t\t\t\tjoin\n\t\t\t\t\t.onRef('version.project_budget_id', '=', 'budget.id')\n\t\t\t\t\t.onRef('version.organisation_id', '=', 'budget.organisation_id')\n\t\t\t)\n\t\t\t.select([\n\t\t\t\t'budget.id as id',\n\t\t\t\t'budget.public_id as public_id',\n\t\t\t\t'budget.project_id as project_id',\n\t\t\t\t'budget.budget_number as budget_number',\n\t\t\t\t'budget.name as name',\n\t\t\t\t'version.currency_code as currency_code',\n\t\t\t\t'version.version_number as version_number'\n\t\t\t])\n\t\t\t.where('budget.organisation_id', '=', organisationId)\n\t\t\t.where('budget.lifecycle_status', '=', 'active')\n\t\t\t.where('version.version_status', '=', 'approved');\n\t\tif (projectId) query = query.where('budget.project_id', '=', projectId);\n\t\tconst rows = await query\n\t\t\t.orderBy('budget.budget_number', 'asc')\n\t\t\t.orderBy('version.version_number', 'desc')\n\t\t\t.execute();\n\t\tconst unique = new Map<string, ExecutionBudget>();\n\t\tfor (const row of rows) {\n\t\t\tif (unique.has(row.id)) continue;\n\t\t\tunique.set(row.id, {\n\t\t\t\tid: row.id,\n\t\t\t\tpublicId: row.public_id,\n\t\t\t\tprojectId: row.project_id,\n\t\t\t\tbudgetNumber: row.budget_number,\n\t\t\t\tname: row.name,\n\t\t\t\tcurrencyCode: row.currency_code,\n\t\t\t\tapprovedVersion: row.version_number\n\t\t\t});\n\t\t}\n\t\treturn [...unique.values()];\n\t}\n""",
              """\tasync listExecutionBudgets(\n\t\torganisationId: string,\n\t\tprojectId?: string | null\n\t): Promise<ExecutionBudget[]> {\n\t\tlet query = this.db\n\t\t\t.selectFrom('project_budgets as budget')\n\t\t\t.innerJoin('project_budget_versions as version', (join) =>\n\t\t\t\tjoin\n\t\t\t\t\t.onRef('version.project_budget_id', '=', 'budget.id')\n\t\t\t\t\t.onRef('version.organisation_id', '=', 'budget.organisation_id')\n\t\t\t)\n\t\t\t.select([\n\t\t\t\t'budget.id as id',\n\t\t\t\t'version.id as version_id',\n\t\t\t\t'budget.public_id as public_id',\n\t\t\t\t'budget.project_id as project_id',\n\t\t\t\t'budget.budget_number as budget_number',\n\t\t\t\t'budget.name as name',\n\t\t\t\t'version.currency_code as currency_code',\n\t\t\t\t'version.version_number as version_number',\n\t\t\t\t'version.version_status as version_status'\n\t\t\t])\n\t\t\t.where('budget.organisation_id', '=', organisationId)\n\t\t\t.where('budget.lifecycle_status', '=', 'active');\n\t\tif (projectId) query = query.where('budget.project_id', '=', projectId);\n\t\tconst rows = await query\n\t\t\t.orderBy('budget.budget_number', 'asc')\n\t\t\t.orderBy('version.version_number', 'desc')\n\t\t\t.execute();\n\t\treturn rows.map((row) => ({\n\t\t\tid: row.id,\n\t\t\tversionId: row.version_id,\n\t\t\tpublicId: row.public_id,\n\t\t\tprojectId: row.project_id,\n\t\t\tbudgetNumber: row.budget_number,\n\t\t\tname: row.name,\n\t\t\tcurrencyCode: row.currency_code,\n\t\t\tapprovedVersion: row.version_number,\n\t\t\tversionStatus: row.version_status\n\t\t}));\n\t}\n\n\tasync listApprovedExecutionBudgets(\n\t\torganisationId: string,\n\t\tprojectId?: string | null\n\t): Promise<ExecutionBudget[]> {\n\t\tconst rows = await this.listExecutionBudgets(organisationId, projectId);\n\t\tconst unique = new Map<string, ExecutionBudget>();\n\t\tfor (const row of rows) {\n\t\t\tif (row.versionStatus !== 'approved' || unique.has(row.id)) continue;\n\t\t\tunique.set(row.id, row);\n\t\t}\n\t\treturn [...unique.values()];\n\t}\n"""
          )

          # Service stores and validates the exact version, exposes immutable evidence and reuses an existing draft revision.
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\texecutionProjects: ExecutionProject[];\n\texecutionBudgets: ExecutionBudget[];\n\tcanManage: boolean;\n""",
              """\texecutionProjects: ExecutionProject[];\n\texecutionBudgets: ExecutionBudget[];\n\tapprovedExecutionBudgets: ExecutionBudget[];\n\tcanManage: boolean;\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\tprivate async resolveExecutionLink(\n\t\trepository: BusinessPlanningRepository,\n\t\torganisationId: string,\n\t\tprojectPublicId?: string | null,\n\t\tprojectBudgetPublicId?: string | null\n\t): Promise<{ projectId: string | null; projectBudgetId: string | null }> {\n\t\tconst normalizedProject = projectPublicId?.trim() || null;\n\t\tconst normalizedBudget = projectBudgetPublicId?.trim() || null;\n\t\tif (!normalizedProject && normalizedBudget) {\n\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t'A project must be selected before a project budget can be linked.'\n\t\t\t);\n\t\t}\n\t\tif (!normalizedProject) return { projectId: null, projectBudgetId: null };\n\t\tconst project = await repository.findExecutionProject(organisationId, normalizedProject);\n\t\tif (!project)\n\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t'Execution project is not active in the organisation scope.'\n\t\t\t);\n\t\tif (!normalizedBudget) return { projectId: project.id, projectBudgetId: null };\n\t\tconst budget = await repository.findApprovedExecutionBudget(\n\t\t\torganisationId,\n\t\t\tproject.id,\n\t\t\tnormalizedBudget\n\t\t);\n\t\tif (!budget) {\n\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t'Execution budget must be an active project budget with an approved version in the organisation scope.'\n\t\t\t);\n\t\t}\n\t\treturn { projectId: project.id, projectBudgetId: budget.id };\n\t}\n""",
              """\tprivate async resolveExecutionLink(\n\t\trepository: BusinessPlanningRepository,\n\t\torganisationId: string,\n\t\tprojectPublicId?: string | null,\n\t\tprojectBudgetPublicId?: string | null\n\t): Promise<{\n\t\tprojectId: string | null;\n\t\tprojectBudgetId: string | null;\n\t\tprojectBudgetVersionId: string | null;\n\t}> {\n\t\tconst normalizedProject = projectPublicId?.trim() || null;\n\t\tconst normalizedBudget = projectBudgetPublicId?.trim() || null;\n\t\tif (!normalizedProject && normalizedBudget) {\n\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t'A project must be selected before a project budget can be linked.'\n\t\t\t);\n\t\t}\n\t\tif (!normalizedProject) {\n\t\t\treturn { projectId: null, projectBudgetId: null, projectBudgetVersionId: null };\n\t\t}\n\t\tconst project = await repository.findExecutionProject(organisationId, normalizedProject);\n\t\tif (!project)\n\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t'Execution project is not active in the organisation scope.'\n\t\t\t);\n\t\tif (!normalizedBudget) {\n\t\t\treturn { projectId: project.id, projectBudgetId: null, projectBudgetVersionId: null };\n\t\t}\n\t\tconst budget = await repository.findApprovedExecutionBudget(\n\t\t\torganisationId,\n\t\t\tproject.id,\n\t\t\tnormalizedBudget\n\t\t);\n\t\tif (!budget) {\n\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t'Execution budget must be an active project budget with an approved version in the organisation scope.'\n\t\t\t);\n\t\t}\n\t\treturn {\n\t\t\tprojectId: project.id,\n\t\t\tprojectBudgetId: budget.id,\n\t\t\tprojectBudgetVersionId: budget.versionId\n\t\t};\n\t}\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\tconst [approvedFrameworks, plans, executionProjects, executionBudgets] = await Promise.all([\n""",
              """\t\tconst [\n\t\t\tapprovedFrameworks,\n\t\t\tplans,\n\t\t\texecutionProjects,\n\t\t\texecutionBudgets,\n\t\t\tapprovedExecutionBudgets\n\t\t] = await Promise.all([\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\trepository.listExecutionProjects(actor.organisationId),\n\t\t\trepository.listApprovedExecutionBudgets(actor.organisationId)\n\t\t]);\n""",
              """\t\t\trepository.listExecutionProjects(actor.organisationId),\n\t\t\trepository.listExecutionBudgets(actor.organisationId),\n\t\t\trepository.listApprovedExecutionBudgets(actor.organisationId)\n\t\t]);\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\t\texecutionProjects,\n\t\t\t\texecutionBudgets,\n\t\t\t\t...flags\n""",
              """\t\t\t\texecutionProjects,\n\t\t\t\texecutionBudgets,\n\t\t\t\tapprovedExecutionBudgets,\n\t\t\t\t...flags\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\texecutionProjects,\n\t\t\texecutionBudgets,\n\t\t\t...flags\n""",
              """\t\t\texecutionProjects,\n\t\t\texecutionBudgets,\n\t\t\tapprovedExecutionBudgets,\n\t\t\t...flags\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\t\tproject_id: execution.projectId,\n\t\t\t\tproject_budget_id: execution.projectBudgetId,\n\t\t\t\tlifecycle_status: 'proposed',\n""",
              """\t\t\t\tproject_id: execution.projectId,\n\t\t\t\tproject_budget_id: execution.projectBudgetId,\n\t\t\t\tproject_budget_version_id: execution.projectBudgetVersionId,\n\t\t\t\tlifecycle_status: 'proposed',\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\t\t\tprojectLinked: Boolean(execution.projectId),\n\t\t\t\t\tapprovedBudgetLinked: Boolean(execution.projectBudgetId)\n""",
              """\t\t\t\t\tprojectLinked: Boolean(execution.projectId),\n\t\t\t\t\tapprovedBudgetLinked: Boolean(execution.projectBudgetId),\n\t\t\t\t\tapprovedBudgetVersionLinked: Boolean(execution.projectBudgetVersionId)\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\t\tif (initiative.project_budget_id) {\n\t\t\t\t\tconst budget = (\n\t\t\t\t\t\tawait repository.listApprovedExecutionBudgets(organisationId, initiative.project_id)\n\t\t\t\t\t).find((candidate) => candidate.id === initiative.project_budget_id);\n\t\t\t\t\tif (!budget) {\n\t\t\t\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t\t\t\t`Initiative ${initiative.initiative_code} no longer references an active approved project budget.`\n\t\t\t\t\t\t);\n\t\t\t\t\t}\n\t\t\t\t}\n""",
              """\t\t\t\tif (initiative.project_budget_id) {\n\t\t\t\t\tif (!initiative.project_budget_version_id) {\n\t\t\t\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t\t\t\t`Initiative ${initiative.initiative_code} is missing its immutable project-budget version reference.`\n\t\t\t\t\t\t);\n\t\t\t\t\t}\n\t\t\t\t\tconst budget = (\n\t\t\t\t\t\tawait repository.listExecutionBudgets(organisationId, initiative.project_id)\n\t\t\t\t\t).find(\n\t\t\t\t\t\t(candidate) =>\n\t\t\t\t\t\t\tcandidate.id === initiative.project_budget_id &&\n\t\t\t\t\t\t\tcandidate.versionId === initiative.project_budget_version_id\n\t\t\t\t\t);\n\t\t\t\t\tif (!budget) {\n\t\t\t\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t\t\t\t`Initiative ${initiative.initiative_code} no longer references the canonical project-budget version selected for this plan.`\n\t\t\t\t\t\t);\n\t\t\t\t\t}\n\t\t\t\t}\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\tif (source.lifecycle_status !== 'approved') {\n\t\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t\t'Only an approved business plan can start a controlled revision.'\n\t\t\t\t);\n\t\t\t}\n\t\t\tawait this.requireApprovedFramework(\n""",
              """\t\t\tif (source.lifecycle_status !== 'approved') {\n\t\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t\t'Only an approved business plan can start a controlled revision.'\n\t\t\t\t);\n\t\t\t}\n\t\t\tconst latest = await repository.findLatestPlanVersion(\n\t\t\t\tactor.organisationId,\n\t\t\t\tsource.plan_code\n\t\t\t);\n\t\t\tif (latest && latest.id !== source.id) {\n\t\t\t\tif (\n\t\t\t\t\tlatest.lifecycle_status === 'draft' &&\n\t\t\t\t\tlatest.supersedes_business_plan_id === source.id\n\t\t\t\t) {\n\t\t\t\t\treturn latest;\n\t\t\t\t}\n\t\t\t\tthrow new BusinessPlanningValidationError(\n\t\t\t\t\t'Only the latest approved business-plan version can start a controlled revision.'\n\t\t\t\t);\n\t\t\t}\n\t\t\tawait this.requireApprovedFramework(\n"""
          )
          replace_once(
              'app/src/lib/server/strategy/business-planning-service.ts',
              """\t\t\t\t\tproject_id: initiative.project_id,\n\t\t\t\t\tproject_budget_id: initiative.project_budget_id,\n\t\t\t\t\tlifecycle_status: 'proposed',\n""",
              """\t\t\t\t\tproject_id: initiative.project_id,\n\t\t\t\t\tproject_budget_id: initiative.project_budget_id,\n\t\t\t\t\tproject_budget_version_id: initiative.project_budget_version_id,\n\t\t\t\t\tlifecycle_status: 'proposed',\n"""
          )

          # UI resolves exact version evidence and offers only the latest approved version for new links.
          replace_once(
              'app/src/routes/(app)/strategy/planning/+page.svelte',
              """\tfunction budgetFor(id: string | null) {\n\t\treturn id ? data.executionBudgets.find((budget) => budget.id === id) : undefined;\n\t}\n""",
              """\tfunction budgetFor(versionId: string | null) {\n\t\treturn versionId\n\t\t\t? data.executionBudgets.find((budget) => budget.versionId === versionId)\n\t\t\t: undefined;\n\t}\n"""
          )
          replace_once(
              'app/src/routes/(app)/strategy/planning/+page.svelte',
              """\t\t\t\t\t{@const budget = budgetFor(initiative.project_budget_id)}\n""",
              """\t\t\t\t\t{@const budget = budgetFor(initiative.project_budget_version_id)}\n"""
          )
          replace_once(
              'app/src/routes/(app)/strategy/planning/+page.svelte',
              """{#each data.executionBudgets as budget}<option value={budget.publicId}\n""",
              """{#each data.approvedExecutionBudgets as budget}<option value={budget.publicId}\n"""
          )

          # Make business planning discoverable from Strategy and the capability registry.
          replace_once(
