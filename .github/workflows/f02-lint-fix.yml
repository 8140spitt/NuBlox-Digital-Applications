name: F02 Lint Fix

on:
  push:
    branches:
      - feat/f02-corporate-governance
    paths:
      - '.github/workflows/f02-lint-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f02-corporate-governance

      - name: Remove unused governance helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/routes/(app)/governance/+page.svelte')
          text = path.read_text()
          block = "\n\tfunction meetingName(meetingId: string) {\n\t\treturn (\n\t\t\tdata.meetings.find((meeting) => meeting.id === meetingId)?.title ?? `Meeting ${meetingId}`\n\t\t);\n\t}\n"
          if block not in text:
              raise SystemExit('Expected unused meetingName helper not found')
          path.write_text(text.replace(block, '\n', 1))
          PY

      - name: Commit lint fix
        run: |
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add 'app/src/routes/(app)/governance/+page.svelte'
          git commit -m 'Remove unused governance meeting helper'
          git push origin HEAD:feat/f02-corporate-governance
