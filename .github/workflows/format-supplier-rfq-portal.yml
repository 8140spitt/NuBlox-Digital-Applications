name: Format supplier RFQ portal

on:
  push:
    branches:
      - fix/supplier-rfq-portal-roundtrip
    paths:
      - .github/workflows/format-supplier-rfq-portal.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-rfq-portal-roundtrip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format and auto-fix RFQ portal files
        working-directory: app
        run: |
          pnpm exec prettier --write \
            src/lib/server/auth/supplier-rfq-cookie.ts \
            src/lib/server/procurement/supplier-rfq-portal-service.ts \
            src/lib/server/procurement/procurement-service.ts \
            src/lib/server/auth/better-auth.ts \
            'src/routes/supplier-quote/[token]/+page.server.ts' \
            'src/routes/supplier-quote/[token]/+page.svelte' \
            'src/routes/(auth)/select-organisation/+page.server.ts' \
            src/routes/portal/+page.server.ts \
            src/routes/portal/supplier-quotes/+page.server.ts \
            src/routes/portal/supplier-quotes/+page.svelte \
            src/lib/server/email/email-delivery.ts \
            'src/routes/(app)/purchasing/supplier-returns/+page.server.ts' \
            'src/routes/(app)/purchasing/supplier-returns/+page.svelte'
          pnpm exec eslint --fix \
            src/lib/server/auth/supplier-rfq-cookie.ts \
            src/lib/server/procurement/supplier-rfq-portal-service.ts \
            src/lib/server/procurement/procurement-service.ts \
            src/lib/server/auth/better-auth.ts \
            'src/routes/supplier-quote/[token]/+page.server.ts' \
            'src/routes/(auth)/select-organisation/+page.server.ts' \
            src/routes/portal/+page.server.ts \
            src/routes/portal/supplier-quotes/+page.server.ts \
            src/lib/server/email/email-delivery.ts \
            'src/routes/(app)/purchasing/supplier-returns/+page.server.ts'
          pnpm exec prettier --write \
            src/lib/server/auth/supplier-rfq-cookie.ts \
            src/lib/server/procurement/supplier-rfq-portal-service.ts \
            src/lib/server/procurement/procurement-service.ts \
            src/lib/server/auth/better-auth.ts \
            'src/routes/supplier-quote/[token]/+page.server.ts' \
            'src/routes/supplier-quote/[token]/+page.svelte' \
            'src/routes/(auth)/select-organisation/+page.server.ts' \
            src/routes/portal/+page.server.ts \
            src/routes/portal/supplier-quotes/+page.server.ts \
            src/routes/portal/supplier-quotes/+page.svelte \
            src/lib/server/email/email-delivery.ts \
            'src/routes/(app)/purchasing/supplier-returns/+page.server.ts' \
            'src/routes/(app)/purchasing/supplier-returns/+page.svelte'
      - name: Remove formatter workflow
        run: rm .github/workflows/format-supplier-rfq-portal.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src .github/workflows/format-supplier-rfq-portal.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format supplier RFQ portal round trip"
          git push origin HEAD:fix/supplier-rfq-portal-roundtrip
