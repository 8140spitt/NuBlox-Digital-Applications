name: F01 Closure Follow-up

on:
  push:
    branches: [feat/f01-digital-thread-closure]
    paths: [.github/workflows/f01-closure-followup.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-digital-thread-closure
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          e2e = Path('app/e2e/strategy-performance-foresight.e2e.ts')
          text = e2e.read_text()
          text = text.replace("await kpi.getByLabel('Source record type').fill('accounting_report');", "await kpi.getByLabel('Source record type').fill('accounting_profit_and_loss');", 1)
          text = text.replace("await kpi.getByLabel('Source measure key').fill('operating_margin_percent');", "await kpi.getByLabel('Source measure key').fill('period_profit_margin_percent');", 1)
          text = text.replace("await expect(page.getByText('GBP 97500.0000')).toBeVisible();", "await expect(page.getByText('GBP 97500.0000').first()).toBeVisible();", 1)
          e2e.write_text(text)

          test = Path('app/src/lib/server/strategy/performance-foresight.integration.test.ts')
          text = test.read_text()
          old = """\t\t\tsourceMode: 'canonical',\n\t\t\tsourceDomain: 'finance',\n\t\t\tsourceRecordType: 'accounting_report',\n\t\t\tsourceMeasureKey: 'operating_margin_percent',\n"""
          new = """\t\t\tsourceMode: 'manual',\n\t\t\tsourceDomain: null,\n\t\t\tsourceRecordType: null,\n\t\t\tsourceMeasureKey: null,\n"""
          if old not in text:
              raise SystemExit('KPI source block not found')
          text = text.replace(old, new, 1)
          old = """\t\t\tsourceMode: 'canonical',\n\t\t\tsourceDomain: 'finance',\n\t\t\tsourceRecordType: 'accounting_report',\n\t\t\tsourcePublicId: 'REPORT-2027-H1',\n\t\t\tsourceMeasureKey: 'operating_margin_percent'\n"""
          new = """\t\t\tsourceMode: 'manual',\n\t\t\tsourceDomain: null,\n\t\t\tsourceRecordType: null,\n\t\t\tsourcePublicId: null,\n\t\t\tsourceMeasureKey: null\n"""
          if old not in text:
              raise SystemExit('observation source block not found')
          text = text.replace(old, new, 1)
          text = text.replace("\t\texpect(observation.source_public_id).toBe('REPORT-2027-H1');\n", "\t\texpect(observation.source_mode).toBe('manual');\n", 1)
          test.write_text(text)

          Path('.github/workflows/f01-closure-followup.yml').unlink()
          PY
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align F01 closure tests with canonical source enforcement"
          git push origin HEAD:feat/f01-digital-thread-closure
