name: Temporary V2 Noto Sans Installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-v2-noto-sans.yml'

permissions:
  contents: write

jobs:
  install-font:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install Noto Sans
        working-directory: appv2
        run: pnpm add @fontsource-variable/noto-sans
      - name: Commit dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/package.json appv2/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "feat(v2): bundle Noto Sans typography"
          git push origin main
