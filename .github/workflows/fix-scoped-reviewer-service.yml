name: Fix scoped reviewer service

on:
  push:
    branches:
      - rbac/scoped-access-reviewers

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbac/scoped-access-reviewers
          fetch-depth: 0

      - name: Apply focused TypeScript cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/lib/server/organisations/access-review-service.ts')
          text = path.read_text()

          old = "\t\t\t\t'due_at',\n\t\t\t\t'opened_at',"
          new = "\t\t\t\t'due_at',\n\t\t\t\t'reviewer_mode',\n\t\t\t\t'opened_at',"
          if old not in text:
              raise SystemExit('manager campaign select marker not found')
          text = text.replace(old, new, 1)

          old = "\t\tconst values = [];"
          new = """\t\tconst values: Array<{\n\t\t\tpublic_id: string;\n\t\t\tcampaign_id: string;\n\t\t\torganisation_id: string;\n\t\t\tsubject_member_id: string;\n\t\t\treviewer_member_id: string;\n\t\t\tassigned_by_member_id: string;\n\t\t\tassigned_at: Date;\n\t\t\tsubjectPublicId: string;\n\t\t\treviewerPublicId: string;\n\t\t}> = [];"""
          if old not in text:
              raise SystemExit('reviewer values marker not found')
          text = text.replace(old, new, 1)

          old = """\t\tawait db\n\t\t\t.insertInto('access_review_reviewer_assignments')\n\t\t\t.values(\n\t\t\t\tvalues.map(({ subjectPublicId: _subjectPublicId, reviewerPublicId: _reviewerPublicId, ...value }) => value)\n\t\t\t)\n\t\t\t.execute();"""
          new = """\t\tawait db\n\t\t\t.insertInto('access_review_reviewer_assignments')\n\t\t\t.values(\n\t\t\t\tvalues.map((value) => ({\n\t\t\t\t\tpublic_id: value.public_id,\n\t\t\t\t\tcampaign_id: value.campaign_id,\n\t\t\t\t\torganisation_id: value.organisation_id,\n\t\t\t\t\tsubject_member_id: value.subject_member_id,\n\t\t\t\t\treviewer_member_id: value.reviewer_member_id,\n\t\t\t\t\tassigned_by_member_id: value.assigned_by_member_id,\n\t\t\t\t\tassigned_at: value.assigned_at\n\t\t\t\t}))\n\t\t\t)\n\t\t\t.execute();"""
          if old not in text:
              raise SystemExit('reviewer insert marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/organisations/access-review-service.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Tighten scoped reviewer service typing"
          git push origin HEAD:rbac/scoped-access-reviewers
