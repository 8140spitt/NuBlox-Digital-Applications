name: F05 final dead-code fix

on:
  push:
    branches:
      - feat/f05-product-service-innovation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f05-product-service-innovation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Remove unused helper and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/product-service/product-service-lifecycle-service.ts')
          text = path.read_text()
          start = text.index('function sourceToken(')
          end = text.index('function date(', start)
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
          cd app
          pnpm exec prettier --write src/lib/server/product-service/product-service-lifecycle-service.ts
          pnpm exec eslint src/lib/server/product-service/product-service-lifecycle-service.ts
      - name: Commit fix and remove helper workflow
        run: |
          rm .github/workflows/f05-dead-code-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/product-service/product-service-lifecycle-service.ts .github/workflows/f05-dead-code-fix.yml
          git commit -m 'F05: remove unused lifecycle helper'
          git push origin HEAD:feat/f05-product-service-innovation
