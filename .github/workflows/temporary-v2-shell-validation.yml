name: Temporary V2 Shell Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-v2-shell-validation.yml'

permissions:
  contents: write

jobs:
  format-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Format shell slice
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/components/shell src/routes/[tenant]/app/'(protected)'/ src/routes/[tenant]/app/'(protected)'/dashboard src/routes/[tenant]/app/'(protected)'/functions
      - name: Lint
        working-directory: appv2
        run: pnpm lint
      - name: Type-check
        working-directory: appv2
        run: pnpm check
      - name: Unit tests
        working-directory: appv2
        run: pnpm test:unit
      - name: Build
        working-directory: appv2
        run: pnpm build
      - name: Commit validated formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/src
          git commit -m "style(v2): format application shell slice"
          git push origin main
