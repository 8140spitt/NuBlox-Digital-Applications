            'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/new/[record]/+page.svelte' \
            'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/+page.svelte' \
            'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/new/[record]/+page.svelte' \
