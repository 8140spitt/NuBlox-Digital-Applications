name: Temporary F01 Temporal Inheritance Repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-f01-temporal-inheritance-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Apply temporal inheritance repair
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, marker: str) -> str:
              if old not in text:
                  raise SystemExit(f'{marker} marker not found')
              return text.replace(old, new, 1)

          # 1. Make server-side date validation name the real governing parent window.
          service_path = Path('appv2/src/lib/server/strategy/execution-review-service.ts')
          service = service_path.read_text()
          service = replace_once(
              service,
              """function assertWithin(value: string, start: string, end: string, label: string): void {\n\tif (value < start || value > end) {\n\t\tthrow new StrategyValidationError(`${label} must sit within the governing planning horizon.`);\n\t}\n}""",
              """function assertWithin(\n\tvalue: string,\n\tstart: string,\n\tend: string,\n\tlabel: string,\n\tcontextLabel = 'governing planning horizon'\n): void {\n\tif (value < start || value > end) {\n\t\tthrow new StrategyValidationError(\n\t\t\t`${label} must fall between ${start} and ${end} within the ${contextLabel}.`\n\t\t);\n\t}\n}""",
              'assertWithin helper'
          )
          service = replace_once(
              service,
              """\t\tassertWithin(\n\t\t\tperiodStart,\n\t\t\tframework.horizonStart,\n\t\t\tframework.horizonEnd,\n\t\t\t'Planning period start'\n\t\t);\n\t\tassertWithin(periodEnd, framework.horizonStart, framework.horizonEnd, 'Planning period end');""",
              """\t\tassertWithin(\n\t\t\tperiodStart,\n\t\t\tframework.horizonStart,\n\t\t\tframework.horizonEnd,\n\t\t\t'Planning period start',\n\t\t\t'strategy horizon'\n\t\t);\n\t\tassertWithin(\n\t\t\tperiodEnd,\n\t\t\tframework.horizonStart,\n\t\t\tframework.horizonEnd,\n\t\t\t'Planning period end',\n\t\t\t'strategy horizon'\n\t\t);""",
              'business-plan date bounds'
          )
          service = replace_once(
              service,
              """\t\tassertWithin(startDate, planStart, planEnd, 'Initiative start');\n\t\tassertWithin(endDate, planStart, planEnd, 'Initiative end');""",
              """\t\tassertWithin(startDate, planStart, planEnd, 'Initiative start', 'selected business plan period');\n\t\tassertWithin(endDate, planStart, planEnd, 'Initiative end', 'selected business plan period');""",
              'initiative date bounds'
          )
          service = replace_once(
              service,
              """\t\t\tassertWithin(\n\t\t\t\tneedBy,\n\t\t\t\tdateValue(initiative.startDate) ?? framework.horizonStart,\n\t\t\t\tdateValue(initiative.endDate) ?? framework.horizonEnd,\n\t\t\t\t'Need-by date'\n\t\t\t);""",
              """\t\t\tassertWithin(\n\t\t\t\tneedBy,\n\t\t\t\tdateValue(initiative.startDate) ?? framework.horizonStart,\n\t\t\t\tdateValue(initiative.endDate) ?? framework.horizonEnd,\n\t\t\t\t'Need-by date',\n\t\t\t\t'selected initiative period'\n\t\t\t);""",
              'requirement date bounds'
          )
          service = service.replace(
              "assertWithin(targetDate, framework.horizonStart, framework.horizonEnd, 'Target date');",
              "assertWithin(targetDate, framework.horizonStart, framework.horizonEnd, 'Target date', 'strategy horizon');"
          )
          service = service.replace(
              "assertWithin(observedOn, framework.horizonStart, framework.horizonEnd, 'Observation date');",
              "assertWithin(observedOn, framework.horizonStart, framework.horizonEnd, 'Observation date', 'strategy horizon');"
          )
          service = service.replace(
              "assertWithin(reviewDate, framework.horizonStart, framework.horizonEnd, 'Review date');",
              "assertWithin(reviewDate, framework.horizonStart, framework.horizonEnd, 'Review date', 'strategy horizon');"
          )
          service_path.write_text(service)

          # 2. F01.04: strategy -> plan -> initiative -> resource requirement temporal inheritance.
          bp_path = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte')
          bp = bp_path.read_text()
          bp = replace_once(
              bp,
              """\tlet selectedObjectivePublicId = $state(fieldValue('objectivePublicId'));\n\tconst selectedPlan = $derived(""",
              """\tlet selectedObjectivePublicId = $state(fieldValue('objectivePublicId'));\n\tlet selectedInitiativePublicId = $state(\n\t\tfieldValue(\n\t\t\t'initiativePublicId',\n\t\t\topenInitiatives.length === 1 ? (openInitiatives[0]?.publicId ?? '') : ''\n\t\t)\n\t);\n\tconst selectedPlan = $derived(""",
              'business-planning selected initiative state'
          )
          bp = replace_once(
              bp,
              """\tconst planObjectives = $derived(\n\t\tselectedPlan\n\t\t\t? data.objectives.filter((objective) =>\n\t\t\t\t\tselectedPlan.objectivePublicIds.includes(objective.publicId)\n\t\t\t\t)\n\t\t\t: []\n\t);""",
              """\tconst planObjectives = $derived(\n\t\tselectedPlan\n\t\t\t? data.objectives.filter((objective) =>\n\t\t\t\t\tselectedPlan.objectivePublicIds.includes(objective.publicId)\n\t\t\t\t)\n\t\t\t: []\n\t);\n\tconst selectedInitiative = $derived(\n\t\topenInitiatives.find((initiative) => initiative.publicId === selectedInitiativePublicId) ?? null\n\t);""",
              'business-planning selected initiative derived'
          )
          bp = replace_once(
              bp,
              """\t\t\t\t\t\t\tvalue={fieldValue('periodStart', data.framework.horizonStart)}\n\t\t\t\t\t\t\trequired""",
              """\t\t\t\t\t\t\tvalue={fieldValue('periodStart', data.framework.horizonStart)}\n\t\t\t\t\t\t\tmin={data.framework.horizonStart}\n\t\t\t\t\t\t\tmax={data.framework.horizonEnd}\n\t\t\t\t\t\t\trequired""",
              'business-plan period start input'
          )
          bp = replace_once(
              bp,
              """\t\t\t\t\t\t\tvalue={fieldValue('periodEnd', data.framework.horizonEnd)}\n\t\t\t\t\t\t\trequired""",
              """\t\t\t\t\t\t\tvalue={fieldValue('periodEnd', data.framework.horizonEnd)}\n\t\t\t\t\t\t\tmin={data.framework.horizonStart}\n\t\t\t\t\t\t\tmax={data.framework.horizonEnd}\n\t\t\t\t\t\t\trequired""",
              'business-plan period end input'
          )
          bp = replace_once(
              bp,
              """\t\t\t\t\t<Field id=\"initiativePublicId\" label=\"Initiative\" required>\n\t\t\t\t\t\t<select class=\"nb-control\" id=\"initiativePublicId\" name=\"initiativePublicId\" required>\n\t\t\t\t\t\t\t<option value=\"\">Choose initiative</option>\n\t\t\t\t\t\t\t{#each openInitiatives as initiative (initiative.publicId)}\n\t\t\t\t\t\t\t\t<option value={initiative.publicId}>{initiative.code} · {initiative.title}</option>\n\t\t\t\t\t\t\t{/each}\n\t\t\t\t\t\t</select>\n\t\t\t\t\t</Field>""",
              """\t\t\t\t\t<Field\n\t\t\t\t\t\tid=\"initiativePublicId\"\n\t\t\t\t\t\tlabel=\"Initiative\"\n\t\t\t\t\t\thint=\"The initiative supplies the valid need-by window and planning currency.\"\n\t\t\t\t\t\trequired\n\t\t\t\t\t>\n\t\t\t\t\t\t<select\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"initiativePublicId\"\n\t\t\t\t\t\t\tname=\"initiativePublicId\"\n\t\t\t\t\t\t\tbind:value={selectedInitiativePublicId}\n\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t>\n\t\t\t\t\t\t\t<option value=\"\">Choose initiative</option>\n\t\t\t\t\t\t\t{#each openInitiatives as initiative (initiative.publicId)}\n\t\t\t\t\t\t\t\t<option value={initiative.publicId}\n\t\t\t\t\t\t\t\t\t>{initiative.code} · {initiative.title} · {initiative.startDate} → {initiative.endDate}</option\n\t\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t{/each}\n\t\t\t\t\t\t</select>\n\t\t\t\t\t</Field>""",
              'resource requirement initiative selector'
          )
          bp = replace_once(
              bp,
              """\t\t\t\t\t<Field id=\"currencyCode\" label=\"Currency\"\n\t\t\t\t\t\t><input\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"currencyCode\"\n\t\t\t\t\t\t\tname=\"currencyCode\"\n\t\t\t\t\t\t\tvalue={fieldValue('currencyCode', 'GBP')}\n\t\t\t\t\t\t\tmaxlength=\"3\"\n\t\t\t\t\t\t/></Field\n\t\t\t\t\t>\n\t\t\t\t\t<Field id=\"needBy\" label=\"Need by\"\n\t\t\t\t\t\t><input\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"needBy\"\n\t\t\t\t\t\t\tname=\"needBy\"\n\t\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\t\tvalue={fieldValue('needBy')}\n\t\t\t\t\t\t/></Field\n\t\t\t\t\t>""",
              """\t\t\t\t\t<Field\n\t\t\t\t\t\tid=\"currencyCode\"\n\t\t\t\t\t\tlabel=\"Currency\"\n\t\t\t\t\t\thint={selectedInitiative ? `Inherited from ${selectedInitiative.code}.` : undefined}\n\t\t\t\t\t>\n\t\t\t\t\t\t<input\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"currencyCode\"\n\t\t\t\t\t\t\tname=\"currencyCode\"\n\t\t\t\t\t\t\tvalue={fieldValue('currencyCode', selectedInitiative?.currencyCode ?? 'GBP')}\n\t\t\t\t\t\t\tmaxlength=\"3\"\n\t\t\t\t\t\t/>\n\t\t\t\t\t</Field>\n\t\t\t\t\t<Field\n\t\t\t\t\t\tid=\"needBy\"\n\t\t\t\t\t\tlabel=\"Need by\"\n\t\t\t\t\t\thint={selectedInitiative\n\t\t\t\t\t\t\t? `Must fall within ${selectedInitiative.startDate} to ${selectedInitiative.endDate}; defaults to initiative start.`\n\t\t\t\t\t\t\t: 'Select an initiative to inherit its valid delivery window.'}\n\t\t\t\t\t>\n\t\t\t\t\t\t<input\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"needBy\"\n\t\t\t\t\t\t\tname=\"needBy\"\n\t\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\t\tvalue={fieldValue('needBy', selectedInitiative?.startDate ?? '')}\n\t\t\t\t\t\t\tmin={selectedInitiative?.startDate}\n\t\t\t\t\t\t\tmax={selectedInitiative?.endDate}\n\t\t\t\t\t\t/>\n\t\t\t\t\t</Field>""",
              'resource requirement temporal fields'
          )
          bp_path.write_text(bp)

          # 3. F01.06 KPI target inherits objective context; observations expose strategy bounds before submit.
          kpi_path = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/new/[record]/+page.svelte')
          kpi = kpi_path.read_text()
          kpi = replace_once(
              kpi,
              """\tfunction fieldValue(key: string, fallback = ''): string {\n\t\treturn values[key] ?? fallback;\n\t}\n</script>""",
              """\tfunction fieldValue(key: string, fallback = ''): string {\n\t\treturn values[key] ?? fallback;\n\t}\n\n\tlet selectedObjectivePublicId = $state(\n\t\tfieldValue(\n\t\t\t'objectivePublicId',\n\t\t\tdata.objectives.length === 1 ? (data.objectives[0]?.publicId ?? '') : ''\n\t\t)\n\t);\n\tconst selectedObjective = $derived(\n\t\tdata.objectives.find((objective) => objective.publicId === selectedObjectivePublicId) ?? null\n\t);\n\tconst contributingInitiatives = $derived(\n\t\tselectedObjective\n\t\t\t? data.initiatives.filter(\n\t\t\t\t\t(initiative) => initiative.objectivePublicId === selectedObjective.publicId\n\t\t\t\t)\n\t\t\t: []\n\t);\n</script>""",
              'KPI objective state'
          )
          kpi = replace_once(
              kpi,
              """\t\t\t\t<Field id=\"objectivePublicId\" label=\"Strategic objective\" required>\n\t\t\t\t\t<select class=\"nb-control\" id=\"objectivePublicId\" name=\"objectivePublicId\" required>""",
              """\t\t\t\t<Field id=\"objectivePublicId\" label=\"Strategic objective\" required>\n\t\t\t\t\t<select\n\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\tid=\"objectivePublicId\"\n\t\t\t\t\t\tname=\"objectivePublicId\"\n\t\t\t\t\t\tbind:value={selectedObjectivePublicId}\n\t\t\t\t\t\trequired\n\t\t\t\t\t>""",
              'KPI objective selector'
          )
          kpi = replace_once(
              kpi,
              """\t\t\t\t<Field id=\"targetDate\" label=\"Target date\">\n\t\t\t\t\t<input\n\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\tid=\"targetDate\"\n\t\t\t\t\t\tname=\"targetDate\"\n\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\tvalue={fieldValue('targetDate')}\n\t\t\t\t\t/>\n\t\t\t\t</Field>""",
              """\t\t\t\t<Field\n\t\t\t\t\tid=\"targetDate\"\n\t\t\t\t\tlabel=\"Target date\"\n\t\t\t\t\thint={selectedObjective?.targetDate\n\t\t\t\t\t\t? `Defaults to the objective target ${selectedObjective.targetDate}; the strategy horizon remains the outer boundary.`\n\t\t\t\t\t\t: `Must fall within ${data.framework.horizonStart} to ${data.framework.horizonEnd}.`}\n\t\t\t\t>\n\t\t\t\t\t<input\n\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\tid=\"targetDate\"\n\t\t\t\t\t\tname=\"targetDate\"\n\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\tvalue={fieldValue(\n\t\t\t\t\t\t\t'targetDate',\n\t\t\t\t\t\t\tselectedObjective?.targetDate ?? data.framework.horizonEnd\n\t\t\t\t\t\t)}\n\t\t\t\t\t\tmin={data.framework.horizonStart}\n\t\t\t\t\t\tmax={data.framework.horizonEnd}\n\t\t\t\t\t/>\n\t\t\t\t</Field>""",
              'KPI target date'
          )
          kpi = replace_once(
              kpi,
              """\t\t\t<div class=\"selection-list\">\n\t\t\t\t{#each data.initiatives as initiative (initiative.publicId)}""",
              """\t\t\t<div class=\"selection-list\">\n\t\t\t\t{#each contributingInitiatives as initiative (initiative.publicId)}""",
              'KPI contributing initiative filter'
          )
          kpi = replace_once(
              kpi,
              """\t\t\t\t{:else}\n\t\t\t\t\t<p>No initiatives exist yet. A KPI may still measure the objective directly.</p>\n\t\t\t\t{/each}""",
              """\t\t\t\t{:else}\n\t\t\t\t\t<p>\n\t\t\t\t\t\t{selectedObjective\n\t\t\t\t\t\t\t? 'No initiatives contribute to this objective yet. The KPI may still measure the objective directly.'\n\t\t\t\t\t\t\t: 'Choose the strategic objective first to see its contributing initiatives.'}\n\t\t\t\t\t</p>\n\t\t\t\t{/each}""",
              'KPI initiative empty state'
          )
          kpi_path.write_text(kpi)

          perf_path = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/performance/+page.svelte')
          perf = perf_path.read_text()
          perf = replace_once(
              perf,
              """\t\t\t\t\t\t\t\t<Field id={`observedOn-${kpi.publicId}`} label=\"Observed on\" required>\n\t\t\t\t\t\t\t\t\t<input\n\t\t\t\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\t\t\t\tid={`observedOn-${kpi.publicId}`}\n\t\t\t\t\t\t\t\t\t\tname=\"observedOn\"\n\t\t\t\t\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t\t\t</Field>""",
              """\t\t\t\t\t\t\t\t<Field\n\t\t\t\t\t\t\t\t\tid={`observedOn-${kpi.publicId}`}\n\t\t\t\t\t\t\t\t\tlabel=\"Observed on\"\n\t\t\t\t\t\t\t\t\thint={`Must fall within the strategy horizon ${data.framework.horizonStart} to ${data.framework.horizonEnd}.`}\n\t\t\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t\t\t<input\n\t\t\t\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\t\t\t\tid={`observedOn-${kpi.publicId}`}\n\t\t\t\t\t\t\t\t\t\tname=\"observedOn\"\n\t\t\t\t\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\t\t\t\t\tmin={data.framework.horizonStart}\n\t\t\t\t\t\t\t\t\t\tmax={data.framework.horizonEnd}\n\t\t\t\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t\t\t</Field>""",
              'KPI observation date'
          )
          perf_path.write_text(perf)

          # 4. F01.07: expose strategy envelope on review dates and inherit review date into decision bounds.
          review_path = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/review/new/[record]/+page.svelte')
          review = review_path.read_text()
          review = replace_once(
              review,
              """\tfunction fieldValue(key: string, fallback = ''): string {\n\t\treturn values[key] ?? fallback;\n\t}\n</script>""",
              """\tfunction fieldValue(key: string, fallback = ''): string {\n\t\treturn values[key] ?? fallback;\n\t}\n\n\tlet selectedReviewPublicId = $state(\n\t\tfieldValue(\n\t\t\t'reviewPublicId',\n\t\t\tdraftReviews.length === 1 ? (draftReviews[0]?.publicId ?? '') : ''\n\t\t)\n\t);\n\tconst selectedReview = $derived(\n\t\tdraftReviews.find((review) => review.publicId === selectedReviewPublicId) ?? null\n\t);\n</script>""",
              'review selected review state'
          )
          review = replace_once(
              review,
              """\t\t\t\t\t<Field id=\"reviewDate\" label=\"Review date\" required>\n\t\t\t\t\t\t<input\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"reviewDate\"\n\t\t\t\t\t\t\tname=\"reviewDate\"\n\t\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\t\tvalue={fieldValue('reviewDate')}\n\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t/>\n\t\t\t\t\t</Field>""",
              """\t\t\t\t\t<Field\n\t\t\t\t\t\tid=\"reviewDate\"\n\t\t\t\t\t\tlabel=\"Review date\"\n\t\t\t\t\t\thint={`Must fall within the strategy horizon ${data.framework.horizonStart} to ${data.framework.horizonEnd}.`}\n\t\t\t\t\t\trequired\n\t\t\t\t\t>\n\t\t\t\t\t\t<input\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"reviewDate\"\n\t\t\t\t\t\t\tname=\"reviewDate\"\n\t\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\t\tvalue={fieldValue('reviewDate')}\n\t\t\t\t\t\t\tmin={data.framework.horizonStart}\n\t\t\t\t\t\t\tmax={data.framework.horizonEnd}\n\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t/>\n\t\t\t\t\t</Field>""",
              'review date input'
          )
          review = replace_once(
              review,
              """\t\t\t\t\t<Field id=\"reviewPublicId\" label=\"Draft strategic review\" required>\n\t\t\t\t\t\t<select class=\"nb-control\" id=\"reviewPublicId\" name=\"reviewPublicId\" required>""",
              """\t\t\t\t\t<Field id=\"reviewPublicId\" label=\"Draft strategic review\" required>\n\t\t\t\t\t\t<select\n\t\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\t\tid=\"reviewPublicId\"\n\t\t\t\t\t\t\tname=\"reviewPublicId\"\n\t\t\t\t\t\t\tbind:value={selectedReviewPublicId}\n\t\t\t\t\t\t\trequired\n\t\t\t\t\t\t>""",
              'decision review selector'
          )
          review = replace_once(
              review,
              """\t\t\t\t<Field id=\"dueDate\" label=\"Due date\">\n\t\t\t\t\t<input\n\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\tid=\"dueDate\"\n\t\t\t\t\t\tname=\"dueDate\"\n\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\tvalue={fieldValue('dueDate')}\n\t\t\t\t\t/>\n\t\t\t\t</Field>""",
              """\t\t\t\t<Field\n\t\t\t\t\tid=\"dueDate\"\n\t\t\t\t\tlabel=\"Due date\"\n\t\t\t\t\thint={selectedReview\n\t\t\t\t\t\t? `Cannot be before the selected review date ${selectedReview.reviewDate}.`\n\t\t\t\t\t\t: 'Select the draft review to establish the earliest valid due date.'}\n\t\t\t\t>\n\t\t\t\t\t<input\n\t\t\t\t\t\tclass=\"nb-control\"\n\t\t\t\t\t\tid=\"dueDate\"\n\t\t\t\t\t\tname=\"dueDate\"\n\t\t\t\t\t\ttype=\"date\"\n\t\t\t\t\t\tvalue={fieldValue('dueDate')}\n\t\t\t\t\t\tmin={selectedReview?.reviewDate}\n\t\t\t\t\t/>\n\t\t\t\t</Field>""",
              'review decision due date'
          )
          review_path.write_text(review)

          # 5. Codify the product rule so future F01/F01.05 work follows the same temporal model.
          docs_path = Path('docs/world-class/15-f01-strategy-enterprise-planning-v2.md')
          docs = docs_path.read_text()
          marker = """8. Business-plan approval is blocked when resource requirements remain identified but have never been handed to an authoritative function.\n\nThe intended handoff examples"""
          replacement = """8. Business-plan approval is blocked when resource requirements remain identified but have never been handed to an authoritative function.\n9. Temporal context is inherited, not re-keyed: the strategy horizon is the outer envelope; a business plan refines that envelope; initiatives must fit the selected plan period; and dated resource requirements inherit the selected initiative period. Transaction UIs must expose these bounds before submission and prefill deterministic parent context rather than relying on post-submit validation errors.\n\nThe intended handoff examples"""
          docs = replace_once(docs, marker, replacement, 'F01.04 temporal standard')
          marker = """6. The target state for financial, workforce, project and other domain measures is authoritative source integration with drill-through rather than re-keying.\n\n## 11."""
          replacement = """6. The target state for financial, workforce, project and other domain measures is authoritative source integration with drill-through rather than re-keying.\n7. KPI target and observation date controls inherit the parent strategy/objective temporal context in the transaction UI; known parent target dates may be offered as defaults, while evidence dates that cannot be inferred remain explicit user input inside the governing horizon.\n\n## 11."""
          docs = replace_once(docs, marker, replacement, 'F01.06 temporal standard')
          marker = """6. Review approval freezes the review as governed enterprise evidence.\n\n## 12."""
          replacement = """6. Review approval freezes the review as governed enterprise evidence.\n7. Review dates expose the strategy horizon before submission, and decision due dates inherit the selected review date as their earliest valid date; NuBlox carries known temporal context forward without inventing management commitments.\n\n## 12."""
          docs = replace_once(docs, marker, replacement, 'F01.07 temporal standard')
          docs_path.write_text(docs)

          # Guard against future accidental regression inside this repair.
          checks = {
              bp_path: [
                  'min={data.framework.horizonStart}',
                  'bind:value={selectedInitiativePublicId}',
                  'min={selectedInitiative?.startDate}',
                  "selectedInitiative?.currencyCode ?? 'GBP'"
              ],
              kpi_path: [
                  'bind:value={selectedObjectivePublicId}',
                  'selectedObjective?.targetDate ?? data.framework.horizonEnd',
                  '{#each contributingInitiatives as initiative'
              ],
              perf_path: [
                  'min={data.framework.horizonStart}',
                  'max={data.framework.horizonEnd}'
              ],
              review_path: [
                  'bind:value={selectedReviewPublicId}',
                  'min={selectedReview?.reviewDate}',
                  'max={data.framework.horizonEnd}'
              ],
              service_path: [
                  "'selected business plan period'",
                  "'selected initiative period'",
                  "'strategy horizon'"
              ]
          }
          for path, needles in checks.items():
              text = path.read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: expected {needle!r}')
          PY

