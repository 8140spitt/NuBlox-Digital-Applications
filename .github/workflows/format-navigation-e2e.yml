name: Format navigation E2E

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-navigation-e2e.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format navigation E2E files
        working-directory: app
        run: pnpm exec prettier --write e2e/authenticated-workspaces.e2e.ts e2e/contexts.e2e.ts e2e/ui-permissions.e2e.ts
      - name: Remove formatter workflow
        run: rm .github/workflows/format-navigation-e2e.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/authenticated-workspaces.e2e.ts app/e2e/contexts.e2e.ts app/e2e/ui-permissions.e2e.ts .github/workflows/format-navigation-e2e.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format navigation E2E contracts"
          git push origin HEAD:main
