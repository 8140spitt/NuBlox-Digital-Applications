name: F01 Tranche B Review Executor

on:
  push:
    branches:
      - feat/f01-business-planning-operating-model
    paths:
      - '.github/workflows/f01-tranche-b-review-executor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-business-planning-operating-model
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply reviewed product fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/f01-tranche-b-review-fixes.yml').read_text()
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = source.index(marker_start) + len(marker_start)
          end = source.index(marker_end, start)
          script = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script = script.replace(
              'app/src/lib/server/capabilities/native-capability-registry.ts',
              'app/src/lib/navigation/capability-registry.ts'
          )
          Path('/tmp/f01-review-fixes.py').write_text(script + '\n')
          PY
          python /tmp/f01-review-fixes.py
          # The Actions token cannot update workflow definitions; that count-only update is committed separately.
          git checkout -- .github/workflows/database-migration-validation.yml
      - name: Format changed application files
        working-directory: app
        run: >-
          pnpm exec prettier --write
          e2e/strategy-business-planning.e2e.ts
          src/lib/server/db/generated/strategy.d.ts
          src/lib/server/strategy/business-planning-repository.ts
          src/lib/server/strategy/business-planning-service.ts
          src/lib/server/strategy/business-planning.integration.test.ts
          src/lib/navigation/capability-registry.ts
          'src/routes/(app)/strategy/+page.svelte'
          'src/routes/(app)/strategy/planning/+page.svelte'
      - name: Validate formatting lint and types
        working-directory: app
        run: |
          pnpm lint
          pnpm check
      - name: Commit reviewed product fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/e2e/strategy-business-planning.e2e.ts \
            app/src/lib/server/db/generated/strategy.d.ts \
            app/src/lib/server/strategy/business-planning-repository.ts \
            app/src/lib/server/strategy/business-planning-service.ts \
            app/src/lib/server/strategy/business-planning.integration.test.ts \
            app/src/lib/navigation/capability-registry.ts \
            'app/src/routes/(app)/strategy/+page.svelte' \
            'app/src/routes/(app)/strategy/planning/+page.svelte' \
            database/migrations/20260906204500_strategy_business_planning_operating_model.sql \
            docs/architecture/function-capability-map/map-f01-f08.md
          git commit -m 'Address F01 tranche B review findings'
          git push origin HEAD:feat/f01-business-planning-operating-model
