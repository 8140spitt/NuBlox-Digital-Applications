name: F01 Final Locator Fix

on:
  push:
    branches:
      - feat/f01-business-planning-operating-model
    paths:
      - '.github/workflows/f01-final-locator-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-business-planning-operating-model
      - name: Make browser heading locators exact and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/e2e/strategy-business-planning.e2e.ts')
          text = path.read_text()
          old = "page.getByRole('heading', { name: 'Integrated enterprise delivery' })"
          new = "page.getByRole('heading', { name: 'Integrated enterprise delivery', exact: true })"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 ambiguous heading locators, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/f01-final-locator-fix.yml
          git add app/e2e/strategy-business-planning.e2e.ts
          git commit -m 'Make F01 browser proof locators exact'
          git push origin HEAD:feat/f01-business-planning-operating-model
