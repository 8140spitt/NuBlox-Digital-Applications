name: F05 sync and repair

on:
  push:
    branches:
      - feat/f05-product-service-innovation
    paths:
      - .github/workflows/f05-sync-and-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f05-product-service-innovation
          fetch-depth: 0
      - name: Sync current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Repair F05 and navigation browser contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          product = Path('app/e2e/product-service.e2e.ts')
          text = product.read_text()
          replacements = {
              "selectOption({ label: /NEED-E2E/ })": "selectOption({ label: 'NEED-E2E · Governed lifecycle evidence' })",
              "selectOption({ label: /IDEA-E2E/ })": "selectOption({ label: 'IDEA-E2E · Lifecycle assurance concept' })",
              "selectOption({ label: /OFFER-E2E/ })": "selectOption({ label: 'OFFER-E2E · E2E Lifecycle Assurance Service' })",
              "selectOption({ label: /BC-E2E/ })": "selectOption({ label: 'BC-E2E v1 · Lifecycle assurance investment case' })",
              "selectOption({ label: /DES-E2E/ })": "selectOption({ label: 'DES-E2E v1 · E2E lifecycle service design' })",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          product.write_text(text)

          layout = Path('app/src/routes/(app)/+layout.svelte')
          text = layout.read_text()
          old = """\tfunction isPrimaryActive(item: AppNavigationItem): boolean {\n\t\tif (item.id === 'projects' && data.projectContext) return true;\n\t\tif (item.id === 'customers' && businessContext?.id === 'relationships') return true;\n\t\tif (item.id === 'finance' && businessContext?.id === 'finance') return true;\n\t\treturn isActive(item.href);\n\t}\n"""
          new = """\tfunction isPrimaryActive(item: AppNavigationItem): boolean {\n\t\tif ((item.id === 'projects' || item.id === 'F27') && data.projectContext) return true;\n\t\tif ((item.id === 'customers' || item.id === 'F07') && businessContext?.id === 'relationships')\n\t\t\treturn true;\n\t\tif ((item.id === 'finance' || item.id === 'F14') && businessContext?.id === 'finance') return true;\n\t\treturn isActive(item.href);\n\t}\n"""
          if old not in text:
              raise SystemExit('Expected primary navigation active-state block not found')
          layout.write_text(text.replace(old, new))
          PY
      - name: Format and remove helper
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write e2e/product-service.e2e.ts 'src/routes/(app)/+layout.svelte'
          cd ..
          rm .github/workflows/f05-sync-and-repair.yml
      - name: Commit repaired combined tree
        run: |
          git add -A
          git commit -m "F05: sync main and repair browser validation"
          git push origin HEAD:feat/f05-product-service-innovation
