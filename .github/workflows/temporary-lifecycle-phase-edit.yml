name: Temporary lifecycle phase edit implementation

on:
  push:
    branches:
      - feat/f01-governed-workflow
    paths:
      - '.github/workflows/temporary-lifecycle-phase-edit.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_phase_validation

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/f01-governed-workflow
          fetch-depth: 0

      - name: Implement lifecycle phase editing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          service = Path('appv2/src/lib/server/platform/lifecycle-admin-service.ts')
          text = service.read_text()
          marker = "export async function deleteLifecyclePhase(input: {"
          if 'export async function updateLifecyclePhase(input:' not in text:
              insertion = r'''export async function updateLifecyclePhase(input: {
          	actor: EvidenceActor;
          	publicId: string;
          	phaseKey: string;
          	nextPhaseKey: string;
          	label: string;
          	displayOrder: number;
          	editable: boolean;
          	deletable: boolean;
          	revisable: boolean;
          }): Promise<void> {
          	await requirePermission(input.actor, 'lifecycle.manage');
          	const phaseKeyValue = stateKey(input.phaseKey, 'Current phase key');
          	const nextPhaseKeyValue = stateKey(input.nextPhaseKey, 'Phase key');
          	if (!Number.isInteger(input.displayOrder) || input.displayOrder < 0) {
          		throw new LifecycleAdministrationValidationError(
          			'Display order must be a non-negative whole number.'
          		);
          	}
          	const connection = await getPool().getConnection();
          	try {
          		await connection.beginTransaction();
          		const row = await templateRow(connection, input.actor, input.publicId, true);
          		if (row.status !== 'draft') {
          			throw new LifecycleAdministrationValidationError(
          				'Only draft lifecycle templates can be modified.'
          			);
          		}
          		const [phaseRows] = await connection.execute<RowDataPacket[]>(
          			`SELECT id FROM lifecycle_template_phases
          			 WHERE organisation_id = ? AND lifecycle_template_id = ? AND phase_key = ?
          			 LIMIT 1 FOR UPDATE`,
          			[input.actor.organisationId, row.id, phaseKeyValue]
          		);
          		if (!phaseRows[0]) {
          			throw new LifecycleAdministrationValidationError('Lifecycle phase was not found.');
          		}
          
          		if (nextPhaseKeyValue !== phaseKeyValue) {
          			const [existingRows] = await connection.execute<RowDataPacket[]>(
          				`SELECT id FROM lifecycle_template_phases
          				 WHERE organisation_id = ? AND lifecycle_template_id = ? AND phase_key = ? LIMIT 1`,
          				[input.actor.organisationId, row.id, nextPhaseKeyValue]
          			);
          			if (existingRows[0]) {
          				throw new LifecycleAdministrationValidationError(
          					`Lifecycle phase ${nextPhaseKeyValue} already exists.`
          				);
          			}
          			await connection.execute(
          				`UPDATE lifecycle_template_transitions
          				 SET from_state = ?
          				 WHERE organisation_id = ? AND lifecycle_template_id = ? AND from_state = ?`,
          				[nextPhaseKeyValue, input.actor.organisationId, row.id, phaseKeyValue]
          			);
          			await connection.execute(
          				`UPDATE lifecycle_template_transitions
          				 SET to_state = ?
          				 WHERE organisation_id = ? AND lifecycle_template_id = ? AND to_state = ?`,
          				[nextPhaseKeyValue, input.actor.organisationId, row.id, phaseKeyValue]
          			);
          			await connection.execute(
          				`UPDATE lifecycle_template_phase_access_rules
          				 SET phase_key = ?
          				 WHERE organisation_id = ? AND lifecycle_template_id = ? AND phase_key = ?`,
          				[nextPhaseKeyValue, input.actor.organisationId, row.id, phaseKeyValue]
          			);
          		}
          
          		await connection.execute(
          			`UPDATE lifecycle_template_phases
          			 SET phase_key = ?, label = ?, display_order = ?,
          			     is_editable = ?, is_deletable = ?, is_revisable = ?
          			 WHERE organisation_id = ? AND lifecycle_template_id = ? AND phase_key = ?`,
          			[
          				nextPhaseKeyValue,
          				requiredText(input.label, 'Phase label', 120),
          				input.displayOrder,
          				input.editable,
          				input.deletable,
          				input.revisable,
          				input.actor.organisationId,
          				row.id,
          				phaseKeyValue
          			]
          		);
          		if (row.initialState === phaseKeyValue && nextPhaseKeyValue !== phaseKeyValue) {
          			await connection.execute(
          				`UPDATE lifecycle_templates SET initial_state = ? WHERE organisation_id = ? AND id = ?`,
          				[nextPhaseKeyValue, input.actor.organisationId, row.id]
          			);
          		}
          
          		const changeNote =
          			nextPhaseKeyValue === phaseKeyValue
          				? `Lifecycle phase ${phaseKeyValue} updated`
          				: `Lifecycle phase ${phaseKeyValue} renamed to ${nextPhaseKeyValue}`;
          		await bumpDraft(connection, input.actor, row, changeNote);
          		await appendDomainEvidence(connection, {
          			actor: input.actor,
          			actionKey: 'lifecycle.phase.update',
          			subjectType: 'lifecycle_template',
          			subjectPublicId: input.publicId,
          			changeSummary: {
          				previousPhaseKey: phaseKeyValue,
          				phaseKey: nextPhaseKeyValue,
          				label: requiredText(input.label, 'Phase label', 120),
          				displayOrder: input.displayOrder,
          				editable: input.editable,
          				deletable: input.deletable,
          				revisable: input.revisable,
          				initialPhaseRenamed: row.initialState === phaseKeyValue && nextPhaseKeyValue !== phaseKeyValue
          			},
          			eventMetadata: { function: 'PLATFORM', mutation: 'update-phase' }
          		});
          		await connection.commit();
          	} catch (error) {
          		await connection.rollback();
          		throw error;
          	} finally {
          		connection.release();
          	}
          }
          
          '''
              if marker not in text:
                  raise SystemExit('deleteLifecyclePhase marker not found')
              text = text.replace(marker, insertion + marker, 1)
              service.write_text(text)

          server = Path('appv2/src/routes/[tenant]/app/(protected)/lifecycle/[template]/+page.server.ts')
          text = server.read_text()
          if '\tupdateLifecyclePhase,' not in text:
              text = text.replace(
                  '\tunbindOrganisationRole,\n\tupdateLifecycleTemplate',
                  '\tunbindOrganisationRole,\n\tupdateLifecyclePhase,\n\tupdateLifecycleTemplate',
                  1
              )
          action_marker = '\tdeletePhase: async ({ request, params, url }) => {'
          if '\tupdatePhase: async ({ request, params, url }) => {' not in text:
              action = r'''	updatePhase: async ({ request, params, url }) => {
          		const formData = await request.formData();
          		const { actor } = await actorFor(request, params, `${url.pathname}${url.search}`);
          		try {
          			await updateLifecyclePhase({
          				actor,
          				publicId: params.template,
          				phaseKey: String(formData.get('originalPhaseKey') ?? ''),
          				nextPhaseKey: String(formData.get('phaseKey') ?? ''),
          				label: String(formData.get('label') ?? ''),
          				displayOrder: numberValue(formData, 'displayOrder', 0),
          				editable: checked(formData, 'editable'),
          				deletable: checked(formData, 'deletable'),
          				revisable: checked(formData, 'revisable')
          			});
          			redirect(303, url.pathname);
          		} catch (cause) {
          			return handle(cause);
          		}
          	},
          '''
              if action_marker not in text:
                  raise SystemExit('deletePhase action marker not found')
              text = text.replace(action_marker, action + action_marker, 1)
          server.write_text(text)

          page = Path('appv2/src/routes/[tenant]/app/(protected)/lifecycle/[template]/+page.svelte')
          text = page.read_text()
          phase_start = text.index('\t\t\t<Panel\n\t\t\t\ttitle="Lifecycle phases"')
          add_form = text.index('\n\t\t\t\t{#if draft && template.canManage}\n\t\t\t\t\t<form method="POST" action="?/addPhase"', phase_start)
          list_start = text.rfind('\t\t\t\t<div class="record-list">', phase_start, add_form)
          list_end = text.index('\n\t\t\t\t</div>', list_start) + len('\n\t\t\t\t</div>')
          replacement = r'''				<div class="record-list">
          					{#each template.phases as phase (phase.phaseKey)}
          						{#if draft && template.canManage}
          							<div class="phase-editor">
          								<form method="POST" action="?/updatePhase" use:enhance class="phase-edit-form">
          									<input type="hidden" name="originalPhaseKey" value={phase.phaseKey} />
          									<label class="phase-field">
          										<span>Phase key</span>
          										<input class="nb-control" name="phaseKey" value={phase.phaseKey} required />
          									</label>
          									<label class="phase-field phase-label">
          										<span>Label</span>
          										<input class="nb-control" name="label" value={phase.label} required />
          									</label>
          									<label class="phase-field phase-order">
          										<span>Order</span>
          										<input class="nb-control" type="number" min="0" name="displayOrder" value={phase.displayOrder} required />
          									</label>
          									<div class="phase-capabilities" aria-label={`Capabilities for ${phase.label}`}>
          										<label class="check"><input type="checkbox" name="editable" checked={phase.editable} /> Edit</label>
          										<label class="check"><input type="checkbox" name="deletable" checked={phase.deletable} /> Delete</label>
          										<label class="check"><input type="checkbox" name="revisable" checked={phase.revisable} /> Revise</label>
          									</div>
          									<div class="phase-actions">
          										{#if phase.phaseKey === template.initialState}<span class="initial-phase">Initial phase</span>{/if}
          										<Button type="submit" variant="secondary" size="sm">Save phase</Button>
          									</div>
          								</form>
          								{#if phase.phaseKey !== template.initialState}
          									<form method="POST" action="?/deletePhase" use:enhance class="phase-remove-form">
          										<input type="hidden" name="phaseKey" value={phase.phaseKey} />
          										<Button type="submit" variant="danger" size="sm">Remove phase</Button>
          									</form>
          								{/if}
          							</div>
          						{:else}
          							<div class="record-row">
          								<div>
          									<strong>{phase.label}</strong>
          									<div class="record-meta">
          										<span>{phase.phaseKey}</span><span>Order {phase.displayOrder}</span>
          										{#if phase.editable}<span>Edit</span>{/if}
          										{#if phase.deletable}<span>Delete</span>{/if}
          										{#if phase.revisable}<span>Revise</span>{/if}
          									</div>
          								</div>
          							</div>
          						{/if}
          					{/each}
          				</div>'''
          text = text[:list_start] + replacement + text[list_end:]
          if '\t.phase-editor {' not in text:
              css_marker = '\t.record-list.compact .record-row {'
              css = r'''	.phase-editor {
          		display: grid;
          		grid-template-columns: minmax(0, 1fr) auto;
          		gap: var(--nb-space-3);
          		align-items: end;
          		padding: var(--nb-space-4) 0;
          		border-bottom: 1px solid var(--nb-color-border-subtle);
          	}
          	.phase-edit-form {
          		display: grid;
          		grid-template-columns: minmax(150px, 1fr) minmax(190px, 1.4fr) 92px auto auto;
          		gap: var(--nb-space-2);
          		align-items: end;
          	}
          	.phase-field {
          		display: grid;
          		gap: var(--nb-space-1);
          		font-size: var(--nb-font-size-xs);
          		font-weight: var(--nb-weight-semibold);
          		color: var(--nb-color-text-secondary);
          	}
          	.phase-capabilities,
          	.phase-actions {
          		display: flex;
          		align-items: center;
          		gap: var(--nb-space-2);
          		min-height: 40px;
          	}
          	.phase-capabilities {
          		flex-wrap: wrap;
          	}
          	.phase-actions {
          		justify-content: flex-end;
          	}
          	.phase-remove-form {
          		padding-bottom: 2px;
          	}
          	.initial-phase {
          		white-space: nowrap;
          		font-size: var(--nb-font-size-xs);
          		font-weight: var(--nb-weight-semibold);
          		color: var(--nb-color-text-muted);
          	}
          '''
              if css_marker not in text:
                  raise SystemExit('CSS marker not found')
              text = text.replace(css_marker, css + css_marker, 1)
          media_marker = '\t@media (max-width: 1050px) {'
          if '\t\t.phase-edit-form {' not in text[text.index(media_marker):]:
              responsive = r'''	@media (max-width: 1180px) {
          		.phase-editor {
          			grid-template-columns: 1fr;
          		}
          		.phase-edit-form {
          			grid-template-columns: repeat(2, minmax(0, 1fr));
          		}
          		.phase-actions {
          			justify-content: flex-start;
          		}
          	}
          '''
              text = text.replace(media_marker, responsive + media_marker, 1)
          page.write_text(text)

          test = Path('appv2/src/lib/server/platform/lifecycle-phase-edit.integration.test.ts')
          test.write_text(r'''import { randomUUID } from 'node:crypto';
          import type { ResultSetHeader, RowDataPacket } from 'mysql2/promise';
          import { afterAll, beforeAll, describe, expect, it } from 'vitest';
          import { getPool } from '$lib/server/db/pool';
          import {
          	addLifecycleAccessRule,
          	addLifecyclePhase,
          	addLifecycleRole,
          	addLifecycleTransition,
          	createLifecycleTemplate,
          	getLifecycleTemplate,
          	updateLifecyclePhase
          } from './lifecycle-admin-service';
          import type { EvidenceActor } from './evidence';
          
          type SqlValue = string | number | boolean | Date | null;
          
          let actor: EvidenceActor;
          let organisationId = '';
          let userId = '';
          
          async function insertId(sql: string, values: SqlValue[]): Promise<string> {
          	const [result] = await getPool().execute<ResultSetHeader>(sql, values);
          	return result.insertId.toString();
          }
          
          async function seedAuthority(): Promise<void> {
          	userId = await insertId(
          		`INSERT INTO users (public_id, display_name, status) VALUES (?, ?, 'active')`,
          		[randomUUID(), 'Lifecycle phase editor user']
          	);
          	organisationId = await insertId(
          		`INSERT INTO organisations (public_id, legal_name, default_timezone, default_currency_code, status)
          		 VALUES (?, ?, 'Europe/London', 'GBP', 'active')`,
          		[randomUUID(), 'Lifecycle phase editor organisation']
          	);
          	const memberId = await insertId(
          		`INSERT INTO organisation_members (organisation_id, user_id, public_id, status, joined_at)
          		 VALUES (?, ?, ?, 'active', CURRENT_TIMESTAMP(6))`,
          		[organisationId, userId, randomUUID()]
          	);
          	const roleId = await insertId(
          		`INSERT INTO organisation_roles (organisation_id, public_id, name, is_active)
          		 VALUES (?, ?, ?, 1)`,
          		[organisationId, randomUUID(), 'Lifecycle Administrator']
          	);
          	const [permissions] = await getPool().execute<Array<RowDataPacket & { id: number | string }>>(
          		`SELECT id FROM permissions
          		 WHERE permission_key IN ('lifecycle.view', 'lifecycle.manage', 'lifecycle.publish') AND is_active = 1`
          	);
          	expect(permissions).toHaveLength(3);
          	for (const permission of permissions) {
          		await getPool().execute(
          			`INSERT INTO role_permissions (organisation_id, organisation_role_id, permission_id) VALUES (?, ?, ?)`,
          			[organisationId, roleId, permission.id]
          		);
          	}
          	await getPool().execute(
          		`INSERT INTO member_roles (organisation_id, organisation_member_id, organisation_role_id) VALUES (?, ?, ?)`,
          		[organisationId, memberId, roleId]
          	);
          	actor = { organisationId, userId, memberId };
          }
          
          async function cleanup(): Promise<void> {
          	if (!organisationId) return;
          	const connection = await getPool().getConnection();
          	try {
          		await connection.query('SET FOREIGN_KEY_CHECKS = 0');
          		const [organisationTables] = await connection.query<Array<RowDataPacket & { tableName: string }>>(
          			`SELECT DISTINCT TABLE_NAME AS tableName FROM information_schema.COLUMNS
          			 WHERE TABLE_SCHEMA = DATABASE() AND COLUMN_NAME = 'organisation_id'`
          		);
          		for (const table of organisationTables) {
          			if (!/^[A-Za-z0-9_]+$/.test(table.tableName)) continue;
          			await connection.query(`DELETE FROM \`${table.tableName}\` WHERE organisation_id = ?`, [organisationId]);
          		}
          		const [actingTables] = await connection.query<Array<RowDataPacket & { tableName: string }>>(
          			`SELECT DISTINCT TABLE_NAME AS tableName FROM information_schema.COLUMNS
          			 WHERE TABLE_SCHEMA = DATABASE() AND COLUMN_NAME = 'acting_organisation_id'`
          		);
          		for (const table of actingTables) {
          			if (!/^[A-Za-z0-9_]+$/.test(table.tableName)) continue;
          			await connection.query(`DELETE FROM \`${table.tableName}\` WHERE acting_organisation_id = ?`, [organisationId]);
          		}
          		await connection.query('DELETE FROM organisations WHERE id = ?', [organisationId]);
          		await connection.query('DELETE FROM users WHERE id = ?', [userId]);
          	} finally {
          		await connection.query('SET FOREIGN_KEY_CHECKS = 1');
          		connection.release();
          	}
          }
          
          beforeAll(async () => {
          	await seedAuthority();
          });
          
          afterAll(async () => {
          	await cleanup();
          	await getPool().end();
          });
          
          describe('lifecycle phase editing', () => {
          	it('edits phase identity and capability while preserving transition, access-rule and initial-state references', async () => {
          		const created = await createLifecycleTemplate({
          			actor,
          			templateKey: `phase-edit-${randomUUID().slice(0, 8)}`,
          			name: 'Phase editing lifecycle',
          			description: 'Proves controlled phase editing.',
          			objectType: 'Test.phase-edit',
          			mode: 'advanced'
          		});
          		await addLifecyclePhase({
          			actor,
          			publicId: created.publicId,
          			phaseKey: 'under_review',
          			label: 'Under review',
          			displayOrder: 20,
          			editable: false,
          			deletable: false,
          			revisable: false
          		});
          		await addLifecyclePhase({
          			actor,
          			publicId: created.publicId,
          			phaseKey: 'released',
          			label: 'Released',
          			displayOrder: 30,
          			editable: false,
          			deletable: false,
          			revisable: true
          		});
          		await addLifecycleRole({
          			actor,
          			publicId: created.publicId,
          			roleKey: 'approver',
          			label: 'Approver',
          			description: 'Reviews lifecycle-controlled records.'
          		});
          		await addLifecycleAccessRule({
          			actor,
          			publicId: created.publicId,
          			phaseKey: 'under_review',
          			roleKey: 'approver',
          			permissionKey: 'lifecycle.manage'
          		});
          		await addLifecycleTransition({
          			actor,
          			publicId: created.publicId,
          			fromState: 'draft',
          			toState: 'under_review',
          			label: 'Submit for review',
          			requiresNote: true,
          			requiresTargetReference: false,
          			tone: 'default',
          			requiredPermissionKey: 'lifecycle.manage',
          			workflowKey: 'test.phase-review'
          		});
          
          		await updateLifecyclePhase({
          			actor,
          			publicId: created.publicId,
          			phaseKey: 'under_review',
          			nextPhaseKey: 'in_review',
          			label: 'In review',
          			displayOrder: 25,
          			editable: true,
          			deletable: false,
          			revisable: false
          		});
          
          		let detail = await getLifecycleTemplate(actor, created.publicId);
          		const edited = detail.phases.find((phase) => phase.phaseKey === 'in_review');
          		expect(edited).toMatchObject({ label: 'In review', displayOrder: 25, editable: true });
          		expect(detail.phases.some((phase) => phase.phaseKey === 'under_review')).toBe(false);
          		expect(detail.transitions[0]).toMatchObject({ fromState: 'draft', toState: 'in_review' });
          		expect(detail.accessRules[0]?.phaseKey).toBe('in_review');
          		expect(detail.versionHistory.some((version) => version.changeNote?.includes('renamed to in_review'))).toBe(true);
          
          		await updateLifecyclePhase({
          			actor,
          			publicId: created.publicId,
          			phaseKey: 'draft',
          			nextPhaseKey: 'working_draft',
          			label: 'Working draft',
          			displayOrder: 10,
          			editable: true,
          			deletable: true,
          			revisable: false
          		});
          		detail = await getLifecycleTemplate(actor, created.publicId);
          		expect(detail.initialState).toBe('working_draft');
          		expect(detail.transitions[0]?.fromState).toBe('working_draft');
          	});
          });
          ''')
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Install V2 dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile

      - name: Format changed application files
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/server/platform/lifecycle-admin-service.ts src/lib/server/platform/lifecycle-phase-edit.integration.test.ts 'src/routes/[tenant]/app/(protected)/lifecycle/[template]/+page.server.ts' 'src/routes/[tenant]/app/(protected)/lifecycle/[template]/+page.svelte'

      - name: Lint V2
        working-directory: appv2
        run: pnpm lint

      - name: Type-check V2
        working-directory: appv2
        run: pnpm check

      - name: Run V2 unit tests
        working-directory: appv2
        run: pnpm test:unit

      - name: Apply authoritative migrations
        run: pnpm dlx dbmate@2.34.1 --migrations-dir database/migrations --no-dump-schema up

      - name: Run real-MySQL integration tests
        working-directory: appv2
        run: pnpm test:integration

      - name: Build V2
        working-directory: appv2
        run: pnpm build

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-lifecycle-phase-edit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v2): edit governed lifecycle phases'
          git push origin HEAD:feat/f01-governed-workflow
