name: Apply role definition SoD patch

on:
  push:
    branches:
      - rbac/role-definition-sod

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbac/role-definition-sod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: python3 scripts/apply-role-definition-sod.py
      - name: Format and lint changed files
        working-directory: app
        run: |
          pnpm exec prettier --write src/lib/server/organisations/access-conflict-policy.ts src/lib/server/organisations/organisation-admin-repository.ts src/lib/server/organisations/organisation-admin-service.ts src/lib/server/organisations/access-conflict-policy.integration.test.ts
          pnpm exec eslint src/lib/server/organisations/access-conflict-policy.ts src/lib/server/organisations/organisation-admin-repository.ts src/lib/server/organisations/organisation-admin-service.ts src/lib/server/organisations/access-conflict-policy.integration.test.ts
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/organisations/access-conflict-policy.ts app/src/lib/server/organisations/organisation-admin-repository.ts app/src/lib/server/organisations/organisation-admin-service.ts app/src/lib/server/organisations/access-conflict-policy.integration.test.ts docs/architecture/access-conflict-governance.md
          git diff --cached --check
          git commit -m 'Enforce SoD on access-increasing role definitions'
          git push origin HEAD:rbac/role-definition-sod
