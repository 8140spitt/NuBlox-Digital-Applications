name: Patch Project Progress Precision

on:
  push:
    branches:
      - feat/project-progress-earned-value
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-progress-earned-value

      - name: Apply rounded high-precision EVM ratio calculation
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/src/lib/server/projects/project-progress-service.ts')
          text = path.read_text()
          old = """function ratio(numerator: bigint, denominator: bigint): number | null {
\tif (denominator === 0n) return null;
\treturn Number((numerator * 10_000n) / denominator) / 10_000;
}
"""
          new = """function ratio(numerator: bigint, denominator: bigint): number | null {
\tif (denominator === 0n) return null;
\tconst scale = 1_000_000n;
\tconst rounded = (numerator * scale + denominator / 2n) / denominator;
\treturn Number(rounded) / Number(scale);
}
"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('ratio helper anchor not found')
          PY

      - name: Commit precision correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/projects/project-progress-service.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: round earned-value performance ratios"
            git push origin HEAD:feat/project-progress-earned-value
          fi
