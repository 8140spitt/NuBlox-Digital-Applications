name: UX schema count helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'product/v1-ux-anomaly-refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-ux-anomaly-refinement
      - name: Advance exact schema counts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/database-migration-validation.yml')
          text = path.read_text()
          old_fk = "test \"$fk_count\" = '857'"
          old_check = "test \"$check_count\" = '495'"
          if text.count(old_fk) != 1 or text.count(old_check) != 1:
              raise SystemExit('Expected exact schema count guards were not found once each.')
          text = text.replace(old_fk, "test \"$fk_count\" = '858'", 1)
          text = text.replace(old_check, "test \"$check_count\" = '496'", 1)
          path.write_text(text)
          PY
          rm .github/workflows/ux-schema-count-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Advance CRM link schema validation counts"
          git push origin HEAD:product/v1-ux-anomaly-refinement
