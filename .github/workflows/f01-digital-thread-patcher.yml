name: F01 Digital Thread Patcher

on:
  push:
    branches:
      - feat/f01-digital-thread-closure
    paths:
      - .github/workflows/f01-digital-thread-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-digital-thread-closure
      - name: Apply closure patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Enforce canonical-source integrity at the owner-service boundary.
          replace_once(
              'app/src/lib/server/strategy/performance-foresight-service.ts',
              """\t\t\tif (!kpi || kpi.lifecycle_status !== 'approved')\n\t\t\t\tthrow new RecordNotFoundError('Approved strategy KPI not found.');\n\t\t\tconst sourceDomain = sourceToken(input.sourceDomain, 'Source domain');\n""",
              """\t\t\tif (!kpi || kpi.lifecycle_status !== 'approved')\n\t\t\t\tthrow new RecordNotFoundError('Approved strategy KPI not found.');\n\t\t\tif (kpi.source_mode === 'canonical')\n\t\t\t\tthrow new PerformanceForesightValidationError(\n\t\t\t\t\t'Canonical KPI actuals must be refreshed from authoritative source evidence.'\n\t\t\t\t);\n\t\t\tconst sourceDomain = sourceToken(input.sourceDomain, 'Source domain');\n"""
          )

          # Route canonical refresh through the dedicated source-resolution service.
          replace_once(
              'app/src/routes/(app)/strategy/performance/+page.server.ts',
              """import { RecordNotFoundError, TenantAccessError } from '$lib/server/kernel/errors';\nimport {\n\tPerformanceForesightService,\n""",
              """import { RecordNotFoundError, TenantAccessError } from '$lib/server/kernel/errors';\nimport { CanonicalPerformanceObservationService } from '$lib/server/strategy/canonical-performance-observation-service';\nimport {\n\tPerformanceForesightService,\n"""
          )
          replace_once(
              'app/src/routes/(app)/strategy/performance/+page.server.ts',
              """export const actions: Actions = {\n\tcreateKpi: async ({ request, locals }) => {\n""",
              """async function runCanonicalAction(\n\tlocals: App.Locals,\n\tframeworkPublicId: string,\n\toperation: (service: CanonicalPerformanceObservationService, actor: TenantActorContext) => Promise<unknown>\n) {\n\tconst actor = actorFromLocals(locals);\n\tif (!actor) return fail(401, { error: 'Authentication and organisation context are required.' });\n\ttry {\n\t\tawait operation(new CanonicalPerformanceObservationService(getDatabase()), actor);\n\t\tthrow redirect(\n\t\t\t303,\n\t\t\t`/strategy/performance?framework=${encodeURIComponent(frameworkPublicId)}`\n\t\t);\n\t} catch (error) {\n\t\tif (error instanceof PerformanceForesightValidationError)\n\t\t\treturn fail(400, { error: error.message });\n\t\tif (error instanceof TenantAccessError)\n\t\t\treturn fail(403, { error: 'Canonical source access is not permitted.' });\n\t\tif (error instanceof RecordNotFoundError) return fail(404, { error: error.message });\n\t\tthrow error;\n\t}\n}\n\nexport const actions: Actions = {\n\tcreateKpi: async ({ request, locals }) => {\n"""
          )
          replace_once(
              'app/src/routes/(app)/strategy/performance/+page.server.ts',
              """\trecordObservation: async ({ request, locals }) => {\n""",
              """\trefreshCanonicalObservation: async ({ request, locals }) => {\n\t\tconst data = await request.formData();\n\t\tconst frameworkPublicId = text(data, 'frameworkPublicId');\n\t\treturn runCanonicalAction(locals, frameworkPublicId, (service, actor) =>\n\t\t\tservice.record(actor, {\n\t\t\t\tkpiPublicId: text(data, 'kpiPublicId'),\n\t\t\t\tsourcePublicId: text(data, 'sourcePublicId'),\n\t\t\t\tforecastValue: nullableText(data, 'forecastValue'),\n\t\t\t\tcommentary: nullableText(data, 'commentary')\n\t\t\t})\n\t\t);\n\t},\n\trecordObservation: async ({ request, locals }) => {\n"""
          )

          # Make canonical provenance navigable and separate canonical refresh from manual actual entry.
          replace_once(
              'app/src/routes/(app)/strategy/performance/+page.svelte',
              """\tfunction scenarioProjections(id: string) {\n\t\treturn data.scenarioProjections.filter((projection) => projection.strategy_scenario_id === id);\n\t}\n""",
              """\tfunction scenarioProjections(id: string) {\n\t\treturn data.scenarioProjections.filter((projection) => projection.strategy_scenario_id === id);\n\t}\n\n\tfunction canonicalSourceHref(observation: {\n\t\tsource_domain: string | null;\n\t\tsource_record_type: string | null;\n\t\tsource_public_id: string | null;\n\t}) {\n\t\tif (\n\t\t\tobservation.source_domain === 'finance' &&\n\t\t\tobservation.source_record_type === 'accounting_profit_and_loss' &&\n\t\t\tobservation.source_public_id\n\t\t) {\n\t\t\treturn `/finance/accounting/reports?period=${encodeURIComponent(observation.source_public_id)}`;\n\t\t}\n\t\treturn null;\n\t}\n"""
          )
          replace_once(
              'app/src/routes/(app)/strategy/performance/+page.svelte',
              """\t<div><strong>Actual + forecast</strong><span>Manual or canonical evidence</span></div>\n""",
              """\t<div><strong>Actual + forecast</strong><span>Canonical facts or governed manual evidence</span></div>\n"""
          )
          replace_once(
              'app/src/routes/(app)/strategy/performance/+page.svelte',
              """\t\t\t\t\t\t\t\t>{#if observation.source_mode === 'canonical'}<small\n\t\t\t\t\t\t\t\t\t\t>Source: {observation.source_domain}/{observation.source_record_type}/{observation.source_public_id}/{observation.source_measure_key}</small\n\t\t\t\t\t\t\t\t\t>{/if}\n""",
              """\t\t\t\t\t\t\t\t>{#if observation.source_mode === 'canonical'}\n\t\t\t\t\t\t\t\t\t<small\n\t\t\t\t\t\t\t\t\t\t>Source: {observation.source_domain}/{observation.source_record_type}/{observation.source_public_id}/{observation.source_measure_key}</small\n\t\t\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t\t\t{#if canonicalSourceHref(observation)}\n\t\t\t\t\t\t\t\t\t\t<a class=\"source-link\" href={canonicalSourceHref(observation) ?? '#'}>Open canonical source →</a>\n\t\t\t\t\t\t\t\t\t{/if}\n\t\t\t\t\t\t\t\t>{/if}\n"""
          )

          old_form = """\t\t\t<div>\n\t\t\t\t<h2>Record actual & forecast</h2>\n\t\t\t\t<form method=\"POST\" action=\"?/recordObservation\" class=\"form-grid\">\n\t\t\t\t\t<input type=\"hidden\" name=\"frameworkPublicId\" value={data.selectedFramework.public_id} />\n\t\t\t\t\t<label\n\t\t\t\t\t\t>Approved KPI<select name=\"kpiPublicId\" required\n\t\t\t\t\t\t\t>{#each data.kpis.filter((kpi) => kpi.lifecycle_status === 'approved') as kpi}<option\n\t\t\t\t\t\t\t\t\tvalue={kpi.public_id}>{kpi.kpi_code} · {kpi.title}</option\n\t\t\t\t\t\t\t\t>{/each}</select\n\t\t\t\t\t\t></label\n\t\t\t\t\t>\n\t\t\t\t\t<label>Observed date<input type=\"date\" name=\"observedOn\" required /></label>\n\t\t\t\t\t<label>Actual value<input type=\"number\" step=\"any\" name=\"actualValue\" required /></label>\n\t\t\t\t\t<label>Forecast value<input type=\"number\" step=\"any\" name=\"forecastValue\" /></label>\n\t\t\t\t\t<label\n\t\t\t\t\t\t>Source mode<select name=\"sourceMode\"\n\t\t\t\t\t\t\t><option value=\"manual\">Manual evidence</option><option value=\"canonical\"\n\t\t\t\t\t\t\t\t>Canonical source</option\n\t\t\t\t\t\t\t></select\n\t\t\t\t\t\t></label\n\t\t\t\t\t>\n\t\t\t\t\t<label>Source domain<input name=\"sourceDomain\" /></label>\n\t\t\t\t\t<label>Source record type<input name=\"sourceRecordType\" /></label>\n\t\t\t\t\t<label>Source public ID<input name=\"sourcePublicId\" /></label>\n\t\t\t\t\t<label>Source measure key<input name=\"sourceMeasureKey\" /></label>\n\t\t\t\t\t<label class=\"wide\">Commentary<textarea name=\"commentary\" rows=\"3\"></textarea></label>\n\t\t\t\t\t<div class=\"form-actions\"><button type=\"submit\">Record KPI observation</button></div>\n\t\t\t\t</form>\n\t\t\t</div>\n"""
          new_form = """\t\t\t<div>\n\t\t\t\t<h2>Record governed actual & forecast</h2>\n\t\t\t\t{#if data.kpis.some((kpi) => kpi.lifecycle_status === 'approved' && kpi.source_mode === 'manual')}\n\t\t\t\t\t<form method=\"POST\" action=\"?/recordObservation\" class=\"form-grid\">\n\t\t\t\t\t\t<input type=\"hidden\" name=\"frameworkPublicId\" value={data.selectedFramework.public_id} />\n\t\t\t\t\t\t<input type=\"hidden\" name=\"sourceMode\" value=\"manual\" />\n\t\t\t\t\t\t<label\n\t\t\t\t\t\t\t>Manual KPI<select name=\"kpiPublicId\" required\n\t\t\t\t\t\t\t\t>{#each data.kpis.filter((kpi) => kpi.lifecycle_status === 'approved' && kpi.source_mode === 'manual') as kpi}<option\n\t\t\t\t\t\t\t\t\t\tvalue={kpi.public_id}>{kpi.kpi_code} · {kpi.title}</option\n\t\t\t\t\t\t\t\t\t>{/each}</select\n\t\t\t\t\t\t\t></label\n\t\t\t\t\t\t>\n\t\t\t\t\t\t<label>Observed date<input type=\"date\" name=\"observedOn\" required /></label>\n\t\t\t\t\t\t<label>Actual value<input type=\"number\" step=\"any\" name=\"actualValue\" required /></label>\n\t\t\t\t\t\t<label>Forecast value<input type=\"number\" step=\"any\" name=\"forecastValue\" /></label>\n\t\t\t\t\t\t<label class=\"wide\">Commentary<textarea name=\"commentary\" rows=\"3\"></textarea></label>\n\t\t\t\t\t\t<div class=\"form-actions\"><button type=\"submit\">Record manual KPI observation</button></div>\n\t\t\t\t\t</form>\n\t\t\t\t{/if}\n\n\t\t\t\t{#if data.kpis.some((kpi) => kpi.lifecycle_status === 'approved' && kpi.source_mode === 'canonical')}\n\t\t\t\t\t<h3 class=\"compact-top\">Refresh canonical actual</h3>\n\t\t\t\t\t<p class=\"muted\">The actual is calculated from the configured authoritative source. Only forecast and commentary remain management inputs.</p>\n\t\t\t\t\t<form method=\"POST\" action=\"?/refreshCanonicalObservation\" class=\"form-grid\">\n\t\t\t\t\t\t<input type=\"hidden\" name=\"frameworkPublicId\" value={data.selectedFramework.public_id} />\n\t\t\t\t\t\t<label\n\t\t\t\t\t\t\t>Canonical KPI<select name=\"kpiPublicId\" required\n\t\t\t\t\t\t\t\t>{#each data.kpis.filter((kpi) => kpi.lifecycle_status === 'approved' && kpi.source_mode === 'canonical') as kpi}<option\n\t\t\t\t\t\t\t\t\t\tvalue={kpi.public_id}>{kpi.kpi_code} · {kpi.title}</option\n\t\t\t\t\t\t\t\t\t>{/each}</select\n\t\t\t\t\t\t\t></label\n\t\t\t\t\t\t>\n\t\t\t\t\t\t<label>Canonical source period<input name=\"sourcePublicId\" placeholder=\"Accounting period public ID\" required /></label>\n\t\t\t\t\t\t<label>Forecast value<input type=\"number\" step=\"any\" name=\"forecastValue\" /></label>\n\t\t\t\t\t\t<label class=\"wide\">Commentary<textarea name=\"commentary\" rows=\"3\"></textarea></label>\n\t\t\t\t\t\t<div class=\"form-actions\"><button type=\"submit\">Refresh canonical KPI actual</button></div>\n\t\t\t\t\t</form>\n\t\t\t\t{/if}\n\t\t\t</div>\n"""
          replace_once('app/src/routes/(app)/strategy/performance/+page.svelte', old_form, new_form)

          # Add canonical finance facts to the isolated F01 performance browser organisation.
          marker = """\tawait db.execute(\n\t\t`INSERT INTO member_roles (organisation_id, organisation_member_id, organisation_role_id)\n\t\tVALUES (?, ?, ?)`,\n\t\t[performanceOrganisationId, performanceMemberId, performanceRoleId]\n\t);\n"""
          finance_fixture = marker + """\n\tconst performancePeriodPublicId = 'F01-PERF-PERIOD-2027-H1';\n\tconst [performanceYear] = await db.execute(\n\t\t`INSERT INTO accounting_financial_years\n\t\t(organisation_id, public_id, year_code, name, starts_on, ends_on, created_by_member_id)\n\t\tVALUES (?, ?, ?, ?, ?, ?, ?)`,\n\t\t[\n\t\t\tperformanceOrganisationId,\n\t\t\t'F01-PERF-FY-2027',\n\t\t\t'FY27',\n\t\t\t'F01 Performance FY27',\n\t\t\t'2027-01-01',\n\t\t\t'2027-12-31',\n\t\t\tperformanceMemberId\n\t\t]\n\t);\n\tconst performanceYearId = String(performanceYear.insertId);\n\tconst [performancePeriod] = await db.execute(\n\t\t`INSERT INTO accounting_periods\n\t\t(organisation_id, financial_year_id, public_id, period_number, name, starts_on, ends_on, created_by_member_id)\n\t\tVALUES (?, ?, ?, ?, ?, ?, ?, ?)`,\n\t\t[\n\t\t\tperformanceOrganisationId,\n\t\t\tperformanceYearId,\n\t\t\tperformancePeriodPublicId,\n\t\t\t1,\n\t\t\t'H1 2027',\n\t\t\t'2027-01-01',\n\t\t\t'2027-06-30',\n\t\t\tperformanceMemberId\n\t\t]\n\t);\n\n\tasync function performanceAccount(publicId, code, name, type, normalBalance) {\n\t\tconst [result] = await db.execute(\n\t\t\t`INSERT INTO accounting_accounts\n\t\t\t(organisation_id, public_id, account_code, name, account_type, normal_balance, created_by_member_id)\n\t\t\tVALUES (?, ?, ?, ?, ?, ?, ?)`,\n\t\t\t[performanceOrganisationId, publicId, code, name, type, normalBalance, performanceMemberId]\n\t\t);\n\t\treturn String(result.insertId);\n\t}\n\tconst performanceCashId = await performanceAccount('F01-PERF-ACC-CASH', '1000', 'Cash', 'asset', 'debit');\n\tconst performanceRevenueId = await performanceAccount('F01-PERF-ACC-REV', '4000', 'Operating revenue', 'revenue', 'credit');\n\tconst performanceExpenseId = await performanceAccount('F01-PERF-ACC-OPEX', '5000', 'Operating expenditure', 'expense', 'debit');\n\n\tasync function performanceJournal(number, sourceType, sourcePublicId, amount, fingerprint, lines) {\n\t\tconst [journal] = await db.execute(\n\t\t\t`INSERT INTO accounting_journal_entries\n\t\t\t(organisation_id, public_id, journal_number, source_type, source_public_id, source_event_at,\n\t\t\t source_amount, source_fingerprint, accounting_date, currency_code, memo, posted_by_member_id)\n\t\t\tVALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n\t\t\t[\n\t\t\t\tperformanceOrganisationId, randomUUID(), number, sourceType, sourcePublicId,\n\t\t\t\tnew Date('2027-06-30T12:00:00.000Z'), amount, fingerprint, '2027-06-30', 'GBP',\n\t\t\t\t`F01 canonical KPI source ${number}`, performanceMemberId\n\t\t\t]\n\t\t);\n\t\tconst journalId = String(journal.insertId);\n\t\tfor (let index = 0; index < lines.length; index += 1) {\n\t\t\tconst line = lines[index];\n\t\t\tawait db.execute(\n\t\t\t\t`INSERT INTO accounting_journal_lines\n\t\t\t\t(organisation_id, journal_entry_id, accounting_account_id, line_number, description, debit_amount, credit_amount)\n\t\t\t\tVALUES (?, ?, ?, ?, ?, ?, ?)`,\n\t\t\t\t[performanceOrganisationId, journalId, line.accountId, index + 1, line.description, line.debit, line.credit]\n\t\t\t);\n\t\t}\n\t}\n\tawait performanceJournal(\n\t\t'F01-PERF-JRN-001',\n\t\t'invoice_issue',\n\t\t'F01-PERF-REVENUE-SOURCE',\n\t\t'1000000.0000',\n\t\t'a'.repeat(64),\n\t\t[\n\t\t\t{ accountId: performanceCashId, description: 'Canonical cash receipt', debit: '1000000.0000', credit: '0.0000' },\n\t\t\t{ accountId: performanceRevenueId, description: 'Canonical operating revenue', debit: '0.0000', credit: '1000000.0000' }\n\t\t]\n\t);\n\tawait performanceJournal(\n\t\t'F01-PERF-JRN-002',\n\t\t'accounts_payable_invoice_approval',\n\t\t'F01-PERF-EXPENSE-SOURCE',\n\t\t'902500.0000',\n\t\t'b'.repeat(64),\n\t\t[\n\t\t\t{ accountId: performanceExpenseId, description: 'Canonical operating expenditure', debit: '902500.0000', credit: '0.0000' },\n\t\t\t{ accountId: performanceCashId, description: 'Canonical cash outflow', debit: '0.0000', credit: '902500.0000' }\n\t\t]\n\t);\n"""
          replace_once('app/e2e/seed-authenticated-fixture.mjs', marker, finance_fixture)

          # Extend the existing isolated F01 browser journey through plan/resource and canonical finance actuals.
          e2e = Path('app/e2e/strategy-performance-foresight.e2e.ts')
          text = e2e.read_text()
          anchor = """\tawait expect(page.getByText('Approved strategy version')).toBeVisible();\n\n\tawait page.goto('/strategy/performance');\n"""
          planning = """\tawait expect(page.getByText('Approved strategy version')).toBeVisible();\n\n\tawait page.getByRole('link', { name: 'Business planning & operating model →' }).click();\n\tconst createPlan = page.locator('form[action=\"?/createPlan\"]');\n\tawait createPlan.getByLabel('Approved strategy').selectOption({ label: 'PERF-E2E · v1 — 2027–2030 Performance Strategy' });\n\tawait createPlan.getByLabel('Plan code').fill('BP-PERF-E2E');\n\tawait createPlan.getByLabel('Title').fill('2027 Performance Business Plan');\n\tawait createPlan.getByLabel('Period start').fill('2027-01-01');\n\tawait createPlan.getByLabel('Period end').fill('2027-12-31');\n\tawait createPlan.getByLabel('Currency').fill('GBP');\n\tawait createPlan.getByLabel('Planned revenue').fill('1000000');\n\tawait createPlan.getByLabel('Planned operating expenditure').fill('880000');\n\tawait createPlan.getByLabel('Planned capital expenditure').fill('50000');\n\tawait createPlan.getByLabel('Plan narrative').fill('Fund the approved strategy and hold the operating model accountable for margin performance.');\n\tawait createPlan.getByRole('button', { name: 'Create business-plan draft' }).click();\n\n\tawait page.getByText('Add strategic initiative', { exact: true }).click();\n\tconst initiative = page.locator('form[action=\"?/addInitiative\"]');\n\tawait initiative.getByLabel('Strategic objective').selectOption({ label: 'OBJ-PERF-E2E · Improve operating margin' });\n\tawait initiative.getByLabel('Initiative code').fill('INIT-PERF-E2E');\n\tawait initiative.getByLabel('Priority rank').fill('1');\n\tawait initiative.getByLabel('Currency').fill('GBP');\n\tawait initiative.getByLabel('Initiative title').fill('Protect operating margin');\n\tawait initiative.getByLabel('Target outcome').fill('Deliver the approved operating-margin target through controlled enterprise execution.');\n\tawait initiative.getByLabel('Benefit statement').fill('Improved operating margin with traceable financial evidence.');\n\tawait initiative.getByLabel('Start date').fill('2027-01-15');\n\tawait initiative.getByLabel('End date').fill('2027-11-30');\n\tawait initiative.getByLabel('Planned investment').fill('75000');\n\tawait initiative.getByLabel('Planned FTE').fill('6');\n\tawait initiative.getByRole('button', { name: 'Add initiative' }).click();\n\n\tawait page.getByText('Add operating-model component', { exact: true }).click();\n\tconst component = page.locator('form[action=\"?/addComponent\"]');\n\tawait component.getByLabel('Component code').fill('CAP-PERF-E2E');\n\tawait component.getByLabel('Component type').selectOption('business_capability');\n\tawait component.getByLabel('Component title').fill('Margin performance management');\n\tawait component.getByLabel('Current state').fill('Performance is reviewed after the fact.');\n\tawait component.getByLabel('Target state').fill('Canonical finance actuals drive governed KPI variance and action.');\n\tawait component.getByRole('button', { name: 'Add target component' }).click();\n\n\tawait page.getByText('Add business accountability', { exact: true }).click();\n\tconst accountability = page.locator('form[action=\"?/addAccountability\"]');\n\tawait accountability.getByLabel('Accountability').selectOption('accountable');\n\tawait accountability.getByLabel('Business position label').fill('Chief Financial Officer');\n\tawait accountability.getByLabel('Notes').fill('Accountable for strategy-to-finance performance evidence.');\n\tawait accountability.getByRole('button', { name: 'Add accountability' }).click();\n\n\tawait page.getByText('Link initiative to operating model', { exact: true }).click();\n\tconst changeLink = page.locator('form[action=\"?/linkInitiativeComponent\"]');\n\tawait changeLink.getByLabel('Change role').selectOption('transform');\n\tawait changeLink.getByRole('button', { name: 'Link change' }).click();\n\tawait page.getByRole('button', { name: 'Approve plan version 1' }).click();\n\tawait expect(page.getByText('Approved business-plan evidence')).toBeVisible();\n\n\tawait page.goto('/strategy/performance');\n"""
          if anchor not in text:
              raise SystemExit('performance e2e planning anchor not found')
          text = text.replace(anchor, planning, 1)
          text = text.replace("sourceRecordType').fill('accounting_report')", "sourceRecordType').fill('accounting_profit_and_loss')", 1)
          text = text.replace("sourceMeasureKey').fill('operating_margin_percent')", "sourceMeasureKey').fill('period_profit_margin_percent')", 1)
          old_obs = """\tconst observation = page.locator('form[action=\"?/recordObservation\"]');\n\tawait observation\n\t\t.getByLabel('Approved KPI')\n\t\t.selectOption({ label: 'KPI-PERF-E2E · Operating margin' });\n\tawait observation.getByLabel('Observed date').fill('2027-06-30');\n\tawait observation.getByLabel('Actual value').fill('9.75');\n\tawait observation.getByLabel('Forecast value').fill('11.4');\n\tawait observation.getByLabel('Source mode').selectOption('canonical');\n\tawait observation.getByLabel('Source domain').fill('finance');\n\tawait observation.getByLabel('Source record type').fill('accounting_report');\n\tawait observation.getByLabel('Source public ID').fill('E2E-FIN-REPORT-H1');\n\tawait observation.getByLabel('Source measure key').fill('operating_margin_percent');\n\tawait observation.getByLabel('Commentary').fill('Performance improving but below target.');\n\tawait observation.getByRole('button', { name: 'Record KPI observation' }).click();\n\tawait expect(page.getByText('9.75 %')).toBeVisible();\n\tawait expect(page.getByText(/E2E-FIN-REPORT-H1/)).toBeVisible();\n"""
          new_obs = """\tconst observation = page.locator('form[action=\"?/refreshCanonicalObservation\"]');\n\tawait observation\n\t\t.getByLabel('Canonical KPI')\n\t\t.selectOption({ label: 'KPI-PERF-E2E · Operating margin' });\n\tawait observation.getByLabel('Canonical source period').fill('F01-PERF-PERIOD-2027-H1');\n\tawait observation.getByLabel('Forecast value').fill('11.4');\n\tawait observation.getByLabel('Commentary').fill('Canonical finance performance is improving but below target.');\n\tawait observation.getByRole('button', { name: 'Refresh canonical KPI actual' }).click();\n\tawait expect(page.getByText('9.75 %')).toBeVisible();\n\tawait expect(page.getByText(/F01-PERF-PERIOD-2027-H1/)).toBeVisible();\n\tconst sourceLink = page.getByRole('link', { name: 'Open canonical source →' });\n\tawait expect(sourceLink).toHaveAttribute('href', /finance\\/accounting\\/reports\\?period=F01-PERF-PERIOD-2027-H1/);\n\tawait sourceLink.click();\n\tawait expect(page.getByRole('heading', { name: 'Trial balance and financial reports' })).toBeVisible();\n\tawait expect(page.getByText('GBP 97500.0000')).toBeVisible();\n\tawait page.goto('/strategy/performance?framework=' + encodeURIComponent(new URL(page.url()).searchParams.get('framework') ?? ''));\n"""
          if old_obs not in text:
              raise SystemExit('old canonical observation block not found')
          text = text.replace(old_obs, new_obs, 1)
          # Returning from finance with a direct URL cannot infer the framework query, so select the known framework again.
          text = text.replace("await page.goto('/strategy/performance?framework=' + encodeURIComponent(new URL(page.url()).searchParams.get('framework') ?? ''));", "await page.goto('/strategy/performance');\n\tawait page.getByRole('link', { name: /PERF-E2E · v1/ }).click();")
          e2e.write_text(text)

          Path('.github/workflows/f01-digital-thread-patcher.yml').unlink()
          PY
