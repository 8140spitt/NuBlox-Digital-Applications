        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close F01 strategy-to-performance digital thread"
          git push origin HEAD:feat/f01-digital-thread-closure
