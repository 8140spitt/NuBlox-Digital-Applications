name: V2 Application Validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v2-validation.yml'

permissions:
  contents: write

jobs:
  apply-staged-f01-repair:
    name: Apply staged F01 repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Apply staged source repair
        run: python3 scripts/f01-ui-cascade-repair.py

      - name: Format V2
        working-directory: appv2
        run: |
          pnpm install --frozen-lockfile
          pnpm format

      - name: Restore permanent validation workflow and commit repair
        run: |
          git show HEAD^:.github/workflows/v2-validation.yml > .github/workflows/v2-validation.yml
          rm scripts/f01-ui-cascade-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v2): align page spacing and cascade F01 parent deletion'
          git push origin HEAD:main
