name: F05 lifecycle contract repair

on:
  push:
    branches:
      - feat/f05-product-service-innovation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f05-product-service-innovation
      - name: Repair lifecycle contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('app/src/lib/server/product-service/product-service-lifecycle-service.ts')
          text = service.read_text()
          old_import = "import { ProductServiceRepository } from './product-service-repository';\n"
          new_import = old_import + "import { ProductServiceValidationError } from './product-service-service';\n"
          if "from './product-service-service'" not in text:
              text = text.replace(old_import, new_import, 1)
          text = text.replace("export class ProductServiceLifecycleValidationError extends Error {}\nexport const ProductServiceValidationError = ProductServiceLifecycleValidationError;\n", "export { ProductServiceValidationError };\n", 1)
          text = text.replace('ProductServiceLifecycleValidationError', 'ProductServiceValidationError')
          text = text.replace("function date(value?: string | null): string | null {\n\tconst trimmed = value?.trim() ?? '';", "function date(value?: string | Date | null): string | null {\n\tif (value instanceof Date) return value.toISOString().slice(0, 10);\n\tconst trimmed = value?.trim() ?? '';", 1)
          for old, new in [('reviewDate: string;', 'reviewDate: string | Date;'), ('plannedStart?: string | null;', 'plannedStart?: string | Date | null;'), ('plannedFinish?: string | null;', 'plannedFinish?: string | Date | null;'), ('targetLaunchDate: string;', 'targetLaunchDate: string | Date;'), ('targetEndDate: string;', 'targetEndDate: string | Date;')]:
              text = text.replace(old, new)
          service.write_text(text)
          repo = Path('app/src/lib/server/product-service/product-service-repository.ts')
          rtext = repo.read_text()
          if '\n\tasync getWorkspace(organisationId: string)' not in rtext:
              insertion = "\n\n\tasync getWorkspace(organisationId: string) {\n\t\tconst [portfolios, offerings, needs, ideas, businessCases] = await Promise.all([\n\t\t\tthis.listPortfolios(organisationId),\n\t\t\tthis.listOfferings(organisationId),\n\t\t\tthis.listNeeds(organisationId),\n\t\t\tthis.listIdeas(organisationId),\n\t\t\tthis.listBusinessCases(organisationId)\n\t\t]);\n\t\tconst businessCaseIds = businessCases.map((row) => row.id);\n\t\tconst [businessCaseAssumptions, businessCaseScenarios] = await Promise.all([\n\t\t\tthis.listBusinessCaseAssumptions(organisationId, businessCaseIds),\n\t\t\tthis.listBusinessCaseScenarios(organisationId, businessCaseIds)\n\t\t]);\n\t\treturn { portfolios, offerings, needs, ideas, businessCases, businessCaseAssumptions, businessCaseScenarios };\n\t}\n"
              pos = rtext.rfind('\n}')
              if pos < 0:
                  raise SystemExit('ProductServiceRepository closing brace not found')
              rtext = rtext[:pos] + insertion + rtext[pos:]
              repo.write_text(rtext)
          PY
      - name: Commit repair and remove helper workflow
        run: |
          rm .github/workflows/f05-validation-class-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/product-service/product-service-lifecycle-service.ts app/src/lib/server/product-service/product-service-repository.ts .github/workflows/f05-validation-class-fix.yml
          git commit -m 'F05: repair lifecycle compile contracts'
          git push origin HEAD:feat/f05-product-service-innovation
