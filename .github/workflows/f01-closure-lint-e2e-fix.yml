name: F01 Closure Lint and E2E Fix

on:
  push:
    branches: [feat/f01-digital-thread-closure]
    paths: [.github/workflows/f01-closure-lint-e2e-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f01-digital-thread-closure
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app
        run: pnpm install --frozen-lockfile
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fixture = Path('app/e2e/seed-authenticated-fixture.mjs')
          text = fixture.read_text()
          old = "const [performancePeriod] = await db.execute("
          if old not in text:
              raise SystemExit('performancePeriod marker not found')
          fixture.write_text(text.replace(old, 'await db.execute(', 1))

          e2e = Path('app/e2e/strategy-performance-foresight.e2e.ts')
          text = e2e.read_text()
          anchor = """\tawait initiative.getByRole('button', { name: 'Add initiative' }).click();\n\n\tawait page.getByText('Add operating-model component', { exact: true }).click();\n"""
          replacement = """\tawait initiative.getByRole('button', { name: 'Add initiative' }).click();\n\n\tawait page.getByText('Add initiative milestone', { exact: true }).click();\n\tconst milestone = page.locator('form[action=\"?/addMilestone\"]');\n\tawait milestone.getByLabel('Milestone code').fill('MS-PERF-E2E');\n\tawait milestone.getByLabel('Title').fill('Canonical margin performance mobilised');\n\tawait milestone.getByLabel('Target date').fill('2027-06-30');\n\tawait milestone.getByRole('button', { name: 'Add milestone' }).click();\n\tawait expect(page.getByText(/MS-PERF-E2E · Canonical margin performance mobilised/)).toBeVisible();\n\n\tawait page.getByText('Add operating-model component', { exact: true }).click();\n"""
          if anchor not in text:
              raise SystemExit('initiative/component anchor not found')
          e2e.write_text(text.replace(anchor, replacement, 1))

          Path('.github/workflows/f01-closure-lint-e2e-fix.yml').unlink()
          PY
          cd app
          pnpm exec prettier --write e2e/seed-authenticated-fixture.mjs e2e/strategy-performance-foresight.e2e.ts
          cd ..
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix F01 closure lint and planning milestone proof"
          git push origin HEAD:feat/f01-digital-thread-closure
