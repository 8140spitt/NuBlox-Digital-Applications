name: UX anomaly refinement PR helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'product/v1-ux-anomaly-refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-ux-anomaly-refinement

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Run stored refinement patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ux-anomaly-refinement-helper.yml').read_text().splitlines()
          start = source.index('      - name: Apply contextual workflow refinements')
          run_line = next(i for i in range(start, len(source)) if source[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].startswith('      - name: '))
          script_lines = source[run_line + 1:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script_lines) + '\n'
          Path('/tmp/apply-ux-refinement.sh').write_text(script)
          PY
          bash /tmp/apply-ux-refinement.sh

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        working-directory: app
        run: >-
          pnpm exec prettier --write
          src/lib/server/db/generated/database.d.ts
          src/lib/server/crm/crm-repository.ts
          src/lib/server/crm/crm-service.ts
          src/lib/server/projects/project-team-service.ts
          src/lib/server/projects/project-team-administration.integration.test.ts
          src/lib/navigation/app-navigation.ts
          'src/routes/(app)/+layout.svelte'
          'src/routes/(app)/finance/+page.svelte'
          'src/routes/(app)/crm/+page.svelte'
          'src/routes/(app)/crm/[partyPublicId]/+page.server.ts'
          'src/routes/(app)/crm/[partyPublicId]/+page.svelte'
          'src/routes/(app)/crm/opportunities/+page.svelte'
          'src/routes/(app)/commercial/estimates/+page.svelte'
          'src/routes/(app)/projects/[projectPublicId]/+page.server.ts'
          'src/routes/(app)/projects/[projectPublicId]/+page.svelte'
          e2e/authenticated-workspaces.e2e.ts
          e2e/contextual-workspaces.e2e.ts

      - name: Commit refinement and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/ux-anomaly-refinement-helper.yml
          rm -f .github/workflows/ux-anomaly-refinement-pr-helper.yml
          rm -f docs/.ux-anomaly-refinement-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine contextual business workflows"
          git push origin HEAD:product/v1-ux-anomaly-refinement
