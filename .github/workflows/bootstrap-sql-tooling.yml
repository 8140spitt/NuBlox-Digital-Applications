name: Bootstrap SQL Tooling

on:
  push:
    branches:
      - architecture/sql-tooling-baseline
    paths:
      - '.github/workflows/bootstrap-sql-tooling.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/sql-tooling-baseline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install SQL tooling
        working-directory: app
        run: |
          pnpm add kysely@0.29.5 mysql2@3.23.2
          pnpm add -D dbmate@2.34.1 kysely-codegen@0.20.0

      - name: Add database scripts and codegen config
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts['db:migrate'] = 'dbmate --migrations-dir ../database/migrations --no-dump-schema up';
          pkg.scripts['db:status'] = 'dbmate --migrations-dir ../database/migrations --no-dump-schema status';
          pkg.scripts['db:types'] = 'kysely-codegen --config-file .kysely-codegenrc.json';
          fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');
          NODE

          cat > app/.kysely-codegenrc.json <<'JSON'
          {
            "dialect": "mysql",
            "url": "env(DATABASE_URL)",
            "outFile": "./src/lib/server/db/generated/database.d.ts",
            "camelCase": false,
            "numericParser": "string",
            "typeOnlyImports": true,
            "logLevel": "warn"
          }
          JSON

      - name: Build validated schema
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_USER: root
          MYSQL_PASSWORD: nublox_ci
        run: bash database/validation/validate-baseline.sh

      - name: Build Baseline v1 Dbmate migration
        run: |
          mkdir -p database/migrations
          migration='database/migrations/20260815140337_baseline_v1.sql'
          {
            echo '-- NuBlox Database Baseline v1'
            echo '-- Consolidated from validated pre-production schema Packages 001-010.'
            echo '-- MySQL 8.4 / InnoDB / utf8mb4_0900_ai_ci'
            echo '-- migrate:up transaction:false'
            echo
            for file in \
              database/schema/001-platform-kernel.sql \
              database/schema/002-crm-parties.sql \
              database/schema/003-sales-quotes.sql \
              database/schema/004-contracts-finance.sql \
              database/schema/005-procurement.sql \
              database/schema/006-workforce-time-scheduling.sql \
              database/schema/007-project-information-documents.sql \
              database/schema/007-project-information-integrity.sql \
              database/schema/008-site-quality-safety.sql \
              database/schema/008-site-quality-safety-integrity.sql \
              database/schema/009-commercial-cost-control.sql \
              database/schema/010-assets-maintenance.sql
            do
              echo
              echo "-- ===== BEGIN $file ====="
              cat "$file"
              echo "-- ===== END $file ====="
            done
            echo
            echo '-- migrate:down transaction:false'
            echo "SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'NuBlox Baseline v1 is irreversible; rebuild non-production databases instead';"
          } > "$migration"

      - name: Verify Dbmate baseline migration
        working-directory: app
        env:
          DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_dbmate_baseline
        run: |
          pnpm exec dbmate --migrations-dir ../database/migrations --no-dump-schema up
          pnpm exec dbmate --migrations-dir ../database/migrations --no-dump-schema status

      - name: Compare Dbmate structural counts
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          table_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nublox_dbmate_baseline' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations';")
          fk_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='nublox_dbmate_baseline';")
          check_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='nublox_dbmate_baseline' AND constraint_type='CHECK';")
          echo "Dbmate baseline: $table_count tables, $fk_count FKs, $check_count CHECK constraints"
          test "$table_count" = '337'
          test "$fk_count" = '739'
          test "$check_count" = '427'

      - name: Generate Kysely database types
        working-directory: app
        env:
          DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_dbmate_baseline
        run: pnpm exec kysely-codegen --config-file .kysely-codegenrc.json

      - name: Commit bootstrap outputs
        run: |
          git config user.name 'NuBlox Tooling Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add app/package.json app/pnpm-lock.yaml app/.kysely-codegenrc.json app/src/lib/server/db/generated/database.d.ts database/migrations/20260815140337_baseline_v1.sql
          git commit -m 'Bootstrap SQL migration and typed query tooling'
          git push origin HEAD:architecture/sql-tooling-baseline
