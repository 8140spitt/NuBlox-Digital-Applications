name: Temporary V2 Route Formatter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-v2-route-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Format route refactor
        working-directory: appv2
        run: >-
          pnpm exec prettier --write
          src/lib/routing/route-contract.test.ts
          src/lib/routing/route-contract.ts
          'src/routes/[tenant]/app/auth/forgot-password/+page.svelte'
          'src/routes/[tenant]/app/auth/invite/[token]/+page.svelte'
          'src/routes/[tenant]/app/auth/no-access/+page.svelte'
          'src/routes/[tenant]/app/auth/reset-password/+page.svelte'
          'src/routes/[tenant]/app/auth/verify-email/+page.svelte'
          'src/routes/[tenant]/portal/[crmParty]/auth/forgot-password/+page.svelte'
          'src/routes/[tenant]/portal/[crmParty]/auth/no-access/+page.svelte'
          'src/routes/[tenant]/portal/[crmParty]/auth/reset-password/+page.svelte'
          'src/routes/[tenant]/portal/[crmParty]/auth/verify-email/+page.svelte'
          src/routes/+page.svelte
          src/routes/start/+page.svelte
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2
          git diff --cached --quiet && exit 0
          git commit -m "style(v2): format tenant-first routes"
          git push origin main
