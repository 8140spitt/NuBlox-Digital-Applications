name: Temporary V2 F01 Analysis Planning Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-v2-f01-analysis-planning-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Repair validated source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01')
          pattern = re.compile(r'\{#each \[1,\s*2,\s*3,\s*4,\s*5\] as score\}')
          for path in root.rglob('*.svelte'):
              source = path.read_text()
              updated = pattern.sub('{#each [1, 2, 3, 4, 5] as score (score)}', source)
              if updated != source:
                  path.write_text(updated)

          path = Path('appv2/src/lib/server/strategy/analysis-planning-service.ts')
          source = path.read_text()
          marker = "\treturn new Map(rows.map((row) => [row.publicId, row.id.toString()]));\n}\n\nasync function listEvidence"
          replacement = "\treturn new Map(rows.map((row) => [row.publicId, row.id.toString()]));\n}\n\nfunction requireMappedId(ids: Map<string, string>, publicId: string): string {\n\tconst id = ids.get(publicId);\n\tif (!id) {\n\t\tthrow new StrategyValidationError('Linked strategy record is no longer available in this strategy cycle.');\n\t}\n\treturn id;\n}\n\nasync function listEvidence"
          if marker not in source:
              raise SystemExit('Unable to locate linked-record helper insertion point')
          source = source.replace(marker, replacement)
          replacements = {
              'evidenceIds.get(evidencePublicId)': 'requireMappedId(evidenceIds, evidencePublicId)',
              'factorIds.get(factorPublicId)': 'requireMappedId(factorIds, factorPublicId)',
              'assumptionIds.get(assumptionPublicId)': 'requireMappedId(assumptionIds, assumptionPublicId)',
              'optionIds.get(input.optionPublicId)': 'requireMappedId(optionIds, input.optionPublicId)',
              'optionIds.get(optionPublicId)': 'requireMappedId(optionIds, optionPublicId)',
              'themeIds.get(themePublicId)': 'requireMappedId(themeIds, themePublicId)'
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Unable to locate expected expression: {old}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Format V2 source
        working-directory: appv2
        run: pnpm exec prettier --write src
      - name: Lint
        working-directory: appv2
        run: pnpm lint
      - name: Type-check
        working-directory: appv2
        run: pnpm check
      - name: Unit tests
        working-directory: appv2
        run: pnpm test:unit
      - name: Build
        working-directory: appv2
        run: pnpm build
      - name: Commit validated source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/src
          git commit -m "fix(v2): validate F01 analysis planning slice"
          git push origin main
