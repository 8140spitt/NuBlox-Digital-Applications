name: Temporary V2 F01 Analysis Planning Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-v2-f01-analysis-planning-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Repair keyed score controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01')
          pattern = re.compile(r'\{#each \[1,\s*2,\s*3,\s*4,\s*5\] as score\}')
          for path in root.rglob('*.svelte'):
              source = path.read_text()
              updated = pattern.sub('{#each [1, 2, 3, 4, 5] as score (score)}', source)
              if updated != source:
                  path.write_text(updated)
          PY
      - name: Format V2 source
        working-directory: appv2
        run: pnpm exec prettier --write src
      - name: Lint
        working-directory: appv2
        run: pnpm lint
      - name: Type-check
        working-directory: appv2
        run: pnpm check
      - name: Unit tests
        working-directory: appv2
        run: pnpm test:unit
      - name: Build
        working-directory: appv2
        run: pnpm build
      - name: Commit validated source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/src
          git commit -m "fix(v2): validate F01 analysis planning slice"
          git push origin main
