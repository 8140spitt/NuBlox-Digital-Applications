name: Complete System Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.kysely-project-controls-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.kysely-project-controls-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Database, integration, quality, build and browser validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ap-accounting-digital-thread
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply AP candidate eligibility correction and restore workflow
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('app/src/lib/server/finance/accounting-source-service.ts')
          source = source_path.read_text()
          if "import { sql } from 'kysely';" not in source:
              source = source.replace(
                  "import { createHash } from 'node:crypto';\n\n",
                  "import { createHash } from 'node:crypto';\n\nimport { sql } from 'kysely';\n\n",
                  1,
              )

          query_anchor = """\tconst supplierDocuments = await db
\t\t.selectFrom('accounts_payable_documents')
\t\t.select(['public_id as publicId', 'document_type as documentType', 'approved_at as approvedAt'])
\t\t.where('organisation_id', '=', organisationId)
\t\t.where('lifecycle_status', '=', 'approved')
\t\t.where('approved_at', 'is not', null)
\t\t.orderBy('approved_at', 'desc')
\t\t.limit(100)
\t\t.execute();
"""
          query_replacement = """\tconst supplierDocuments = await db
\t\t.selectFrom('accounts_payable_documents')
\t\t.select(['public_id as publicId', 'document_type as documentType', 'approved_at as approvedAt'])
\t\t.where('organisation_id', '=', organisationId)
\t\t.where('lifecycle_status', '=', 'approved')
\t\t.where('approved_at', 'is not', null)
\t\t.where(
\t\t\tsql<boolean>`not exists (
\t\t\t\tselect 1
\t\t\t\tfrom accounting_journal_entries as journal
\t\t\t\tleft join accounting_journal_entry_reversals as reversal
\t\t\t\t\ton reversal.journal_entry_id = journal.id
\t\t\t\t\tand reversal.organisation_id = journal.organisation_id
\t\t\t\twhere journal.organisation_id = ${organisationId}
\t\t\t\t\tand journal.source_public_id = accounts_payable_documents.public_id
\t\t\t\t\tand journal.source_type = case
\t\t\t\t\t\twhen accounts_payable_documents.document_type = 'credit_note'
\t\t\t\t\t\t\tthen 'accounts_payable_credit_note_approval'
\t\t\t\t\t\telse 'accounts_payable_invoice_approval'
\t\t\t\t\tend
\t\t\t\t\tand reversal.journal_entry_id is null
\t\t\t)`
\t\t)
\t\t.orderBy('approved_at', 'desc')
\t\t.limit(100)
\t\t.execute();
"""
          if query_replacement not in source:
              if query_anchor not in source:
                  raise SystemExit('supplier-document query anchor not found')
              source = source.replace(query_anchor, query_replacement, 1)
          source_path.write_text(source)

          test_path = Path('app/src/lib/server/finance/accounts-payable.integration.test.ts')
          test = test_path.read_text()
          marker = 'keeps an older unposted approved AP document visible beyond the 100-row candidate limit'
          if marker not in test:
              regression = r'''

	it('keeps an older unposted approved AP document visible beyond the 100-row candidate limit', async () => {
		const approvalBase = new Date('2026-08-21T10:00:00.000Z').getTime();
		const documents = Array.from({ length: 101 }, (_, index) => ({
			organisation_id: organisationAId,
			public_id: randomUUID(),
			document_type: 'invoice',
			supplier_party_id: supplierPartyId,
			project_id: null,
			purchase_order_id: null,
			supplier_document_number: `AP-SCALE-${index}-${randomUUID().slice(0, 8)}`,
			invoice_date: new Date('2026-08-21T00:00:00.000Z'),
			tax_date: null,
			due_date: null,
			currency_code: 'GBP',
			lifecycle_status: 'approved',
			net_amount: '1.0000',
			tax_amount: '0.0000',
			gross_amount: '1.0000',
			created_by_member_id: makerMemberId,
			submitted_at: new Date(approvalBase + index * 60_000 - 1_000),
			approved_at: new Date(approvalBase + index * 60_000)
		}));
		await db.insertInto('accounts_payable_documents').values(documents).execute();

		const oldestUnposted = documents[0]!;
		await db
			.insertInto('accounting_journal_entries')
			.values(
				documents.slice(1).map((document, index) => ({
					organisation_id: organisationAId,
					public_id: randomUUID(),
					journal_number: `AP-SCALE-JRN-${String(index + 1).padStart(3, '0')}`,
					source_type: 'accounts_payable_invoice_approval',
					source_public_id: document.public_id,
					source_event_at: document.approved_at,
					source_amount: '1.0000',
					source_fingerprint: String(index + 1).padStart(64, '0'),
					accounting_date: new Date('2026-08-21T00:00:00.000Z'),
					currency_code: 'GBP',
					memo: 'Scale regression posted AP source',
					posted_by_member_id: makerMemberId,
					posted_at: document.approved_at
				}))
			)
			.execute();

		const workspace = await new AccountingService(db).getWorkspace(actorMaker);
		expect(
			workspace.candidates.some(
				(candidate) =>
					candidate.sourceType === 'accounts_payable_invoice_approval' &&
					candidate.sourcePublicId === oldestUnposted.public_id
			)
		).toBe(true);
	});
'''
              head, sep, tail = test.rpartition('\n});\n')
              if not sep:
                  raise SystemExit('accounts-payable test closing describe not found')
              test_path.write_text(head + regression + '\n});\n' + tail)
          PY
          cd app
          pnpm exec prettier --write \
            src/lib/server/finance/accounting-source-service.ts \
            src/lib/server/finance/accounts-payable.integration.test.ts
          cd ..
          git fetch origin main
          git checkout origin/main -- .github/workflows/database-migration-validation.yml
          git rm -f .github/workflows/apply-ap-candidate-fix.yml || true
          git config user.name 'NuBlox CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/lib/server/finance/accounting-source-service.ts app/src/lib/server/finance/accounts-payable.integration.test.ts .github/workflows/database-migration-validation.yml
          git commit -m 'Filter posted AP sources before candidate limit'
          git push origin HEAD:feat/ap-accounting-digital-thread

      - name: Audit production dependencies
        working-directory: app
        run: pnpm audit --prod --audit-level moderate

      - name: Run formatting and lint checks
        working-directory: app
        run: pnpm lint

      - name: Apply authoritative migration stream
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:status

      - name: Verify migrated application structure
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          table_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nublox_migration_validation' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations';")
          fk_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='nublox_migration_validation';")
          check_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='nublox_migration_validation' AND constraint_type='CHECK';")
          echo "Migrated application schema: $table_count tables, $fk_count FKs, $check_count CHECK constraints"
          test "$table_count" = '423'
          test "$fk_count" = '995'
          test "$check_count" = '602'

      - name: Regenerate database-derived Kysely types
        working-directory: app
        run: pnpm db:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- app/src/lib/server/db/generated/database.d.ts app/src/lib/server/db/generated/collections.d.ts app/src/lib/server/db/generated/accounting.d.ts app/src/lib/server/db/generated/accounts-payable.d.ts app/src/lib/server/db/generated/project-controls.d.ts

      - name: Run real-MySQL integration suite
        working-directory: app
        run: pnpm test:integration

      - name: Type-check SvelteKit application
        working-directory: app
        run: pnpm check

      - name: Install Chromium for component and browser validation
        working-directory: app
        run: pnpm exec playwright install chromium

      - name: Run unit and component tests
        working-directory: app
        run: pnpm test:unit

      - name: Verify validation leaves no tracked-file drift
        run: git diff --exit-code

      - name: Build production SvelteKit application
        working-directory: app
        run: pnpm build

      - name: Run Playwright browser E2E suite
        working-directory: app
        run: pnpm exec playwright test
