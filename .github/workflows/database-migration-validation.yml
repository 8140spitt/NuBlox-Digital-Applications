name: Slice 3 Formatter Repair

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formatter-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-documents-project-information

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply pinned Prettier to Slice 3 files
        working-directory: app
        run: >-
          pnpm exec prettier --write
          e2e/documents-project-information.e2e.ts
          src/lib/navigation/app-navigation.ts
          src/lib/server/information/information-repository.ts
          src/lib/server/information/information-service.ts
          src/lib/server/information/project-information.integration.test.ts
          'src/routes/(app)/documents/+page.server.ts'
          'src/routes/(app)/documents/+page.svelte'

      - name: Commit mechanical formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "8140spitt"
          git config user.email "56647740+8140spitt@users.noreply.github.com"
          git add app/e2e/documents-project-information.e2e.ts app/src/lib/navigation/app-navigation.ts app/src/lib/server/information app/src/routes/'(app)'/documents
          git commit -m "Format Slice 3 project information activation"
          git push origin HEAD:product/v1-documents-project-information
