name: Complete System Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Remove project plan lint drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-controls-plan-baselines

      - name: Remove unused integration-test variable
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/lib/server/projects/project-plan.integration.test.ts')
          text = path.read_text()
          updated, count = re.subn(r'\brootWbsPublicId\b', '_rootWbsPublicId', text)
          if count not in (0, 2):
              raise SystemExit(f'Expected zero or two replacements, got {count}')
          path.write_text(updated)
          PY

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/projects/project-plan.integration.test.ts
          if git diff --cached --quiet; then
            echo "No lint fix required"
          else
            git commit -m "Remove unused project plan test variable"
            git push origin HEAD:feat/project-controls-plan-baselines
          fi
