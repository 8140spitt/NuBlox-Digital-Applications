name: Complete System Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  refactor-source:
    name: Apply staged CRM collaboration refactor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-person-collaboration-boundary

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Apply staged refactor
        run: |
          python scripts/refactor_crm_person_collaboration.py
          rm scripts/refactor_crm_person_collaboration.py

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Format application source
        working-directory: app
        run: pnpm format

      - name: Commit source refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "refactor: separate CRM parties from project collaborators"
          git push origin HEAD:feat/crm-person-collaboration-boundary
