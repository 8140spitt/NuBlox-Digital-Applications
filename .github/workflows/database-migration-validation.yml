name: Remove merged feature branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature ref
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)" \
            push https://github.com/${GITHUB_REPOSITORY}.git \
            --delete feat/project-resource-loading-capacity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
