name: Slice 3 Teardown Repair

on:
  push:
    branches:
      - product/v1-documents-project-information
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teardown-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-documents-project-information

      - name: Remove unused non-existent teardown tables
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/information/project-information.integration.test.ts')
          text = path.read_text()
          blocks = [
          """\tawait db
\t\t.deleteFrom('project_instruction_links')
\t\t.where('instruction_owner_organisation_id', 'in', organisationIds)
\t\t.execute();
""",
          """\tawait db
\t\t.deleteFrom('project_instruction_recipients')
\t\t.where('instruction_owner_organisation_id', 'in', organisationIds)
\t\t.execute();
""",
          ]
          for block in blocks:
              if block not in text:
                  raise SystemExit(f'Expected cleanup block not found: {block!r}')
              text = text.replace(block, '', 1)
          path.write_text(text)
          PY

      - name: Commit teardown correction
        run: |
          git config user.name "8140spitt"
          git config user.email "56647740+8140spitt@users.noreply.github.com"
          git add app/src/lib/server/information/project-information.integration.test.ts
          git commit -m "Fix Slice 3 integration teardown"
          git push origin HEAD:product/v1-documents-project-information

# Triggered after push activation was installed.
