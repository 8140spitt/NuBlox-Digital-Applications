name: Complete System Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Database, integration, quality, build and browser validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-resource-loading-capacity
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Correct resource permission bootstrap and restore standard workflow
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/lib/server/organisations/bootstrap-service.ts')
          text = path.read_text()

          duplicate = (
              "\t'project.resource.view',\n"
              "\t'project.resource.manage',\n"
              "\t'project.resource.view',\n"
              "\t'project.resource.manage',\n"
          )
          single = "\t'project.resource.view',\n\t'project.resource.manage',\n"
          if duplicate not in text:
              raise SystemExit('duplicate bootstrap resource permission block not found')
          text = text.replace(duplicate, single, 1)

          owner_pattern = re.compile(
              r"(const OWNER_CORE_KEYS = \[.*?'project\.plan\.baseline\.manage',)(.*?\n\] as const;)",
              re.S,
          )
          owner_match = owner_pattern.search(text)
          if not owner_match:
              raise SystemExit('OWNER_CORE_KEYS resource permission anchor not found')
          owner_section = owner_match.group(0)
          if "'project.resource.view'" not in owner_section:
              owner_section = owner_section.replace(
                  "\t'project.plan.baseline.manage',\n",
                  "\t'project.plan.baseline.manage',\n\t'project.resource.view',\n\t'project.resource.manage',\n",
                  1,
              )
              text = text[:owner_match.start()] + owner_section + text[owner_match.end():]

          path.write_text(text)
          PY

          cd app
          pnpm format
          cd ..

          git show HEAD^:.github/workflows/database-migration-validation.yml > .github/workflows/database-migration-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/organisations/bootstrap-service.ts .github/workflows/database-migration-validation.yml
          git commit -m "fix: align resource capacity role bootstrap"
          git push origin HEAD:feat/project-resource-loading-capacity

      - name: Audit production dependencies
        working-directory: app
        run: pnpm audit --prod --audit-level moderate

      - name: Run formatting and lint checks
        working-directory: app
        run: pnpm lint

      - name: Apply authoritative migration stream
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:status

      - name: Verify migrated application structure
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          table_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nublox_migration_validation' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations';")
          fk_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='nublox_migration_validation';")
          check_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='nublox_migration_validation' AND constraint_type='CHECK';")
          echo "Migrated application schema: $table_count tables, $fk_count FKs, $check_count CHECK constraints"
          test "$table_count" = '408'
          test "$fk_count" = '942'
          test "$check_count" = '552'

      - name: Regenerate database-derived Kysely types
        working-directory: app
        run: pnpm db:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- app/src/lib/server/db/generated/database.d.ts app/src/lib/server/db/generated/collections.d.ts app/src/lib/server/db/generated/accounting.d.ts app/src/lib/server/db/generated/accounts-payable.d.ts

      - name: Run real-MySQL integration suite
        working-directory: app
        run: pnpm test:integration

      - name: Type-check SvelteKit application
        working-directory: app
        run: pnpm check

      - name: Install Chromium for component and browser validation
        working-directory: app
        run: pnpm exec playwright install chromium

      - name: Run unit and component tests
        working-directory: app
        run: pnpm test:unit

      - name: Verify validation leaves no tracked-file drift
        run: git diff --exit-code

      - name: Build production SvelteKit application
        working-directory: app
        run: pnpm build

      - name: Run Playwright browser E2E suite
        working-directory: app
        run: pnpm exec playwright test
