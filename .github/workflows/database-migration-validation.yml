name: Complete System Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Finalize project plan generated outputs
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-controls-plan-baselines

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Finalize source wiring
        run: python scripts/finalize-project-plan.py

      - name: Apply authoritative migrations and regenerate types
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:status
          pnpm db:types
          pnpm format

      - name: Capture migrated schema contract
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          table_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nublox_migration_validation' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations';")
          fk_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='nublox_migration_validation';")
          check_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='nublox_migration_validation' AND constraint_type='CHECK';")
          echo "Migrated application schema: $table_count tables, $fk_count FKs, $check_count CHECK constraints"
          test "$table_count" = '407'
          test "$fk_count" = '936'
          test "$check_count" = '549'

      - name: Commit generated and finalized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Finalize project plan generated outputs"
            git push origin HEAD:feat/project-controls-plan-baselines
          fi
