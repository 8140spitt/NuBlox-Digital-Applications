name: Complete System Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.kysely-project-controls-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'

permissions:
  contents: write

jobs:
  format-hotfix:
    name: Apply canonical Prettier formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        working-directory: app
        run: pnpm exec prettier --write e2e/ui-crm-commercial.e2e.ts src/lib/server/crm/crm-opportunity-client-service.ts src/lib/server/crm/crm-private-person-customer.integration.test.ts 'src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.server.ts' 'src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte' 'src/routes/(app)/crm/opportunities/+page.server.ts' 'src/routes/(app)/crm/opportunities/+page.svelte'
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/e2e/ui-crm-commercial.e2e.ts app/src/lib/server/crm/crm-opportunity-client-service.ts app/src/lib/server/crm/crm-private-person-customer.integration.test.ts 'app/src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.server.ts' 'app/src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte' 'app/src/routes/(app)/crm/opportunities/+page.server.ts' 'app/src/routes/(app)/crm/opportunities/+page.svelte'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: apply canonical CRM formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
