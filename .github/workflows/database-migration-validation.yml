name: Complete System Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Database, integration, quality, build and browser validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-portfolio-programme-hierarchy

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Generate canonical hierarchy outputs
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:types
          python - <<'PY'
          from pathlib import Path

          capability_path = Path('src/lib/navigation/capability-registry.ts')
          capability_text = capability_path.read_text()
          old_note = "Projects, schedule and Work Kernel exist; portfolio/programme hierarchy and full project-controls depth are next."
          new_note = "Portfolio/programme/project hierarchy, projects, schedule and Work Kernel are native; WBS, baseline scheduling, resources, risk and full project-controls depth remain."
          if old_note in capability_text:
              capability_path.write_text(capability_text.replace(old_note, new_note))

          page_path = Path('src/routes/(app)/projects/+page.svelte')
          page_text = page_path.read_text()
          component_import = "\timport ProjectHierarchyAssignments from '$lib/components/projects/ProjectHierarchyAssignments.svelte';\n"
          if component_import not in page_text:
              page_text = page_text.replace(
                  '<script lang="ts">\n',
                  '<script lang="ts">\n' + component_import + '\n',
                  1
              )
          marker = '\t{/if}\n</section>\n\n{#if !data.canView}'
          assignment = """\t{/if}\n\n\t{#if data.hierarchy.canManageProgrammes}\n\t\t<ProjectHierarchyAssignments\n\t\t\tprojects={data.projects}\n\t\t\tprogrammes={data.hierarchy.programmes}\n\t\t\t{form}\n\t\t/>\n\t{/if}\n</section>\n\n{#if !data.canView}"""
          if 'ProjectHierarchyAssignments\n' not in page_text.split('</script>', 1)[1]:
              if marker not in page_text:
                  raise SystemExit('Expected project hierarchy insertion marker not found')
              page_text = page_text.replace(marker, assignment, 1)
          page_path.write_text(page_text)

          bootstrap_path = Path('src/lib/server/organisations/bootstrap-service.ts')
          bootstrap_text = bootstrap_path.read_text()
          core_marker = "\t'project.manage',\n\t'project.lifecycle.manage',"
          core_replacement = "\t'project.manage',\n\t'project.portfolio.view',\n\t'project.portfolio.manage',\n\t'project.programme.view',\n\t'project.programme.manage',\n\t'project.lifecycle.manage',"
          if bootstrap_text.count(core_marker) == 2:
              bootstrap_text = bootstrap_text.replace(core_marker, core_replacement)
          elif bootstrap_text.count("\t'project.portfolio.manage',") != 2:
              raise SystemExit('Expected bootstrap project-core markers not found')

          manager_marker = "\t\t\t'project.create',\n\t\t\t'project.view',\n\t\t\t'project.lifecycle.manage',"
          manager_replacement = "\t\t\t'project.create',\n\t\t\t'project.view',\n\t\t\t'project.portfolio.view',\n\t\t\t'project.portfolio.manage',\n\t\t\t'project.programme.view',\n\t\t\t'project.programme.manage',\n\t\t\t'project.lifecycle.manage',"
          if manager_marker in bootstrap_text:
              bootstrap_text = bootstrap_text.replace(manager_marker, manager_replacement, 1)

          finance_marker = "\t\t\t'project.view',\n\t\t\t'crm.view',\n\t\t\t'commercial.view',"
          finance_replacement = "\t\t\t'project.view',\n\t\t\t'project.portfolio.view',\n\t\t\t'project.programme.view',\n\t\t\t'crm.view',\n\t\t\t'commercial.view',"
          if finance_marker in bootstrap_text:
              bootstrap_text = bootstrap_text.replace(finance_marker, finance_replacement, 1)

          member_read_marker = "permissionKeys: ['project.view', 'crm.view']"
          member_read_replacement = "permissionKeys: ['project.view', 'project.portfolio.view', 'project.programme.view', 'crm.view']"
          count = bootstrap_text.count(member_read_marker)
          if count == 2:
              bootstrap_text = bootstrap_text.replace(member_read_marker, member_read_replacement)
          elif bootstrap_text.count("'project.programme.view', 'crm.view'") < 2:
              raise SystemExit('Expected Member/Professional and Read Only role markers not found')
          bootstrap_path.write_text(bootstrap_text)

          service_path = Path('src/lib/server/projects/project-hierarchy-service.ts')
          service_text = service_path.read_text()
          service_text = service_text.replace(
              "import { ensureProjectHierarchyStandardRoleDefaults } from './project-hierarchy-role-defaults';\n",
              ''
          )
          service_text = service_text.replace(
              '\t\tawait ensureProjectHierarchyStandardRoleDefaults(this.db, actor.organisationId);\n',
              ''
          )
          service_path.write_text(service_text)

          defaults_path = Path('src/lib/server/projects/project-hierarchy-role-defaults.ts')
          if defaults_path.exists():
              defaults_path.unlink()
          PY
          pnpm format

      - name: Commit canonical hierarchy outputs
        run: |
          if ! git diff --quiet -- app; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app
            git commit -m "Generate hierarchy types and formatting"
            git push origin HEAD:feat/project-portfolio-programme-hierarchy
          fi

      - name: Audit production dependencies
        working-directory: app
        run: pnpm audit --prod --audit-level moderate

      - name: Run formatting and lint checks
        working-directory: app
        run: pnpm lint

      - name: Apply authoritative migration stream
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:status

      - name: Verify migrated application structure
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          table_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nublox_migration_validation' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations';")
          fk_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='nublox_migration_validation';")
          check_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='nublox_migration_validation' AND constraint_type='CHECK';")
          echo "Migrated application schema: $table_count tables, $fk_count FKs, $check_count CHECK constraints"
          test "$table_count" = '401'
          test "$fk_count" = '911'
          test "$check_count" = '534'

      - name: Regenerate database-derived Kysely types
        working-directory: app
        run: pnpm db:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- app/src/lib/server/db/generated/database.d.ts app/src/lib/server/db/generated/collections.d.ts app/src/lib/server/db/generated/accounting.d.ts app/src/lib/server/db/generated/accounts-payable.d.ts

      - name: Run real-MySQL integration suite
        working-directory: app
        run: pnpm test:integration

      - name: Type-check SvelteKit application
        working-directory: app
        run: pnpm check

      - name: Install Chromium for component and browser validation
        working-directory: app
        run: pnpm exec playwright install chromium

      - name: Run unit and component tests
        working-directory: app
        run: pnpm test:unit

      - name: Verify validation leaves no tracked-file drift
        run: git diff --exit-code

      - name: Build production SvelteKit application
        working-directory: app
        run: pnpm build

      - name: Run Playwright browser E2E suite
        working-directory: app
        run: pnpm exec playwright test
