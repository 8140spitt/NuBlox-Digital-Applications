name: Slice 2 Lint Repair

on:
  pull_request:
    paths:
      - 'app/src/lib/server/workforce/workforce-time-scheduling.integration.test.ts'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove unused integration fixture state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/workforce/workforce-time-scheduling.integration.test.ts')
          text = path.read_text()
          for old in ["let projectId = '';\n", "\t\tprojectId = project.id;\n"]:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old!r}')
              text = text.replace(old, '')
          path.write_text(text)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/server/workforce/workforce-time-scheduling.integration.test.ts
          git commit -m 'Remove unused workforce test fixture state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
