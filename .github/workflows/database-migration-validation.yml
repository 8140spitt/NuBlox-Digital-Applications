name: Complete System Validation

on:
  pull_request:
    paths:
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-svelte-fix:
    name: Apply final Svelte writable derived fix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-controlled-change
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply writable derived fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte')
          text = path.read_text()
          old = "\tlet customerPartyPublicId = $state('');\n\t$effect(() => {\n\t\tcustomerPartyPublicId = data.opportunity.primaryPartyPublicId ?? '';\n\t});"
          new = "\tlet customerPartyPublicId = $derived(data.opportunity.primaryPartyPublicId ?? '');"
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply canonical formatting
        working-directory: app
        run: pnpm exec prettier --write 'src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte'

      - name: Verify lint and type safety
        working-directory: app
        run: |
          pnpm lint
          pnpm check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(crm): use writable derived opportunity customer state"
          git push origin HEAD:feat/project-controlled-change
