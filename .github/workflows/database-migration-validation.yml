name: Slice 3 Browser Diagnostic

on:
  pull_request:
    paths:
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostic:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-documents-project-information

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Prepare focused browser diagnostic
        working-directory: app
        run: |
          pnpm install --frozen-lockfile >/dev/null
          pnpm db:migrate >/dev/null
          pnpm exec playwright install chromium >/dev/null

      - name: Run changed browser specs with concise failure tail
        working-directory: app
        run: |
          set +e
          pnpm exec playwright test \
            e2e/documents-project-information.e2e.ts \
            e2e/authenticated-workspaces.e2e.ts \
            e2e/ui-permissions.e2e.ts \
            e2e/system-route-smoke.e2e.ts \
            --workers=1 --reporter=line > /tmp/playwright.log 2>&1
          code=$?
          tail -n 220 /tmp/playwright.log
          exit "$code"
