name: Complete System Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'app/**'
      - 'docs/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Database, integration, quality, build and browser validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-financial-control

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Prepare project financial-control outputs
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # Project-context navigation: keep Financials inside the project workspace.
          path = Path('app/src/lib/navigation/app-navigation.ts')
          text = path.read_text()
          anchor = "\tif (hasAnyNamespace(allowed, ['project.resource.']))\n\t\tlinks.push({ id: 'resources', label: 'Resources', href: `${projectRoot}/resources` });\n"
          addition = anchor + "\tif (hasAnyNamespace(allowed, ['commercial.forecast.', 'commercial.cash_flow.', 'commercial.cost_control.', 'commercial.budget.']))\n\t\tlinks.push({ id: 'financials', label: 'Financials', href: `${projectRoot}/financials` });\n"
          if "id: 'financials'" not in text:
              if anchor not in text:
                  raise SystemExit('project Financials navigation anchor not found')
              text = text.replace(anchor, addition, 1)
          path.write_text(text)

          # Capability evidence: project controls now includes governed financial control.
          path = Path('app/src/lib/navigation/capability-registry.ts')
          text = path.read_text()
          old = "Portfolio/programme/project hierarchy, WBS, activities, milestones, dependency logic, schedule baselines, resource loading/capacity, projects and Work Kernel are native; risk, earned value and deeper project-controls integration remain."
          new = "Portfolio/programme/project hierarchy, WBS, activities, milestones, dependency logic, schedule baselines, resource loading/capacity, governed project financial control/EAC/cash flow, projects and Work Kernel are native; risk, earned value and controlled cross-domain change remain."
          if old in text:
              text = text.replace(old, new, 1)
          old = "Project budgets/cost control and financial reporting foundations exist; treasury, consolidation and planning depth remain."
          new = "Project budgets/cost control, versioned EAC forecasts, forecast cash flow and financial reporting foundations are native; treasury, consolidation and enterprise-planning depth remain."
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              "permissionNamespaces: ['commercial.cost_control.', 'commercial.budget.', 'finance.accounting.'],",
              "permissionNamespaces: ['commercial.cost_control.', 'commercial.budget.', 'commercial.forecast.', 'commercial.cash_flow.', 'finance.accounting.'],",
              1,
          )
          path.write_text(text)

          # Fresh-organisation role bootstrap must match migration defaults.
          path = Path('app/src/lib/server/organisations/bootstrap-service.ts')
          text = path.read_text()
          forecast_all = (
              "\t'commercial.forecast.view',\n"
              "\t'commercial.forecast.manage',\n"
              "\t'commercial.forecast.approve',\n"
              "\t'commercial.cash_flow.manage',\n"
          )
          if text.count("'commercial.forecast.view'") == 0:
              anchor = "\t'commercial.quotation.response.record',\n\t'contract.view',"
              replacement = "\t'commercial.quotation.response.record',\n" + forecast_all + "\t'contract.view',"
              if text.count(anchor) != 2:
                  raise SystemExit(f'expected two bootstrap/owner commercial anchors, found {text.count(anchor)}')
              text = text.replace(anchor, replacement, 2)

              manager_pattern = re.compile(r"(name: 'Manager'.*?permissionKeys: \[)(.*?)(\n\t\t\])", re.S)
              match = manager_pattern.search(text)
              if not match:
                  raise SystemExit('Manager role block not found')
              body = match.group(2)
              body += "\n\t\t\t'commercial.forecast.view',\n\t\t\t'commercial.forecast.manage',\n\t\t\t'commercial.forecast.approve',\n\t\t\t'commercial.cash_flow.manage',"
              text = text[:match.start(2)] + body + text[match.end(2):]

              finance_pattern = re.compile(r"(name: 'Finance/Commercial'.*?permissionKeys: \[)(.*?)(\n\t\t\])", re.S)
              match = finance_pattern.search(text)
              if not match:
                  raise SystemExit('Finance/Commercial role block not found')
              body = match.group(2)
              body += "\n\t\t\t'commercial.forecast.view',\n\t\t\t'commercial.forecast.manage',\n\t\t\t'commercial.cash_flow.manage',"
              text = text[:match.start(2)] + body + text[match.end(2):]

              readonly_pattern = re.compile(r"(name: 'Read Only'.*?permissionKeys: \[)(.*?)(\n\t\t\])", re.S)
              match = readonly_pattern.search(text)
              if not match:
                  raise SystemExit('Read Only role block not found')
              body = match.group(2)
              body += "\n\t\t\t'commercial.forecast.view',"
              text = text[:match.start(2)] + body + text[match.end(2):]
          path.write_text(text)

          # Remove private helper that is no longer required by the final service.
          path = Path('app/src/lib/server/commercial/project-financial-control-service.ts')
          text = path.read_text()
          text = text.replace(
              "\nfunction nextDay(value: Date): Date {\n\treturn new Date(value.getTime() + DAY_MS);\n}\n",
              "\n",
          )
          text = text.replace("const DAY_MS = 86_400_000;\n", "")
          path.write_text(text)
          PY

          cd app
          pnpm db:migrate
          pnpm db:types
          pnpm format
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app database docs
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate project financial control outputs"
            git push origin HEAD:feat/project-financial-control
          fi
