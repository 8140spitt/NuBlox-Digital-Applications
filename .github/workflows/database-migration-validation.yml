name: Complete System Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-typecheck:
    name: Fix CRM collaboration typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-person-collaboration-boundary

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Apply deterministic correction
        run: |
          python scripts/fix_crm_collaboration_typecheck.py
          rm scripts/fix_crm_collaboration_typecheck.py

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Canonical format
        working-directory: app
        run: pnpm exec prettier --write 'src/routes/(app)/projects/[projectPublicId]/+page.server.ts' 'src/routes/(app)/crm/[partyPublicId]/+page.svelte'

      - name: Verify Svelte and TypeScript diagnostics
        working-directory: app
        run: pnpm check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts
          git commit -m "fix: type external project collaboration workspace"
          git push origin HEAD:feat/crm-person-collaboration-boundary
