name: Complete System Validation

on:
  pull_request:
    paths:
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-fixes:
    name: Apply final project change type fixes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-controlled-change
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply type and reactivity fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('app/src/lib/server/projects/project-change-service.ts')
          text = service.read_text()
          old = "export type ProjectChangeWorkspace = {\n\tproject: ProjectRecord;\n\tchangeTypes:"
          new = "export type ProjectChangeWorkspace = {\n\tproject: ProjectRecord;\n\tdefaultCurrencyCode: string;\n\tchangeTypes:"
          assert old in text
          text = text.replace(old, new, 1)
          old = "\t\tconst [\n\t\t\ttypes,\n\t\t\tchangeRows,"
          new = "\t\tconst [\n\t\t\torganisation,\n\t\t\ttypes,\n\t\t\tchangeRows,"
          assert old in text
          text = text.replace(old, new, 1)
          old = "\t\t] = await Promise.all([\n\t\t\tthis.db\n\t\t\t\t.selectFrom('project_change_event_types')"
          new = "\t\t] = await Promise.all([\n\t\t\tthis.db\n\t\t\t\t.selectFrom('organisations')\n\t\t\t\t.select('default_currency_code')\n\t\t\t\t.where('id', '=', actor.organisationId)\n\t\t\t\t.where('status', '=', 'active')\n\t\t\t\t.executeTakeFirstOrThrow(),\n\t\t\tthis.db\n\t\t\t\t.selectFrom('project_change_event_types')"
          assert old in text
          text = text.replace(old, new, 1)
          old = "\t\treturn {\n\t\t\tproject,\n\t\t\tchangeTypes: types,"
          new = "\t\treturn {\n\t\t\tproject,\n\t\t\tdefaultCurrencyCode: organisation.default_currency_code,\n\t\t\tchangeTypes: types,"
          assert old in text
          text = text.replace(old, new, 1)
          service.write_text(text)

          change_page = Path('app/src/routes/(app)/projects/[projectPublicId]/changes/+page.svelte')
          text = change_page.read_text()
          old = "value={selectedChange.latestAssessment?.currencyCode ??\n\t\t\t\t\t\t\t\t\t\t\tdata.project.currencyCode ??\n\t\t\t\t\t\t\t\t\t\t\t'GBP'}"
          new = "value={selectedChange.latestAssessment?.currencyCode ?? data.defaultCurrencyCode}"
          assert old in text
          text = text.replace(old, new, 1)
          change_page.write_text(text)

          opportunity_page = Path('app/src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte')
          text = opportunity_page.read_text()
          old = "\tlet customerPartyPublicId = $state(data.opportunity.primaryPartyPublicId ?? '');\n\tlet selectedCustomer = $derived("
          new = "\tlet customerPartyPublicId = $state('');\n\t$effect(() => {\n\t\tcustomerPartyPublicId = data.opportunity.primaryPartyPublicId ?? '';\n\t});\n\tlet selectedCustomer = $derived("
          assert old in text
          text = text.replace(old, new, 1)
          old = "\tconst currentClientContactPublicId =\n\t\tdata.participants.find((participant) => participant.roleCode === 'client_contact')\n\t\t\t?.partyPublicId ?? '';"
          new = "\tlet currentClientContactPublicId = $derived(\n\t\tdata.participants.find((participant) => participant.roleCode === 'client_contact')\n\t\t\t?.partyPublicId ?? ''\n\t);"
          assert old in text
          text = text.replace(old, new, 1)
          opportunity_page.write_text(text)
          PY

      - name: Apply canonical formatting
        working-directory: app
        run: pnpm exec prettier --write src/lib/server/projects/project-change-service.ts 'src/routes/(app)/projects/[projectPublicId]/changes/+page.svelte' 'src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte'

      - name: Verify type safety
        working-directory: app
        run: pnpm check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/projects/project-change-service.ts 'app/src/routes/(app)/projects/[projectPublicId]/changes/+page.svelte' 'app/src/routes/(app)/crm/opportunities/[opportunityPublicId]/+page.svelte'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(projects): resolve change workspace type boundary"
          git push origin HEAD:feat/project-controlled-change
