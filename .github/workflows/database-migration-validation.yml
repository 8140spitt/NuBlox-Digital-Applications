name: Slice 4 Formatting

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-slice4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v1-procurement-commercial-control

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Wire valuations into Commercial navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/lib/navigation/app-navigation.ts')
          text = path.read_text()
          valuation_href = "href: '/commercial/valuations'"
          if valuation_href not in text:
              needle = """\t\t\t\t\t{\n\t\t\t\t\t\tid: 'project-cost-control',\n\t\t\t\t\t\tlabel: 'Project cost control',\n\t\t\t\t\t\thref: '/commercial/cost-control',\n\t\t\t\t\t\tanyPermissionNamespaces: ['commercial.cost_control.', 'commercial.cost_code.', 'commercial.budget.', 'commercial.variation.']\n\t\t\t\t\t}\n"""
              replacement = needle[:-2] + ",\n" + """\t\t\t\t\t{\n\t\t\t\t\t\tid: 'commercial-valuations',\n\t\t\t\t\t\tlabel: 'Valuations',\n\t\t\t\t\t\thref: '/commercial/valuations',\n\t\t\t\t\t\tanyPermissionNamespaces: ['commercial.valuation.']\n\t\t\t\t\t}\n"""
              if needle not in text:
                  raise SystemExit('Project cost-control navigation block was not found exactly once.')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY

      - name: Format Slice 4 delta with repository Prettier
        working-directory: app
        run: |
          pnpm exec prettier --write \
            src/lib/server/procurement \
            src/lib/server/commercial \
            src/lib/navigation/app-navigation.ts \
            'src/routes/(auth)/start/+page.server.ts' \
            src/lib/server/auth/better-auth.ts \
            'src/routes/(app)/purchasing' \
            'src/routes/(app)/commercial/cost-control' \
            'src/routes/(app)/commercial/valuations' \
            e2e/authenticated-workspaces.e2e.ts \
            e2e/ui-permissions.e2e.ts \
            e2e/system-route-smoke.e2e.ts \
            e2e/procurement-commercial-control.e2e.ts \
            e2e/seed-procurement-commercial-fixture.mjs \
            e2e/global-setup.mjs

      - name: Commit formatted Slice 4 files
        run: |
          if git diff --quiet; then
            echo 'No formatting or navigation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Format Slice 4 and wire valuation navigation'
          git push origin HEAD:product/v1-procurement-commercial-control
