name: Complete System Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Fix project plan integration cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-controls-plan-baselines

      - name: Detach WBS parents before fixture deletion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/projects/project-plan.integration.test.ts')
          text = path.read_text()
          old = "\t\tawait db.deleteFrom('project_plan_activities').where('project_id', 'in', projectIds).execute();\n\t\tawait db.deleteFrom('project_wbs_nodes').where('project_id', 'in', projectIds).execute();"
          new = "\t\tawait db.deleteFrom('project_plan_activities').where('project_id', 'in', projectIds).execute();\n\t\tawait db\n\t\t\t.updateTable('project_wbs_nodes')\n\t\t\t.set({ parent_wbs_node_id: null })\n\t\t\t.where('project_id', 'in', projectIds)\n\t\t\t.execute();\n\t\tawait db.deleteFrom('project_wbs_nodes').where('project_id', 'in', projectIds).execute();"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one cleanup anchor, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit cleanup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/projects/project-plan.integration.test.ts
          git commit -m "Fix project plan integration cleanup"
          git push origin HEAD:feat/project-controls-plan-baselines
