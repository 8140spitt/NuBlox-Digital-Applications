name: Complete System Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-followups:
    name: Apply CRM collaboration follow-up corrections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-person-collaboration-boundary

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Apply corrections
        run: |
          python scripts/fix_crm_person_collaboration_followups.py
          rm scripts/fix_crm_person_collaboration_followups.py

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        working-directory: app
        run: pnpm format

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app database scripts
          git commit -m "fix: separate project organisation and CRM collaborator tests"
          git push origin HEAD:feat/crm-person-collaboration-boundary
