name: Complete System Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.kysely-accounts-payable-codegenrc.json'
      - 'app/.kysely-project-controls-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-regenerate:
    name: Format slice and regenerate database types
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-controlled-change
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply authoritative migration stream
        working-directory: app
        run: pnpm db:migrate

      - name: Apply canonical Prettier formatting
        working-directory: app
        run: pnpm exec prettier --write e2e/project-change.e2e.ts src/lib/server/projects/project-change-service.ts src/lib/server/projects/project-change.integration.test.ts 'src/routes/(app)/projects/[projectPublicId]/changes/+page.server.ts' 'src/routes/(app)/projects/[projectPublicId]/changes/+page.svelte'

      - name: Regenerate database-derived Kysely types
        working-directory: app
        run: pnpm db:types

      - name: Commit canonical generated output
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/project-change.e2e.ts app/src/lib/server/projects/project-change-service.ts app/src/lib/server/projects/project-change.integration.test.ts 'app/src/routes/(app)/projects/[projectPublicId]/changes/+page.server.ts' 'app/src/routes/(app)/projects/[projectPublicId]/changes/+page.svelte' app/src/lib/server/db/generated/database.d.ts app/src/lib/server/db/generated/collections.d.ts app/src/lib/server/db/generated/accounting.d.ts app/src/lib/server/db/generated/accounts-payable.d.ts app/src/lib/server/db/generated/project-controls.d.ts
          git commit -m "chore(projects): format change control and regenerate types"
          git push origin HEAD:feat/project-controlled-change
