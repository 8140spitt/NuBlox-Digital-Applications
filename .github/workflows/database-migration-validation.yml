name: Complete System Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/.kysely-codegenrc.json'
      - 'app/.kysely-collections-codegenrc.json'
      - 'app/.kysely-accounting-codegenrc.json'
      - 'app/.prettierignore'
      - 'app/eslint.config.js'
      - 'app/playwright.config.ts'
      - 'app/prettier.config.js'
      - 'app/vite.config.ts'
      - 'app/vitest.integration.config.ts'
      - 'app/e2e/**'
      - 'app/src/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-system-validation:
    name: Database, integration, quality, build and browser validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nublox_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pnublox_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_URL: mysql://root:nublox_ci@127.0.0.1:3306/nublox_migration_validation
      DB_POOL_MAX: '5'
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:4173
      EMAIL_DELIVERY_MODE: console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/complete-system-e2e

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply concrete quality repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))

          replace(
              'app/src/lib/server/commercial/commercial-service.ts',
              """\nfunction percentage(value: string | null | undefined, label: string): string {\n\tconst text = value?.trim() || '0';\n\tconst parsed = decimal(text, 3, 4, label);\n\tif (\n\t\tcompareMoney(\n\t\t\t`${parsed.includes('.') ? parsed : `${parsed}.0`}`.padEnd(\n\t\t\t\tparsed.includes('.') ? parsed.length : parsed.length + 2,\n\t\t\t\t'0'\n\t\t\t),\n\t\t\t'100.0000'\n\t\t) > 0\n\t) {\n\t\t// compareMoney is a money-scale comparison; the preceding normalisation is only\n\t\t// used to guard the common 0..100 percentage range without binary floats.\n\t\tthrow new CommercialValidationError(`${label} must not exceed 100%.`);\n\t}\n\treturn parsed;\n}\n""",
              ''
          )
          replace('app/src/lib/server/finance/accounting-period-service.ts', '\n\tinsertedId,', '')
          replace("app/src/lib/server/finance/accounting-periods.integration.test.ts", "let journalPublicId = '';\n", '')
          replace(
              'app/src/lib/server/finance/accounting-periods.integration.test.ts',
              '\t\tjournalPublicId = posted.publicId;\n\t\texpect(posted.journalNumber)',
              '\t\texpect(posted.publicId).toBeTruthy();\n\t\texpect(posted.journalNumber)'
          )
          replace(
              'app/src/lib/server/finance/accounting-service.ts',
              "import { formatScaledDecimal, parseScaledDecimal } from '$lib/server/commercial/commercial-decimal';\n",
              ''
          )
          replace(
              'app/src/lib/server/finance/accounting-service.ts',
              """\nfunction money(value: string): bigint {\n\treturn parseScaledDecimal(value, 4, 'Accounting amount', true);\n}\n\nfunction moneyText(value: bigint): string {\n\treturn formatScaledDecimal(value, 4);\n}\n""",
              ''
          )
          replace(
              'app/src/lib/server/finance/accounting-source-service.ts',
              "\t| 'bad_debt_recovery_income';",
              "\t| 'bad_debt_recovery_income'\n\t| 'retained_earnings';"
          )
          replace(
              'app/src/lib/server/finance/accounting-service.ts',
              "\t'bad_debt_recovery_income'\n]);",
              "\t'bad_debt_recovery_income',\n\t'retained_earnings'\n]);"
          )
          replace(
              'app/src/lib/server/finance/accounting-service.ts',
              "\tbad_debt_recovery_income: 'revenue'\n};",
              "\tbad_debt_recovery_income: 'revenue',\n\tretained_earnings: 'equity'\n};"
          )
          replace(
              'app/src/lib/server/finance/accounting-year-end-service.ts',
              """\nfunction abs(value: bigint): bigint {\n\treturn value < 0n ? -value : value;\n}\n""",
              ''
          )
          replace('app/src/lib/server/finance/billing-settings-service.ts', '\n\tinsertedId,', '')
          replace('app/src/lib/server/finance/collections-automation-service.ts', '\n\tinsertedId', '')
          replace(
              'app/src/lib/server/finance/collections-service.ts',
              "import { PermissionService } from '$lib/server/capabilities/permission-service';\n",
              ''
          )
          replace('app/src/lib/server/finance/collections.integration.test.ts', "let secondCustomerPublicId = '';\n", '')
          replace(
              'app/src/lib/server/finance/collections.integration.test.ts',
              '\tsecondCustomerPublicId = secondCustomer.publicId;\n',
              ''
          )
          replace(
              'app/src/lib/server/finance/credit-control.integration.test.ts',
              "import { CreditControlBlockedError, CreditControlService } from './credit-control-service';",
              "import { CreditControlService } from './credit-control-service';"
          )
          replace(
              'app/src/lib/server/finance/invoices.integration.test.ts',
              '\t\tlet draft = await draftService.getWorkspace(actorOwnerA, firstInvoicePublicId);',
              '\t\tconst draft = await draftService.getWorkspace(actorOwnerA, firstInvoicePublicId);'
          )
          replace('app/src/lib/server/finance/payment-allocation.integration.test.ts', "let firstInvoiceDocumentId = '';\n", '')
          replace('app/src/lib/server/finance/payment-allocation.integration.test.ts', "let firstInvoiceItemId = '';\n", '')
          replace('app/src/lib/server/finance/payment-allocation.integration.test.ts', '\tfirstInvoiceDocumentId = first.documentId;\n', '')
          replace('app/src/lib/server/finance/payment-allocation.integration.test.ts', '\tfirstInvoiceItemId = first.itemId;\n', '')
          replace(
              'app/src/lib/server/finance/receivables-control-reporting-service.ts',
              'const DAY_MS = 24 * 60 * 60 * 1000;\n\n',
              ''
          )
          replace(
              'app/src/lib/server/finance/tax-relief-service.ts',
              """import {\n\tactiveRecoveryAmountForWriteOff,\n\tbadDebtInvoiceById,\n\tpaymentIsReversed\n} from './bad-debt-common';""",
              "import { activeRecoveryAmountForWriteOff, badDebtInvoiceById } from './bad-debt-common';"
          )
          replace(
              'app/src/lib/server/finance/tax-relief-service.ts',
              '\t\t\tlet amount = 0n;\n\t\t\tlet vatReturnBox = 0;',
              '\t\t\tlet amount: bigint;\n\t\t\tlet vatReturnBox: number;'
          )
          replace('app/src/lib/server/projects/project-team-service.ts', '\n\ttype ProjectParticipationStatus,', '')
          replace(
              'app/src/routes/(app)/projects/[projectPublicId]/+page.server.ts',
              """\t\tlet removedSelf = false;\n\t\ttry {\n\t\t\t({ removedSelf } = await new ProjectTeamService(getDatabase()).removeMember(actor, {\n\t\t\t\tprojectPublicId: params.projectPublicId,\n\t\t\t\tmemberPublicId\n\t\t\t}));\n\t\t} catch (cause) {\n\t\t\treturn teamFailure(cause, marker);\n\t\t}\n\t\tthrow redirect(\n\t\t\t303,\n\t\t\tremovedSelf ? '/projects' : `/projects/${encodeURIComponent(params.projectPublicId)}`\n\t\t);""",
              """\t\tlet removalResult: { removedSelf: boolean };\n\t\ttry {\n\t\t\tremovalResult = await new ProjectTeamService(getDatabase()).removeMember(actor, {\n\t\t\t\tprojectPublicId: params.projectPublicId,\n\t\t\t\tmemberPublicId\n\t\t\t});\n\t\t} catch (cause) {\n\t\t\treturn teamFailure(cause, marker);\n\t\t}\n\t\tthrow redirect(\n\t\t\t303,\n\t\t\tremovalResult.removedSelf\n\t\t\t\t? '/projects'\n\t\t\t\t: `/projects/${encodeURIComponent(params.projectPublicId)}`\n\t\t);"""
          )
          PY

      - name: Normalize repository formatting
        working-directory: app
        run: pnpm exec prettier --write .

      - name: Commit validation repairs
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- app; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app
            git commit -m 'Resolve complete-system quality defects'
            git push origin HEAD:validation/complete-system-e2e
          fi

      - name: Check committed formatting
        working-directory: app
        run: pnpm exec prettier --check .

      - name: Apply production migration stream
        working-directory: app
        run: |
          pnpm db:migrate
          pnpm db:status

      - name: Verify migrated application structure
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          table_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nublox_migration_validation' AND table_type='BASE TABLE' AND table_name <> 'schema_migrations';")
          fk_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='nublox_migration_validation';")
          check_count=$(docker exec "$MYSQL_CONTAINER_ID" mysql -N -B -uroot -pnublox_ci -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='nublox_migration_validation' AND constraint_type='CHECK';")
          echo "Migrated application schema: $table_count tables, $fk_count FKs, $check_count CHECK constraints"
          test "$table_count" = '384'
          test "$fk_count" = '857'
          test "$check_count" = '495'

      - name: Regenerate database-derived Kysely types
        working-directory: app
        run: pnpm db:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- app/src/lib/server/db/generated/database.d.ts app/src/lib/server/db/generated/collections.d.ts app/src/lib/server/db/generated/accounting.d.ts

      - name: Run real-MySQL integration suite
        working-directory: app
        run: pnpm test:integration

      - name: Type-check SvelteKit application
        working-directory: app
        run: pnpm check

      - name: Install Chromium for component and browser validation
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit and component tests
        working-directory: app
        run: pnpm test:unit -- --run

      - name: Run ESLint
        working-directory: app
        run: pnpm exec eslint .

      - name: Verify tracked files were not mutated by validation
        run: git diff --exit-code

      - name: Build production SvelteKit application
        working-directory: app
        run: pnpm build

      - name: Run Playwright browser E2E suite
        working-directory: app
        run: pnpm exec playwright test
