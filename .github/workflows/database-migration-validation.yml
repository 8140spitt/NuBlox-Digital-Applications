name: Slice 2 Formatter Repair

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/database-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-slice-two:
    name: Apply pinned formatter to Slice 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Repair known parse error and apply exact repository formatter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/lib/server/workforce/workforce-service.ts')
          text = path.read_text()
          old = "\t\t\t\t\t}))\n\t\t\t\t.execute();"
          new = "\t\t\t\t\t}))\n\t\t\t\t)\n\t\t\t\t.execute();"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one schedule-worker insertion parse defect.')
          path.write_text(text.replace(old, new))
          PY
          cd app
          pnpm exec prettier --write \
            e2e/authenticated-workspaces.e2e.ts \
            e2e/seed-authenticated-fixture.mjs \
            e2e/system-route-smoke.e2e.ts \
            e2e/ui-permissions.e2e.ts \
            e2e/workforce-time-schedule.e2e.ts \
            src/lib/navigation/app-navigation.ts \
            src/lib/server/auth/better-auth.ts \
            src/lib/server/workforce/workforce-bootstrap.ts \
            src/lib/server/workforce/workforce-repository.ts \
            src/lib/server/workforce/workforce-service.ts \
            src/lib/server/workforce/workforce-time-scheduling.integration.test.ts \
            'src/routes/(app)/people/+page.server.ts' \
            'src/routes/(app)/people/+page.svelte' \
            'src/routes/(app)/schedule/+page.server.ts' \
            'src/routes/(app)/schedule/+page.svelte' \
            'src/routes/(app)/time/+page.server.ts' \
            'src/routes/(app)/time/+page.svelte' \
            'src/routes/(auth)/start/+page.server.ts'
          cd ..

      - name: Commit formatter-equivalent changes to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if git diff --cached --quiet; then
            echo 'No formatter changes to commit.'
            exit 0
          fi
          git commit -m 'Format Slice 2 implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
