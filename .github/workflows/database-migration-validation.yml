name: Complete System Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-acceptance:
    name: Format CRM collaboration acceptance fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-person-collaboration-boundary

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Format acceptance fixtures
        working-directory: app
        run: |
          pnpm exec prettier --write e2e/seed-external-person-collaboration-fixture.mjs src/lib/server/projects/project-external-collaboration.integration.test.ts

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/e2e/seed-external-person-collaboration-fixture.mjs app/src/lib/server/projects/project-external-collaboration.integration.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: format CRM collaboration acceptance fixtures"
          git push origin HEAD:feat/crm-person-collaboration-boundary
