name: Format Delegated Authority

on:
  push:
    branches:
      - rbac/delegated-access-authority

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbac/delegated-access-authority

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        working-directory: app
        run: pnpm exec prettier --write src/lib/server/organisations/delegated-access-authority-service.ts src/lib/server/organisations/delegated-access-authority.integration.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/server/organisations/delegated-access-authority-service.ts app/src/lib/server/organisations/delegated-access-authority.integration.test.ts
          git commit -m "Format delegated authority implementation"
          git push origin HEAD:rbac/delegated-access-authority
