name: F02 Governance Release Fixes

on:
  push:
    branches:
      - feat/f02-corporate-governance
    paths:
      - .github/workflows/f02-release-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f02-corporate-governance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Apply fail-closed governance fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('app/src/lib/server/governance/governance-service.ts')
          service = service_path.read_text()

          old = '''function amount(value: number | string | null | undefined, label: string): string | null {
          \tif (value === null || value === undefined || value === '') return null;
          \tconst parsed = typeof value === 'number' ? value : Number(value);
          \tif (!Number.isFinite(parsed) || parsed < 0)
          \t\tthrow new GovernanceValidationError(`${label} must be a non-negative number.`);
          \treturn parsed.toFixed(4);
          }'''
          new = '''function amount(value: number | string | null | undefined, label: string): string | null {
          \tif (value === null || value === undefined || value === '') return null;
          \tif (typeof value === 'number' && (!Number.isFinite(value) || !Number.isSafeInteger(value * 10_000))) {
          \t\tthrow new GovernanceValidationError(`${label} must be an exact non-negative amount with at most four decimal places.`);
          \t}
          \tconst raw = String(value).trim();
          \tconst match = /^(\\d{1,15})(?:\\.(\\d{1,4}))?$/.exec(raw);
          \tif (!match)
          \t\tthrow new GovernanceValidationError(
          \t\t\t`${label} must be a non-negative DECIMAL(19,4) amount.`
          \t\t);
          \tconst whole = BigInt(match[1]).toString();
          \tconst fraction = (match[2] ?? '').padEnd(4, '0');
          \treturn `${whole}.${fraction}`;
          }

          function amountUnits(value: string): bigint {
          \tconst [whole, fraction = ''] = value.split('.');
          \treturn BigInt(whole) * 10_000n + BigInt(fraction.padEnd(4, '0'));
          }

          function compareAmounts(left: string, right: string): number {
          \tconst leftUnits = amountUnits(left);
          \tconst rightUnits = amountUnits(right);
          \treturn leftUnits === rightUnits ? 0 : leftUnits < rightUnits ? -1 : 1;
          }

          function membershipEffectiveOn(
          \tmembership: GovernanceBodyMembershipRecord,
          \teffectiveAt: Date
          ): boolean {
          \tconst day = effectiveAt.toISOString().slice(0, 10);
          \treturn (
          \t\tmembership.lifecycle_status === 'active' &&
          \t\tmembership.appointed_on.toISOString().slice(0, 10) <= day &&
          \t\t(!membership.term_ends_on || membership.term_ends_on.toISOString().slice(0, 10) >= day)
          \t);
          }'''
          assert old in service, 'amount helper block not found'
          service = service.replace(old, new, 1)

          old = '''\t\t\tif (!memberId) throw new GovernanceValidationError('Appointee is required.');
          \t\t\tif (await new GovernanceRepository(trx).findActiveBodyMembership(body.id, memberId)) {
          \t\t\t\tthrow new GovernanceValidationError(
          \t\t\t\t\t'This member already has an active appointment to the governance body.'
          \t\t\t\t);
          \t\t\t}
          \t\t\tconst appointedOn = dateOnly(input.appointedOn, 'Appointed on');'''
          new = '''\t\t\tif (!memberId) throw new GovernanceValidationError('Appointee is required.');
          \t\t\tconst appointedOn = dateOnly(input.appointedOn, 'Appointed on');
          \t\t\tif (
          \t\t\t\tawait new GovernanceRepository(trx).findActiveBodyMembership(body.id, memberId, appointedOn)
          \t\t\t) {
          \t\t\t\tthrow new GovernanceValidationError(
          \t\t\t\t\t'This member already has an active appointment to the governance body.'
          \t\t\t\t);
          \t\t\t}'''
          assert old in service, 'appointment duplicate block not found'
          service = service.replace(old, new, 1)

          service = service.replace(
          "if (minAmount && maxAmount && Number(maxAmount) < Number(minAmount))",
          "if (minAmount && maxAmount && compareAmounts(maxAmount, minAmount) < 0)",
          1,
          )

          old = '''\t\t\tconst memberships = (
          \t\t\t\tawait repository.listBodyMemberships(bodies.map((body) => body.id))
          \t\t\t).filter((membership) => membership.lifecycle_status === 'active');'''
          new = '''\t\t\tconst approvalAt = this.now();
          \t\t\tconst memberships = (
          \t\t\t\tawait repository.listBodyMemberships(bodies.map((body) => body.id))
          \t\t\t).filter((membership) => membershipEffectiveOn(membership, approvalAt));'''
          assert old in service, 'framework membership filter not found'
          service = service.replace(old, new, 1)
          service = service.replace('approved_at: this.now()\n\t\t\t});', 'approved_at: approvalAt\n\t\t\t});', 1)

          old = '''\t\t\tconst membership = await repository.findActiveBodyMembership(
          \t\t\t\tmeeting.governance_body_id,
          \t\t\t\tmemberId
          \t\t\t);'''
          new = '''\t\t\tconst membership = await repository.findActiveBodyMembership(
          \t\t\t\tmeeting.governance_body_id,
          \t\t\t\tmemberId,
          \t\t\t\tmeeting.scheduled_at
          \t\t\t);'''
          assert old in service, 'meeting membership lookup not found'
          service = service.replace(old, new, 1)

          old = '''\t\tconst value = Number(item.decision_amount);
          \t\tif (rule.min_amount !== null && value < Number(rule.min_amount)) return false;
          \t\tif (rule.max_amount !== null && value > Number(rule.max_amount)) return false;'''
          new = '''\t\tif (rule.min_amount !== null && compareAmounts(item.decision_amount, rule.min_amount) < 0)
          \t\t\treturn false;
          \t\tif (rule.max_amount !== null && compareAmounts(item.decision_amount, rule.max_amount) > 0)
          \t\t\treturn false;'''
          assert old in service, 'authority comparison block not found'
          service = service.replace(old, new, 1)

          old = '''\t\t\tif (!(await repository.findActiveBodyMembership(policy.approval_body_id, actor.memberId)))
          \t\t\t\tthrow new GovernanceValidationError(
          \t\t\t\t\t'Policy approver must hold an active appointment to the approval body.'
          \t\t\t\t);'''
          new = '''\t\t\tconst approvalAt = this.now();
          \t\t\tif (
          \t\t\t\t!(await repository.findActiveBodyMembership(
          \t\t\t\t\tpolicy.approval_body_id,
          \t\t\t\t\tactor.memberId,
          \t\t\t\t\tapprovalAt
          \t\t\t\t))
          \t\t\t)
          \t\t\t\tthrow new GovernanceValidationError(
          \t\t\t\t\t'Policy approver must hold an active appointment to the approval body.'
          \t\t\t\t);'''
          assert old in service, 'policy membership lookup not found'
          service = service.replace(old, new, 1)
          # The next policy approval timestamp is the second remaining direct this.now() approval assignment.
          marker = "approved_by_member_id: actor.memberId,\n\t\t\t\tapproved_at: this.now()"
          assert marker in service, 'policy approval timestamp not found'
          service = service.replace(marker, "approved_by_member_id: actor.memberId,\n\t\t\t\tapproved_at: approvalAt", 1)

          old = '''\t\t\tif (!conflict) throw new RecordNotFoundError('Conflict declaration not found.');
          \t\t\tconst updated = await repository.updateConflict(actor.organisationId, conflict.id, {'''
          new = '''\t\t\tif (!conflict) throw new RecordNotFoundError('Conflict declaration not found.');
          \t\t\tif (conflict.lifecycle_status !== 'open')
          \t\t\t\tthrow new GovernanceValidationError(
          \t\t\t\t\t'Only an open conflict declaration can receive its governed review outcome.'
          \t\t\t\t);
          \t\t\tconst updated = await repository.updateConflict(actor.organisationId, conflict.id, {'''
          assert old in service, 'conflict lifecycle block not found'
          service = service.replace(old, new, 1)
          service_path.write_text(service)

          repo_path = Path('app/src/lib/server/governance/governance-repository.ts')
          repo = repo_path.read_text()
          old = '''\tasync findActiveBodyMembership(
          \t\tbodyId: string,
          \t\tmemberId: string
          \t): Promise<GovernanceBodyMembershipRecord | undefined> {
          \t\treturn this.db
          \t\t\t.selectFrom('governance_body_memberships')
          \t\t\t.selectAll()
          \t\t\t.where('governance_body_id', '=', bodyId)
          \t\t\t.where('organisation_member_id', '=', memberId)
          \t\t\t.where('lifecycle_status', '=', 'active')
          \t\t\t.orderBy('appointed_on', 'desc')
          \t\t\t.executeTakeFirst();
          \t}'''
          new = '''\tasync findActiveBodyMembership(
          \t\tbodyId: string,
          \t\tmemberId: string,
          \t\teffectiveAt: Date
          \t): Promise<GovernanceBodyMembershipRecord | undefined> {
          \t\tconst day = effectiveAt.toISOString().slice(0, 10);
          \t\tconst memberships = await this.db
          \t\t\t.selectFrom('governance_body_memberships')
          \t\t\t.selectAll()
          \t\t\t.where('governance_body_id', '=', bodyId)
          \t\t\t.where('organisation_member_id', '=', memberId)
          \t\t\t.where('lifecycle_status', '=', 'active')
          \t\t\t.orderBy('appointed_on', 'desc')
          \t\t\t.execute();
          \t\treturn memberships.find(
          \t\t\t(membership) =>
          \t\t\t\tmembership.appointed_on.toISOString().slice(0, 10) <= day &&
          \t\t\t\t(!membership.term_ends_on || membership.term_ends_on.toISOString().slice(0, 10) >= day)
          \t\t);
          \t}'''
          assert old in repo, 'repository active membership method not found'
          repo_path.write_text(repo.replace(old, new, 1))

          page_server_path = Path('app/src/routes/(app)/governance/+page.server.ts')
          page_server = page_server_path.read_text()
          old = '''\t\treturn { ...workspace, members, actorMemberId: actor.memberId };'''
          new = '''\t\tconst clientWorkspace = {
          \t\t\t...workspace,
          \t\t\tethicsCases: workspace.ethicsCases.map(({ created_by_member_id, ...ethicsCase }) => {
          \t\t\t\tvoid created_by_member_id;
          \t\t\t\treturn ethicsCase;
          \t\t\t})
          \t\t};
          \t\treturn { ...clientWorkspace, members, actorMemberId: actor.memberId };'''
          assert old in page_server, 'workspace serialization return not found'
          page_server_path.write_text(page_server.replace(old, new, 1))
          PY
      - name: Install and format
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/lib/server/governance/governance-service.ts \
            src/lib/server/governance/governance-repository.ts \
            'src/routes/(app)/governance/+page.server.ts' \
            'src/routes/(app)/governance/+page.svelte'
          pnpm lint
          pnpm check
      - name: Commit fixes and remove maintenance workflow
        run: |
          rm .github/workflows/f02-release-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden F02 governance release controls"
          git push origin HEAD:feat/f02-corporate-governance
