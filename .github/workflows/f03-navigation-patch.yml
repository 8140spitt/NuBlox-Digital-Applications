name: F03 Navigation Patch

on:
  push:
    branches:
      - feat/f03-enterprise-performance-management
    paths:
      - '.github/workflows/f03-navigation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f03-enterprise-performance-management
      - name: Add F03 navigation entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/routes/(app)/+layout.server.ts')
          s = p.read_text()
          old = """\t\t\titems: [\n\t\t\t\t{\n\t\t\t\t\tid: 'strategy',\n\t\t\t\t\tlabel: 'Strategy & enterprise planning',\n\t\t\t\t\thref: '/strategy',\n\t\t\t\t\tdescription:\n\t\t\t\t\t\t'Purpose, environmental analysis, strategic choices and objectives with controlled versioning.'\n\t\t\t\t}\n\t\t\t]\n"""
          new = """\t\t\titems: [\n\t\t\t\t{\n\t\t\t\t\tid: 'strategy',\n\t\t\t\t\tlabel: 'Strategy & enterprise planning',\n\t\t\t\t\thref: '/strategy',\n\t\t\t\t\tdescription:\n\t\t\t\t\t\t'Purpose, environmental analysis, strategic choices and objectives with controlled versioning.'\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\tid: 'enterprise-performance',\n\t\t\t\t\tlabel: 'Enterprise performance',\n\t\t\t\t\thref: '/performance',\n\t\t\t\t\tdescription:\n\t\t\t\t\t\t'Performance frameworks, executive reporting, variance intervention, benchmarking and benefits realisation.'\n\t\t\t\t}\n\t\t\t]\n"""
          if old not in s:
              raise SystemExit('Expected strategy workspace block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/f03-navigation-patch.yml
      - name: Commit navigation
        run: |
          git config user.name '8140spitt'
          git config user.email '56647740+8140spitt@users.noreply.github.com'
          git add app/src/routes/'(app)'/+layout.server.ts .github/workflows/f03-navigation-patch.yml
          git commit -m 'F03: add enterprise performance workspace navigation'
          git push origin HEAD:feat/f03-enterprise-performance-management
