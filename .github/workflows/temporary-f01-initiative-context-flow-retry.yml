name: Temporary F01 Initiative Context Inheritance Repair Retry

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-f01-initiative-context-flow-retry.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml

      - name: Apply initiative context inheritance repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/temporary-f01-initiative-context-flow.yml').read_text()
          marker = "          python3 <<'PY'\n"
          body = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(script, 'initiative-context-repair.py', 'exec'))
          PY

      - name: Install dependencies
        run: pnpm --dir appv2 install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm --dir appv2 exec prettier --write \
            src/lib/server/strategy/execution-review-service.ts \
            'src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte'

      - name: Lint
        run: pnpm --dir appv2 lint

      - name: Type-check
        run: pnpm --dir appv2 check

      - name: Unit tests
        run: pnpm --dir appv2 test:unit

      - name: Production build
        run: pnpm --dir appv2 build

      - name: Commit validated repair
        run: |
          rm .github/workflows/temporary-f01-initiative-context-flow.yml
          rm .github/workflows/temporary-f01-initiative-context-flow-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appv2/src/lib/server/strategy/execution-review-service.ts \
            'appv2/src/routes/[tenant]/app/(protected)/functions/f01/strategies/[strategy]/business-planning/new/[record]/+page.svelte' \
            .github/workflows/temporary-f01-initiative-context-flow.yml \
            .github/workflows/temporary-f01-initiative-context-flow-retry.yml
          git commit -m 'fix(v2): inherit initiative context from business plan'
          git push origin HEAD:main
