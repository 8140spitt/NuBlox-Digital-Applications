name: Format F01 Golden Thread Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f01-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Format integration proof
        working-directory: appv2
        run: pnpm exec prettier --write src/lib/server/strategy/f01-golden-thread.integration.test.ts vitest.integration.config.ts package.json vite.config.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(v2): format F01 golden-thread proof"
          git push origin main
