name: F01 Tranche B Post Merge Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '#131')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged feature branch
        run: git push origin --delete feat/f01-business-planning-operating-model
      - name: Remove one-time cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/f01-tranche-b-post-merge-cleanup.yml
          git commit -m 'Remove F01 tranche B post-merge cleanup'
          git push origin HEAD:main
