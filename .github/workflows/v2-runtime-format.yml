name: Temporary V2 runtime formatter

on:
  push:
    branches:
      - fix/lifecycle-workflow-runtime

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lifecycle-workflow-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - working-directory: appv2
        run: pnpm install --frozen-lockfile
      - working-directory: appv2
        run: pnpm exec prettier --write src/lib/server/platform/workflow-request-service.ts src/lib/server/strategy/f01-configured-workflow.integration.test.ts 'src/routes/[tenant]/app/(protected)/my-work/[request]/+page.svelte'
      - run: rm .github/workflows/v2-runtime-format.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add appv2/src/lib/server/platform/workflow-request-service.ts appv2/src/lib/server/strategy/f01-configured-workflow.integration.test.ts 'appv2/src/routes/[tenant]/app/(protected)/my-work/[request]/+page.svelte' .github/workflows/v2-runtime-format.yml
          git commit -m "style(v2): format workflow runtime fix"
          git push origin HEAD:fix/lifecycle-workflow-runtime
