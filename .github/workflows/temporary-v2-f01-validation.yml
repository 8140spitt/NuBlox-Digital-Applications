name: Temporary V2 F01 Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-v2-f01-validation.yml'

permissions:
  contents: write

jobs:
  format-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: appv2/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: appv2
        run: pnpm install --frozen-lockfile
      - name: Repair F01 internal navigation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('appv2/src/routes/[tenant]/app/(protected)/functions/f01/+page.svelte')
          source = path.read_text()
          source = source.replace(
              "import { routes } from '$lib/routing/route-contract';",
              "import { routes } from '$lib/routing/route-contract';\n\timport { resolveInternalPath as resolve } from '$lib/routing/resolve-path';"
          )
          source = source.replace(
              "<a href={routes.strategyFramework(data.tenant.slug, framework.publicId)}>",
              "<a href={resolve(routes.strategyFramework(data.tenant.slug, framework.publicId))}>"
          )
          path.write_text(source)
          PY
      - name: Format and validate V2 F01 source
        working-directory: appv2
        run: pnpm exec prettier --write src
      - name: Lint
        working-directory: appv2
        run: pnpm lint
      - name: Type-check
        working-directory: appv2
        run: pnpm check
      - name: Unit tests
        working-directory: appv2
        run: pnpm test:unit
      - name: Build
        working-directory: appv2
        run: pnpm build
      - name: Commit validated F01 source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appv2/src
          git commit -m "fix(v2): validate F01 strategy slice"
          git push origin main
